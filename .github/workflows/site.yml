# Builds and checks the site on every pull request and on main: typecheck, the
# test suite (content and anchor parity, highlighter and search parity, static
# render + hydration, the offline file opened from disk), the Gatsby build, the
# offline export, structural verification, the TypeScript and C# catalogs' examples
# run for real — and that the committed offline files are exactly what the sources produce.
name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATSBY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests with coverage
        run: npx vitest run --coverage

      - name: Build site and offline file
        run: npm run build

      - name: Verify built pages
        run: npm run verify

      - name: Set up .NET for the C# examples
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Run the TypeScript and C# examples
        # The Kotlin examples need kotlinc and pinned library jars this job does not install; they
        # run locally with `npm run examples` (README: Running the examples).
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: npm run examples -- --lang typescript,csharp --require-all

      - name: Offline file is current
        run: |
          # Tracked changes AND never-committed files (a newly published catalog's offline/<id>.html).
          stale="$(git status --porcelain -- index.html offline)"
          if [ -n "$stale" ]; then
            echo "::error::the offline files are stale or uncommitted — run 'npm run build' and commit the result."
            echo "$stale"
            exit 1
          fi
