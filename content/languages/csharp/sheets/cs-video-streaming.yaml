id: cs-video-streaming
concept: media.video-streaming
scope: platform
title: "Video Streaming — HLS, DASH & MediaElement"
group: "Networking & media"
subtitle: "Which player plays which protocol on MAUI, WinUI, WPF and Blazor; what a multivariant playlist holds and how a rendition is picked; state, errors and recovery; live versus on-demand; DRM; and the app's lifecycle."
