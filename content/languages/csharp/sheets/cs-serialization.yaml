id: cs-serialization
concept: serialization.codecs
scope: shared
title: "Serialization — System.Text.Json & Friends"
group: Shared concepts
subtitle: "Records to JSON and back with System.Text.Json: options you reuse, required and missing members, nulls, unknown keys, dates, enums, custom converters, polymorphism, source generation for AOT, JsonNode, streaming, errors with their path — plus XML, and where Protobuf fits."
applies:
  platforms: [dotnet]
  runtime: .NET (System.Text.Json, System.Xml); the same in MAUI, WPF, WinUI and Blazor
  versions: { csharp: ">=12", dotnet: ">=9" }
