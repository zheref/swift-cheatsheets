id: cs-networking-protocols
concept: networking.protocols
scope: platform
title: "Networking — SOAP, gRPC & GraphQL"
group: "Networking & media"
subtitle: "SOAP envelopes with XDocument or a dotnet-svcutil proxy, GraphQL over plain HttpClient or StrawberryShake, gRPC with Grpc.Net.Client (and gRPC-Web for Blazor WebAssembly), SignalR for push — and which one to choose."
applies:
  platforms: [dotnet]
  runtime: .NET (System.Net.Http, System.Xml.Linq, System.Text.Json); gRPC and WCF clients need their NuGet packages
  versions: { csharp: ">=12", dotnet: ">=8" }
sources:
  - title: Overview of gRPC on .NET
    url: https://learn.microsoft.com/en-us/aspnet/core/grpc/
  - title: Call gRPC services with the .NET client
    url: https://learn.microsoft.com/en-us/aspnet/core/grpc/client
  - title: WCF dotnet-svcutil tool overview — .NET
    url: https://learn.microsoft.com/en-us/dotnet/core/additional-tools/dotnet-svcutil-guide
  - title: GraphQL over HTTP
    url: https://graphql.org/learn/serving-over-http/
  - title: SOAP 1.1 — W3C Note
    url: https://www.w3.org/TR/2000/NOTE-SOAP-20000508/
cards:
  - id: what-goes-over-the-wire
    kind: table
    title: What goes over the wire
    note: "All three ride on HTTP, but each has its own envelope and its own place for errors: read the error where the protocol puts it, not only the HTTP status."
    headers: [Protocol, Request, Errors arrive as, The .NET client]
    rows:
      - - SOAP 1.1
        - "`POST` of an XML `Envelope`; `Content-Type: text/xml`, a `SOAPAction` header"
        - "a `soap:Fault` in the body, with HTTP 500"
        - "`XDocument` + `HttpClient`, or a `dotnet-svcutil` proxy (`System.ServiceModel.Http`)"
      - - SOAP 1.2
        - "`Content-Type: application/soap+xml; action=\"…\"`, no `SOAPAction`"
        - "`env:Fault` with `Code` / `Reason`"
        - "the same; `BasicHttpBinding` is 1.1, a `CustomBinding` gives 1.2"
      - - GraphQL
        - "`POST` of JSON `{ query, variables, operationName }` to one endpoint"
        - "`errors` beside `data`, **usually with HTTP 200**; `data` may be partial"
        - "`HttpClient` + `System.Text.Json`, or StrawberryShake (generated, typed)"
      - - gRPC
        - "HTTP/2 `POST /package.Service/Method`, Protobuf frames"
        - "a `grpc-status` trailer: `RpcException.StatusCode`"
        - "`Grpc.Net.Client` with stubs generated by `Grpc.Tools`; gRPC-Web in the browser"
      - - SignalR
        - "a WebSocket (or SSE / long polling) to a hub; JSON or MessagePack messages"
        - "a faulted `InvokeAsync` task, the `Closed` event"
        - "`Microsoft.AspNetCore.SignalR.Client` `HubConnection`"
  - id: soap-envelope-and-fault
    kind: code
    title: "SOAP: build the envelope and POST it with the right headers"
    note: "For one or two operations without WSDL tooling, `XElement` and `HttpClient` are shorter than a generated proxy, and the namespaces and the quoted `SOAPAction` are the parts people get wrong."
    prerequisites: &run
      - .NET 8 SDK or later
      - "`dotnet new console -o Demo`, replace `Demo/Program.cs` with the example, then `dotnet run --project Demo`"
    code: |-
      using System.Xml.Linq;

      XNamespace soap = "http://schemas.xmlsoap.org/soap/envelope/";
      XNamespace ord = "urn:shop:orders";
      using var http = new HttpClient(new WireLog()) { BaseAddress = new("https://legacy.shop.example/") };

      // XElement escapes values (quotes, ampersands): never build SOAP XML by concatenation.
      var envelope = new XElement(soap + "Envelope", new XAttribute(XNamespace.Xmlns + "soap", soap),
          new XElement(soap + "Body",
              new XElement(ord + "GetOrderStatus", new XElement(ord + "orderId", "o-1 & co"))));

      using var request = new HttpRequestMessage(HttpMethod.Post, "OrderService.asmx");
      request.Content = new StringContent(envelope.ToString(SaveOptions.DisableFormatting), null, "text/xml");
      request.Headers.Add("SOAPAction", "\"urn:shop:orders/GetOrderStatus\"");      // SOAP 1.1: required, quoted
      // SOAP 1.2 instead: Content-Type application/soap+xml; action="urn:shop:orders/GetOrderStatus"
      using var response = await http.SendAsync(request);                           // read it as the next card does

      // Prints what goes over the wire.
      sealed class WireLog : HttpMessageHandler
      {
          protected override async Task<HttpResponseMessage> SendAsync(
              HttpRequestMessage request, CancellationToken ct)
          {
              Console.WriteLine($"POST {request.RequestUri!.AbsolutePath}");
              Console.WriteLine($"Content-Type: {request.Content!.Headers.ContentType}");
              Console.WriteLine($"SOAPAction: {request.Headers.GetValues("SOAPAction").Single()}");
              Console.WriteLine(await request.Content.ReadAsStringAsync(ct));
              return new HttpResponseMessage();
          }
      }
    expected: |-
      POST /OrderService.asmx
      Content-Type: text/xml; charset=utf-8
      SOAPAction: "urn:shop:orders/GetOrderStatus"
      <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body><GetOrderStatus xmlns="urn:shop:orders"><orderId>o-1 &amp; co</orderId></GetOrderStatus></soap:Body></soap:Envelope>
    sources:
      - title: LINQ to XML overview — .NET
        url: https://learn.microsoft.com/en-us/dotnet/standard/linq/linq-xml-overview
    validation: &ran
      status: ran
      toolchain: .NET SDK 9.0.304 (net9.0, C# 13)
      date: "2026-11-16"
  - id: soap-reply-and-fault
    kind: code
    title: "SOAP: read the response, a Fault, or a reply that is not SOAP"
    note: "A SOAP 1.1 fault arrives with HTTP 500, so parse the XML before checking the status, but only after checking that the reply is XML at all."
    prerequisites: *run
    code: |-
      using System.Net;
      using System.Xml.Linq;

      XNamespace soap = "http://schemas.xmlsoap.org/soap/envelope/";
      XNamespace ord = "urn:shop:orders";
      var ok = Envelope(new XElement(ord + "GetOrderStatusResponse", new XElement(ord + "status", "shipped")));
      var fault = Envelope(new XElement(soap + "Fault",
          new XElement("faultcode", "soap:Client"), new XElement("faultstring", "Unknown order o-9")));

      var gateway = Reply(502, "text/html", "<h1>Bad gateway</h1>");
      foreach (var reply in new[] { Reply(200, "text/xml", ok), Reply(500, "text/xml", fault), gateway })
      {
          try
          {
              var body = await ReadBodyAsync(reply);
              Console.WriteLine("status: " + (string?)body.Descendants(ord + "status").SingleOrDefault());
          }
          catch (SoapFaultException e) { Console.WriteLine($"fault {e.Code}: {e.Message}"); }
          catch (HttpRequestException e) { Console.WriteLine($"not a SOAP reply: HTTP {(int?)e.StatusCode}"); }
      }

      async Task<XElement> ReadBodyAsync(HttpResponseMessage response)
      {
          // A fault comes with 500 (SOAP 1.2 Sender fault: 400): parse before the status, but only XML.
          var type = response.Content.Headers.ContentType?.MediaType;
          if (type is not ("text/xml" or "application/soap+xml"))
              throw new HttpRequestException("not a SOAP reply", null, response.StatusCode);
          var body = XDocument.Parse(await response.Content.ReadAsStringAsync()).Root!.Element(soap + "Body")!;
          if (body.Element(soap + "Fault") is { } f)
              throw new SoapFaultException((string?)f.Element("faultcode"), (string?)f.Element("faultstring"));
          response.EnsureSuccessStatusCode();
          return body;
      }

      string Envelope(XElement content) =>
          new XElement(soap + "Envelope", new XAttribute(XNamespace.Xmlns + "soap", soap),
              new XElement(soap + "Body", content)).ToString(SaveOptions.DisableFormatting);

      static HttpResponseMessage Reply(int status, string type, string body) =>
          new((HttpStatusCode)status) { Content = new StringContent(body, null, type) };

      sealed class SoapFaultException(string? code, string? reason) : Exception(reason)
      {
          public string? Code => code;
      }
    expected: |-
      status: shipped
      fault soap:Client: Unknown order o-9
      not a SOAP reply: HTTP 502
    sources:
      - title: SOAP 1.1 — W3C Note, The SOAP Fault
        url: https://www.w3.org/TR/2000/NOTE-SOAP-20000508/
    validation: *ran
  - id: soap-generated-proxy
    kind: code
    title: "SOAP: a generated proxy with dotnet-svcutil"
    note: "For a large WSDL, generate the client (typed requests, the SOAP plumbing done, faults as `FaultException`), and abort rather than close a client whose channel faulted."
    prerequisites:
      - "`dotnet tool install --global dotnet-svcutil`, then `dotnet-svcutil https://legacy.shop.example/OrderService.svc?wsdl` in the project folder"
      - "It writes `ServiceReference/Reference.cs` and adds the WCF client packages (`System.ServiceModel.Http`, `System.ServiceModel.Primitives`)"
    code: |-
      using System.ServiceModel;
      using ServiceReference;                                            // the namespace dotnet-svcutil generated

      var client = new OrderServiceClient(
          new BasicHttpBinding(BasicHttpSecurityMode.Transport) { SendTimeout = TimeSpan.FromSeconds(15) },
          new EndpointAddress("https://legacy.shop.example/OrderService.svc"));
      try
      {
          string status = await client.GetOrderStatusAsync("o-1");      // the operation's generated Async method
          Console.WriteLine(status);
          await client.CloseAsync();
      }
      catch (FaultException<OrderFault> fault)                           // a fault the contract declares
      {
          Console.WriteLine($"{fault.Detail.Reason} ({fault.Code.Name})");
          client.Abort();
      }
      catch (FaultException fault)                                       // any other soap:Fault
      {
          Console.WriteLine(fault.Message);
          client.Abort();
      }
      catch (Exception e) when (e is CommunicationException or TimeoutException)   // transport failure, timeout
      {
          client.Abort();
          throw;
      }
    expected: "Prints the order's status, or the fault's reason; the client is closed on success and aborted after a fault or a transport failure."
    applies:
      requires: [System.ServiceModel.Http]
      versions: { csharp: ">=12", dotnet: ">=8", system-servicemodel-http: ">=8.1" }
    sources:
      - title: WCF dotnet-svcutil tool overview — .NET
        url: https://learn.microsoft.com/en-us/dotnet/core/additional-tools/dotnet-svcutil-guide
      - title: FaultException<TDetail> — .NET API
        url: https://learn.microsoft.com/en-us/dotnet/api/system.servicemodel.faultexception-1
    validation:
      status: excerpt
      host: a .NET project with a service reference generated by dotnet-svcutil from the service's WSDL (WCF client packages not installed here)
  - id: graphql-query-variables
    kind: code
    title: "GraphQL: a typed query with variables over HttpClient"
    note: "One `POST` of `{ query, variables }` to one endpoint, with values sent as `variables` and never formatted into the query text."
    prerequisites: *run
    code: |-
      using System.Net.Http.Json;
      using System.Text.Json;

      using var http = new HttpClient(new FakeGraphQL()) { BaseAddress = new Uri("https://shop.example/") };
      var gql = new GraphQLClient(http);

      // Values travel in "variables", never formatted into the query text.
      const string GetOrder = "query GetOrder($id: ID!) { order(id: $id) { id status } }";
      var result = await gql.SendAsync<OrderData>(GetOrder, new { id = "o-1" });
      Console.WriteLine($"order {result.Data?.Order?.Id}: {result.Data?.Order?.Status}");

      sealed class GraphQLClient(HttpClient http)
      {
          public async Task<GraphQLResponse<T>> SendAsync<T>(
              string query, object? variables, CancellationToken ct = default)
          {
              using var response = await http.PostAsJsonAsync("graphql", new { query, variables }, ct);
              response.EnsureSuccessStatusCode();                  // transport only: GraphQL errors arrive with 200
              return (await response.Content.ReadFromJsonAsync<GraphQLResponse<T>>(ct))!;
          }
      }

      record GraphQLResponse<T>(T? Data, GraphQLError[]? Errors);

      record GraphQLError(string Message, JsonElement[]? Path, Dictionary<string, JsonElement>? Extensions);

      record Order(string Id, string Status);

      record OrderData(Order? Order);

      sealed class FakeGraphQL : HttpMessageHandler
      {
          protected override async Task<HttpResponseMessage> SendAsync(
              HttpRequestMessage request, CancellationToken ct)
          {
              Console.WriteLine($"> POST /graphql {await request.Content!.ReadAsStringAsync(ct)}");
              const string Reply = """{"data":{"order":{"id":"o-1","status":"shipped"}}}""";
              return new HttpResponseMessage { Content = new StringContent(Reply, null, "application/json") };
          }
      }
    expected: |-
      > POST /graphql {"query":"query GetOrder($id: ID!) { order(id: $id) { id status } }","variables":{"id":"o-1"}}
      order o-1: shipped
    sources:
      - title: GraphQL over HTTP
        url: https://graphql.org/learn/serving-over-http/
    validation: *ran
  - id: graphql-query-mutation-errors
    kind: code
    title: "GraphQL: a mutation, and errors beside data"
    note: "A `200 OK` can still carry `errors`, so read them first, keep whatever `data` is not null, and treat `extensions.code` as optional."
    prerequisites: *run
    code: |-
      using System.Net.Http.Json;
      using System.Text.Json;

      using var http = new HttpClient(new FakeGraphQL()) { BaseAddress = new Uri("https://shop.example/") };
      var gql = new GraphQLClient(http);

      const string CancelOrder = "mutation CancelOrder($id: ID!) { cancelOrder(id: $id) { id status } }";
      var result = await gql.SendAsync<CancelData>(CancelOrder, new { id = "o-1" });

      // Errors first; then use whatever data is not null (it may be partly filled in).
      foreach (var error in result.Errors ?? [])
      {
          var code = error.Extensions?.GetValueOrDefault("code").ToString();     // extensions.code is optional
          Console.WriteLine($"error at {string.Join('.', error.Path ?? [])} [{code}]: {error.Message}");
      }
      Console.WriteLine($"cancelOrder is {(result.Data?.CancelOrder is null ? "null" : "set")}");

      sealed class GraphQLClient(HttpClient http)
      {
          public async Task<GraphQLResponse<T>> SendAsync<T>(
              string query, object? variables, CancellationToken ct = default)
          {
              using var response = await http.PostAsJsonAsync("graphql", new { query, variables }, ct);
              response.EnsureSuccessStatusCode();
              return (await response.Content.ReadFromJsonAsync<GraphQLResponse<T>>(ct))!;
          }
      }

      record GraphQLResponse<T>(T? Data, GraphQLError[]? Errors);

      record GraphQLError(string Message, JsonElement[]? Path, Dictionary<string, JsonElement>? Extensions);

      record Order(string Id, string Status);

      record CancelData(Order? CancelOrder);

      sealed class FakeGraphQL : HttpMessageHandler
      {
          protected override Task<HttpResponseMessage> SendAsync(HttpRequestMessage request, CancellationToken ct)
          {
              const string Reply = """
                  {"data":{"cancelOrder":null},
                   "errors":[{"message":"Order o-1 has already shipped","path":["cancelOrder"],
                              "extensions":{"code":"ORDER_SHIPPED"}}]}
                  """;
              var content = new StringContent(Reply, null, "application/json");
              return Task.FromResult(new HttpResponseMessage { Content = content });
          }
      }
    expected: |-
      error at cancelOrder [ORDER_SHIPPED]: Order o-1 has already shipped
      cancelOrder is null
    sources:
      - title: GraphQL over HTTP
        url: https://graphql.org/learn/serving-over-http/
      - title: "GraphQL specification — Response: errors"
        url: https://spec.graphql.org/October2021/#sec-Errors
    validation: *ran
  - id: graphql-strawberryshake
    kind: code
    title: "GraphQL: a typed client with StrawberryShake, in outline"
    note: "Once there are more than a handful of operations, generate the client from the schema: the result types follow each query's selection, and a schema change breaks the build instead of the screen."
    prerequisites:
      - "`dotnet new tool-manifest`, `dotnet tool install StrawberryShake.Tools --local`"
      - "`dotnet graphql init https://shop.example/graphql --clientName ShopClient`, and `dotnet add package StrawberryShake.Server` (`StrawberryShake.Blazor` or `StrawberryShake.Maui` in those apps)"
      - "Save operations as `.graphql` files beside it (below); the client is generated at build time, by a step that runs `dotnet`, so it must be on `PATH`"
    code: |-
      // GetOrder.graphql
      //   query GetOrder($id: ID!) { order(id: $id) { id status } }

      // MauiProgram.cs or Program.cs: the generated AddShopClient registers IShopClient
      builder.Services
          .AddShopClient()
          .ConfigureHttpClient(client => client.BaseAddress = new Uri("https://shop.example/graphql"));

      // A view model or component: one generated property per operation
      public sealed class OrderDetailsViewModel(IShopClient shop)
      {
          public async Task<string?> LoadStatus(string id, CancellationToken ct)
          {
              var result = await shop.GetOrder.ExecuteAsync(id, ct);
              if (result.Errors.Count > 0) return null;                     // or result.EnsureNoErrors() to throw
              return result.Data?.Order?.Status;
          }
      }
    expected: "`IShopClient.GetOrder.ExecuteAsync` sends the stored operation with `$id` as a variable and returns a result whose `Data` is typed to the query's selection and whose `Errors` lists GraphQL errors."
    applies:
      requires: [StrawberryShake]
      versions: { csharp: ">=12", dotnet: ">=8", strawberryshake: ">=16.7" }
    sources:
      - title: Get started with Strawberry Shake in a console app — ChilliCream
        url: https://chillicream.com/docs/strawberryshake/v14/get-started/console
    validation:
      status: excerpt
      host: a .NET project referencing StrawberryShake, with the client generated from the server's schema (not installed here)
  - id: grpc-unary-deadline-status
    kind: code
    title: "gRPC: the contract, a unary call, a deadline and status codes"
    note: "There is no default deadline: set one on every call, and branch on `RpcException.StatusCode` — `NotFound` and `InvalidArgument` are answers, `Unavailable` is worth a retry."
    prerequisites:
      - "`dotnet add package Grpc.Net.Client`, `Google.Protobuf` and `Grpc.Tools`"
      - "Save the contract as `Protos/orders.proto` and add `<Protobuf Include=\"Protos\\orders.proto\" GrpcServices=\"Client\" />` to the `.csproj`: the stubs are generated at build time"
    code: |-
      // Protos/orders.proto
      //   syntax = "proto3";
      //   option csharp_namespace = "Shop.Orders";
      //   package shop.orders;
      //   service Orders {
      //     rpc GetOrder (GetOrderRequest) returns (Order);
      //     rpc WatchOrder (WatchOrderRequest) returns (stream OrderEvent);
      //   }
      //   message GetOrderRequest { string id = 1; }
      //   message Order { string id = 1; string status = 2; }
      //   message WatchOrderRequest { string id = 1; }
      //   message OrderEvent { string id = 1; string status = 2; }
      using Grpc.Core;
      using Grpc.Net.Client;
      using Shop.Orders;

      // One channel for the app's lifetime: it owns the HTTP/2 connection. Clients are cheap.
      using var channel = GrpcChannel.ForAddress("https://orders.shop.example");
      var client = new Orders.OrdersClient(channel);

      try
      {
          Order order = await client.GetOrderAsync(new GetOrderRequest { Id = "o-1" },
              deadline: DateTime.UtcNow.AddSeconds(5));                     // a UTC instant, not a duration
          Console.WriteLine($"{order.Id}: {order.Status}");
      }
      catch (RpcException e)
      {
          Console.WriteLine(e.StatusCode switch
          {
              StatusCode.NotFound => "no such order",                       // an answer, not a fault
              StatusCode.DeadlineExceeded => "timed out",
              StatusCode.Unavailable => "offline: worth a retry",
              _ => $"{e.StatusCode}: {e.Status.Detail}",
          });
      }
    expected: "Prints `o-1: shipped`, or the branch for the call's gRPC status; a call still running after 5 seconds is aborted with `DeadlineExceeded`."
    applies:
      requires: [Grpc.Net.Client, Google.Protobuf, Grpc.Tools]
      versions: { csharp: ">=12", dotnet: ">=8", grpc-net-client: ">=2.85" }
    sources:
      - title: Call gRPC services with the .NET client
        url: https://learn.microsoft.com/en-us/aspnet/core/grpc/client
      - title: Reliable gRPC services with deadlines and cancellation
        url: https://learn.microsoft.com/en-us/aspnet/core/grpc/deadlines-cancellation
    validation:
      status: excerpt
      host: a .NET project with Grpc.Net.Client, Google.Protobuf and Grpc.Tools generating the stubs, and a gRPC server (not installed here)
  - id: grpc-server-stream-grpc-web
    kind: code
    title: "gRPC: a server stream with await foreach, and gRPC-Web for Blazor WebAssembly"
    note: "Dispose the streaming call (or cancel its token) when the screen goes away; in the browser, gRPC-Web carries unary and server-streaming calls only."
    prerequisites:
      - "The project and contract of the previous card"
      - "Blazor WebAssembly: also `dotnet add package Grpc.Net.Client.Web`, and enable gRPC-Web on the server (`app.UseGrpcWeb()`, `.EnableGrpcWeb()`, with CORS)"
    code: |-
      using Grpc.Core;
      using Grpc.Net.Client;
      using Grpc.Net.Client.Web;
      using Shop.Orders;

      public sealed class OrderTracker(Orders.OrdersClient client)
      {
          // Called when the tracking screen opens; ct is cancelled when it closes.
          public async Task Track(string orderId, Action<OrderEvent> show, CancellationToken ct)
          {
              using var call = client.WatchOrder(new WatchOrderRequest { Id = orderId }, cancellationToken: ct);
              try
              {
                  await foreach (var update in call.ResponseStream.ReadAllAsync(ct))
                      show(update);                                   // marshal to the UI thread (MAUI, WPF, WinUI)
              }
              catch (RpcException e) when (e.StatusCode == StatusCode.Cancelled) { }   // the screen closed
          }

          // Blazor WebAssembly has no HTTP/2 sockets: the same client over gRPC-Web.
          // GrpcWebText (base64) is the mode browsers need for server streaming.
          public static Orders.OrdersClient ForBrowser(string address) =>
              new(GrpcChannel.ForAddress(address, new GrpcChannelOptions
              {
                  HttpHandler = new GrpcWebHandler(GrpcWebMode.GrpcWebText, new HttpClientHandler()),
              }));
      }
    expected: "Each `OrderEvent` the server streams is shown as it arrives; cancelling the token ends the call with `StatusCode.Cancelled`, which is swallowed as a normal close."
    applies:
      requires: [Grpc.Net.Client, Grpc.Net.Client.Web]
      versions: { csharp: ">=12", dotnet: ">=8", grpc-net-client: ">=2.85" }
    sources:
      - title: gRPC-Web in ASP.NET Core gRPC apps
        url: https://learn.microsoft.com/en-us/aspnet/core/grpc/grpcweb
    validation:
      status: excerpt
      host: a .NET or Blazor WebAssembly project with the generated gRPC client and a streaming gRPC server (not installed here)
  - id: websocket-push
    kind: code
    title: "Bonus: server push over a WebSocket"
    note: "`ClientWebSocket` is in the box for raw push; in an app talking to ASP.NET Core, a SignalR `HubConnection` (`Microsoft.AspNetCore.SignalR.Client`, `.WithAutomaticReconnect()`) adds reconnection, hub methods and fallbacks on top."
    prerequisites: *run
    code: |-
      using System.Net;
      using System.Net.Sockets;
      using System.Net.WebSockets;
      using System.Security.Cryptography;
      using System.Text;

      var listener = new TcpListener(IPAddress.Loopback, 0);
      listener.Start();
      var server = PushUpdates(listener);
      var port = ((IPEndPoint)listener.LocalEndpoint).Port;

      using var socket = new ClientWebSocket();
      await socket.ConnectAsync(new Uri($"ws://127.0.0.1:{port}/orders/o-1"), default);   // pass the screen's token
      var buffer = new byte[4 * 1024];
      using var message = new MemoryStream();
      while (socket.State == WebSocketState.Open)                           // until the server's Close frame
      {
          var frame = await socket.ReceiveAsync(buffer.AsMemory(), default);
          message.Write(buffer, 0, frame.Count);
          if (frame.MessageType == WebSocketMessageType.Close || !frame.EndOfMessage) continue;   // or a part
          Console.WriteLine("update: " + Encoding.UTF8.GetString(message.ToArray()));
          message.SetLength(0);
      }
      await socket.CloseAsync(WebSocketCloseStatus.NormalClosure, "bye", default);
      await server;

      const string Rfc6455Guid = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11";

      static async Task PushUpdates(TcpListener listener)
      {
          using var tcp = await listener.AcceptTcpClientAsync();
          var stream = tcp.GetStream();
          var reader = new StreamReader(stream);
          var key = "";
          for (string? line; !string.IsNullOrEmpty(line = await reader.ReadLineAsync());)
              if (line.StartsWith("Sec-WebSocket-Key:")) key = line[18..].Trim();
          var accept = Convert.ToBase64String(SHA1.HashData(Encoding.ASCII.GetBytes(key + Rfc6455Guid)));
          var handshake = "HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\n";
          await stream.WriteAsync(Encoding.ASCII.GetBytes(handshake + $"Sec-WebSocket-Accept: {accept}\r\n\r\n"));
          using var ws = WebSocket.CreateFromStream(stream, new WebSocketCreationOptions { IsServer = true });
          foreach (var json in new[] { """{"status":"packed"}""", """{"status":"shipped"}""" })
              await ws.SendAsync(Encoding.UTF8.GetBytes(json), WebSocketMessageType.Text, true, default);
          await ws.CloseAsync(WebSocketCloseStatus.NormalClosure, "delivered", default);
      }
    expected: |-
      update: {"status":"packed"}
      update: {"status":"shipped"}
    sources:
      - title: WebSockets support in .NET
        url: https://learn.microsoft.com/en-us/dotnet/fundamentals/networking/websockets
      - title: ASP.NET Core SignalR .NET client
        url: https://learn.microsoft.com/en-us/aspnet/core/signalr/dotnet-client
    validation: *ran
  - id: choosing-a-protocol
    kind: table
    title: Choosing between REST, SOAP, gRPC and GraphQL
    note: "The server usually decides; when you do, choose by who calls it and how the data is shaped, not by fashion."
    headers: [Choose, When, The cost]
    rows:
      - - REST + JSON
        - "public or partner APIs, browsers and every client stack, HTTP caching matters"
        - "chatty for nested screens; the contract lives in OpenAPI, if anywhere"
      - - SOAP
        - "an existing enterprise or government service with a WSDL; WS-Security already in place"
        - "verbose XML, heavyweight tooling; nobody starts a new API with it"
      - - gRPC
        - "service-to-service, streaming both ways, strict contracts, low latency"
        - "HTTP/2 end to end; browsers need gRPC-Web (no client or bidirectional streams); not human-readable"
      - - GraphQL
        - "many screens wanting different slices of one graph; mobile on slow links"
        - "no HTTP caching of `POST`; query cost limits and errors-in-200 to handle"
      - - SignalR / WebSockets
        - "the server pushes: live status, chat, dashboards"
        - "a long-lived connection to keep alive across sleep and network changes"
  - id: protocols-rules
    kind: rules
    title: Rules worth saying out loud
    note: The mistakes that survive code review.
    items:
      - tone: bad
        text: "Building SOAP XML or a GraphQL query by string concatenation of user input: build XML with `XElement` (it escapes) and pass GraphQL values as `variables`."
      - tone: bad
        text: "Treating a GraphQL `200 OK` as success: check `errors` first, then use whatever `data` is not null."
      - tone: bad
        text: "Reading only the HTTP status of a SOAP call: a fault comes back as `500` (SOAP 1.2: `400` for a Sender fault) with the reason in the body — parse it before `EnsureSuccessStatusCode`."
      - tone: bad
        text: "A gRPC call without a deadline: it can wait forever. And a `GrpcChannel` per call: channels are expensive, clients are not."
      - tone: bad
        text: "Calling a generated gRPC or WCF method's blocking overload (`GetOrder`, not `GetOrderAsync`) on a UI thread or in Blazor WebAssembly: the app freezes."
      - tone: good
        text: "Wrap each protocol behind your own interface (`IOrderService`): screens and tests never see envelopes, stubs or `RpcException`."
      - tone: good
        text: "Generate clients from the contract (WSDL, `.proto`, GraphQL schema) once the API has more than a few operations, and regenerate in CI when it changes."
      - tone: neutral
        text: "Protobuf on gRPC is schema-first: add fields with new numbers, never reuse or renumber one, and old clients keep working."
