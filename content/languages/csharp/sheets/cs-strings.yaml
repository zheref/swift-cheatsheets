id: cs-strings
concept: strings.operations
scope: shared
title: "Strings — Standard Operations"
group: Shared concepts
subtitle: "UTF-16 chars underneath, text elements on screen. Search, split, slice with spans, compare ordinally or by culture, normalize, build, format and match text correctly."
applies:
  platforms: [dotnet]
  runtime: ".NET 9 base class library (System, System.Text, System.Globalization, System.Text.RegularExpressions); culture data from ICU"
  versions: { csharp: ">=13", dotnet: ">=9" }
