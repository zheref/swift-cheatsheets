id: cs-coverage
concept: meta.coverage
scope: language
title: Coverage against the Swift Catalog
group: Coverage
subtitle: Every Swift topic, and what this catalog has for it — an equivalent, a partial counterpart, or the reason there is none.
cards:
  - id: how-to-read
    kind: rules
    title: How to read the matrix
    note: Nothing here is a translation made to fill a gap.
    items:
      - tone: good
        text: "**equivalent** — a sheet here covers the same concept and shares its concept id, so the language selector lands on it from the Swift sheet."
      - tone: neutral
        text: "**partial** — a sheet here covers part of it under its own concept id, so the selector does not land on it: the Here column names it and the reason says what is missing."
      - tone: bad
        text: "**no counterpart** — nothing here; the reason says whether the topic does not exist in this language or is simply not written yet."
  - id: matrix
    kind: table
    title: Swift topic by topic
    note: In the Swift catalog's reading order.
    headers: [Swift topic, Disposition, Here, Why]
    rows:
      - ["SwiftUI — State & Data Flow", "partial", "MVVM State — INotifyPropertyChanged & Observable Collections", "the observable view model and collection a XAML binding watches; no view-owned state wrappers like `@State`"]
      - ["SwiftUI — Views, Layout & Animation", "equivalent", ".NET MAUI — XAML Views, Layout & Navigation", "pages with compiled bindings, layouts and sizing, CollectionView, Shell routes, animation and reusable views"]
      - ["SwiftUI vs UIKit", "equivalent", "XAML vs Code vs Blazor", "the same screen in XAML, in C# code and in Blazor, embedding one in another and choosing a stack"]
      - ["UIKit — Programmatic UI", "equivalent", "UI in C# Code — MAUI, WPF & WinUI without XAML", "the screen built in C#, typed bindings, syncing by hand, in-place list updates and the UI-thread rule"]
      - ["SwiftUI — Styling, Design Tokens & Theming", "equivalent", "Styling — XAML Resources, Styles, Themes & CSS Isolation", "resource-dictionary tokens, styles, light and dark themes, visual states, adaptive layout and scoped CSS"]
      - ["MVVM — View Models, Bindings & Observation", "equivalent", "MVVM State — INotifyPropertyChanged & Observable Collections", "a view model the view observes: change notification, commands, observable collections and testing it without the view"]
      - ["TCA — Core Loop", "equivalent", "Unidirectional State — Reducers, MVU & Fluxor", "state, action, pure reducer and effects — a store written by hand, then the same feature in Fluxor"]
      - ["TCA — Composition, Dependencies, Testing", "no counterpart", "—", "a Swift library's API"]
      - ["TCA + SwiftUI — Navigation & UI", "no counterpart", "—", "a Swift library's API on an Apple UI framework"]
      - ["Modern Swift Concurrency — Core", "equivalent", "Async/Await, Tasks & Cancellation", "tasks, WhenAll, cancellation tokens, async streams and callback bridging"]
      - ["Actors, Sendable & Isolation", "partial", "Shared State — lock, Interlocked, SemaphoreSlim, Channels", "locks, an async mutex and a channel-owned state; C# has no compiler-checked isolation or Sendable"]
      - ["Swift 6 Concurrency — Do's & Don'ts", "no counterpart", "—", "about migrating to Swift 6's strict concurrency checking"]
      - ["Multithreading — GCD vs Combine vs async/await", "partial", "Async/Await, Tasks & Cancellation", "Task-based async only; the Thread / ThreadPool / BackgroundWorker comparison is not drawn"]
      - ["Combine — Core", "equivalent", "Rx.NET — Core", "observables, subjects, the operators that matter, error handling and subscription lifetime"]
      - ["Timers & Async Patterns — Combine vs async/await", "equivalent", "Timers, Delays & Scheduled Work", "delays, `PeriodicTimer`, polling, timeouts, backoff and concurrency limits with an injected `TimeProvider`"]
      - ["SwiftUI + Combine — Wiring Them Together", "partial", "MVVM State — INotifyPropertyChanged & Observable Collections", "change notifications are the view-model → view connection point; no reactive library is involved"]
      - ["Timing Operators — Combine vs Swift Concurrency", "equivalent", "Timing Operators — Rx.NET vs Plain Async", "throttle, sample, delay, timeout, buffer and window, in Rx.NET and by hand, tested on virtual time"]
      - ["RxSwift — Core", "partial", "Rx.NET — Core", "Rx.NET is the same ReactiveX family and already stands as Combine's equivalent; traits, `DisposeBag` and RxCocoa bindings are RxSwift's own"]
      - ["Clean Code in Swift", "equivalent", "Clean Code in C#", "naming by the .NET guidelines, small methods, option records, XML docs, exceptions versus Try and guard clauses"]
      - ["SOLID in Swift", "equivalent", "SOLID in C#", "the five principles as before and after, with interfaces, constructor injection, variance and pattern matching"]
      - ["Functional Programming in Swift", "equivalent", "Functional Programming in C#", "pure functions and LINQ, composition and currying, records, a result type, laziness and immutable collections"]
      - ["Swift Language Essentials", "equivalent", "C# Language Essentials", "the same questions — optionals, enums, generics, errors, value vs reference, pattern matching — answered for C#"]
      - ["Collections — Types & Protocols", "equivalent", "Collections — List, Dictionary, HashSet & Friends", "which container and what it costs"]
      - ["Collections — Operation Cookbook", "equivalent", "Collections — LINQ Cookbook", "filter, project, fold, group, sort, chunk, zip"]
      - ["Strings — Characters, Unicode & Operations", "equivalent", "Strings — Standard Operations", "UTF-16 chars vs text elements, searching, slicing with spans, comparing, normalizing, formatting and matching"]
      - ["Serialization — Codable, JSON & Friends", "equivalent", "Serialization — System.Text.Json & Friends", "records to JSON and back, required and missing members, dates and enums, converters, polymorphism and errors"]
      - ["Swift Engineering Best Practices", "equivalent", "C# Engineering Best Practices", "design guidelines, typed exceptions, nullable discipline, structured logging, options, disposal and performance"]
      - ["Architectural Approaches", "equivalent", "Architectural Approaches", "MVC, MVVM, MVU and clean layering, a repository and use case, service lifetimes and vertical slices"]
      - ["Modularization Approaches", "equivalent", "Modularization — Projects, Assemblies & NuGet", "class-library projects, `internal` as the wall, contracts projects, central package management and packaging"]
      - ["Testing Approaches on iOS", "equivalent", "Testing Approaches in .NET", "tooling, injectable time and an xUnit class"]
      - ["UI & End-to-End Testing", "equivalent", "UI & End-to-End Testing", "view-model tests at the base, bUnit, Playwright for .NET and Appium, selecting by role and waiting without sleeps"]
      - ["Security, Authentication & Privacy", "equivalent", "Security, Authentication & Privacy", "where secrets live, OAuth with PKCE, JWT validation, AES-GCM and HMAC, injection and XSS, pinning and logs"]
      - ["Accessibility on Apple Platforms", "equivalent", "Accessibility in .NET UI", "names, roles and values for screen readers, focus and keyboard, announcements, text scaling and testing it"]
      - ["Localization & Internationalization", "equivalent", "Localization & Globalization", "cultures, translated resources, plurals, dates, money and sorting per culture, right-to-left and pseudo-localization"]
      - ["AI Workflows for Swift (Cursor + Claude)", "no counterpart", "—", "Swift-specific by design: it is about why Swift is harder for models and wiring Xcode to an agent"]
      - ["Algorithmic Patterns & Complexity", "equivalent", "Algorithmic Patterns & Complexity", "the BCL's costs and the same patterns, with `PriorityQueue` and `BinarySearch` included"]
      - ["Streaming & Time-Series Patterns", "equivalent", "Streaming & Time-Series Patterns", "windows and watermarks, sketches, rate limits and backpressure over `IAsyncEnumerable`, channels and Rx"]
      - ["Files, Text & Atomic I/O", "equivalent", ".NET — Files, Text & Atomic I/O", "the same file-safety questions on System.IO"]
      - ["Networking — REST with URLSession", "equivalent", "Networking — REST with HttpClient", "typed JSON calls on one long-lived client, errors as values, timeouts, retry, token refresh and pagination"]
      - ["Networking — SOAP, gRPC & GraphQL", "equivalent", "Networking — SOAP, gRPC & GraphQL", "the same three protocols from a .NET client, plus SignalR for push, and when each is the right one"]
      - ["Video Streaming — HLS & AVPlayer", "equivalent", "Video Streaming — HLS, DASH & MediaElement", "which player plays which protocol on each .NET UI stack, renditions, errors, live, DRM and lifecycle"]
      - ["Core Bluetooth (BLE)", "no counterpart", "—", "an Apple framework; Windows has `Windows.Devices.Bluetooth`, not written up yet"]
