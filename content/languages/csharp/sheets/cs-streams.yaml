  - id: streaming-pitfalls
    kind: rules
    title: Streaming pitfalls
    note: The mistakes that only show up under production load.
    items:
      - tone: bad
        text: "Unbounded buffers: `Channel.CreateUnbounded`, a `ConcurrentQueue` or Rx's `Buffer` on a hot source grow until the process dies. Bound them and state the full mode."
      - tone: bad
        text: "Recomputing the whole window per event (O(n·k) instead of O(n)) — slide it: add the new value, subtract the evicted one."
      - tone: bad
        text: "Using processing time when the business asks about event time. Network and device delays reorder everything."
      - tone: bad
        text: "Assuming exactly-once delivery. Design for at-least-once and make the consumer idempotent."
      - tone: bad
        text: "Summing squares for variance — it loses precision. Use Welford."
      - tone: bad
        text: "Hashing with `string.GetHashCode()` for anything saved, shared or merged: it is randomized per process. Use a stable hash (FNV-1a, or `XxHash64` from the `System.IO.Hashing` package)."
      - tone: bad
        text: "Blocking the producer to do per-event work. Hand off to a bounded `Channel<T>` and batch on the consumer side."
      - tone: neutral
        text: "A seeded `Random` replays the same sequence on one runtime, but the algorithm may change between .NET versions: persist the sample, not the seed."
      - tone: good
        text: "Decide the lateness policy explicitly: drop, hold until a watermark, or re-open the window and re-emit."
      - tone: good
        text: "Instrument the stream itself: input rate, drop count (the `itemDropped` callback), queue depth (`ChannelReader.Count`), end-to-end lag."
