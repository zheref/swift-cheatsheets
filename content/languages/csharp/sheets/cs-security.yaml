id: cs-security
concept: security.auth-and-data
scope: platform
title: "Security, Authentication & Privacy"
group: "Quality & reach"
subtitle: "Where each secret lives, OAuth 2.0 with PKCE, what validating a JWT really checks, AES-GCM, HMAC and PBKDF2 with System.Security.Cryptography, injection and XSS in SQL and Razor, certificate pinning, and logs without secrets — for MAUI, WPF, WinUI and Blazor."
