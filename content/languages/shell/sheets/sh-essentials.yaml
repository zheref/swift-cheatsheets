id: sh-essentials
concept: language.essentials
scope: language
title: Variables, branches and loops
group: Script syntax
subtitle: Choose a value, test it and iterate over records.
applies:
  platforms:
    - macos
  runtime: macOS /bin/sh and system utilities
  versions:
    macos: ">=12"
sources:
  - title: Apple Shell Scripting Primer
    url: https://developer.apple.com/library/archive/documentation/OpenSource/Conceptual/ShellScripting/Introduction/Introduction.html
cards:
  - id: example
    kind: code
    title: Select enabled stages
    note: Separate brackets and operands with spaces. Assignment has no spaces around the equals sign. Compare strings with = and integers with -eq.
    prerequisites:
      - Save as demo.sh in an empty directory and run /bin/sh ./demo.sh.
    code: |-
      for stage in build skip test; do
        if [ "$stage" != skip ]; then
          printf '%s\n' "$stage"
        fi
      done
    expected: |-
      build
      test
    validation:
      status: ran
      toolchain: macOS 27.0 /bin/sh (3.2.57)
      date: 2026-11-19
