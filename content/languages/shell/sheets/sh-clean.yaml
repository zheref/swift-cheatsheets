id: sh-clean
concept: practice.clean-code
scope: shared
title: Small commands with clear contracts
group: Programming and automation
subtitle: Name the input, guard the failure path and return one kind of result.
applies:
  platforms:
    - macos
  runtime: macOS /bin/sh and system utilities
  versions:
    macos: ">=12"
sources:
  - title: Apple Shell Scripting Primer
    url: https://developer.apple.com/library/archive/documentation/OpenSource/Conceptual/ShellScripting/Introduction/Introduction.html
cards:
  - id: example
    kind: code
    title: Give a function one result
    note: Check the contract before the work. Use return inside a function so its caller can decide whether failure should terminate the whole script.
    prerequisites:
      - Save as demo.sh in an empty directory and run /bin/sh ./demo.sh.
    code: |-
      format_stage() {
        [ "$#" -eq 1 ] || return 2
        printf '<%s>\n' "$1"
      }
      format_stage build
    expected: <build>
    validation:
      status: ran
      toolchain: macOS 27.0 /bin/sh (3.2.57)
      date: 2026-11-19
