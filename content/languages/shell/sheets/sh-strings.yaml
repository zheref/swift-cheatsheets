id: sh-strings
concept: strings.operations
scope: shared
title: String operations and pattern matching
group: Programming and automation
subtitle: Extract a file stem and distinguish literal, wildcard and regular-expression matching.
applies:
  platforms:
    - macos
  runtime: macOS /bin/sh and system utilities
  versions:
    macos: ">=12"
sources:
  - title: Apple Shell Scripting Primer
    url: https://developer.apple.com/library/archive/documentation/OpenSource/Conceptual/ShellScripting/Introduction/Introduction.html
cards:
  - id: example
    kind: code
    title: Strip a suffix
    note: The percent operator strips the shortest matching suffix. The pattern is a shell glob. Use grep -F for literal text and grep -E for extended regular expressions.
    prerequisites:
      - Save as demo.sh in an empty directory and run /bin/sh ./demo.sh.
    code: |-
      file=quarter.one.csv
      printf '%s\n' "${file%.*}"
    expected: quarter.one
    validation:
      status: ran
      toolchain: macOS 27.0 /bin/sh (3.2.57)
      date: 2026-11-19
