id: sh-functional
concept: principles.functional
scope: shared
title: Pure transformations
group: Programming and automation
subtitle: Transform each record independently so the same input gives the same result.
applies:
  platforms:
    - macos
  runtime: macOS /bin/sh and system utilities
  versions:
    macos: ">=12"
sources:
  - title: Apple Shell Scripting Primer
    url: https://developer.apple.com/library/archive/documentation/OpenSource/Conceptual/ShellScripting/Introduction/Introduction.html
cards:
  - id: example
    kind: code
    title: Map records with a filter
    note: Give a transformation stdin and stdout only. The filter can be reused with a file, another program or a test fixture.
    prerequisites:
      - Save as demo.sh in an empty directory and run /bin/sh ./demo.sh.
    code: printf '%s\n' 2 4 | awk '{ print $1 * 5 }'
    expected: |-
      10
      20
    validation:
      status: ran
      toolchain: macOS 27.0 /bin/sh (3.2.57)
      date: 2026-11-19
