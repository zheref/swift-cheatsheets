id: sh-jobs
concept: concurrency.async-await
scope: platform
title: Start work and wait for completion
group: Terminal and platform
subtitle: Track the lifetime of a child job and observe its completion.
applies:
  platforms:
    - macos
  runtime: macOS /bin/sh and system utilities
  versions:
    macos: ">=12"
sources:
  - title: Apple Shell Scripting Primer
    url: https://developer.apple.com/library/archive/documentation/OpenSource/Conceptual/ShellScripting/Introduction/Introduction.html
cards:
  - id: example
    kind: code
    title: Wait for a specific child
    note: Capture $! immediately after starting a background command. wait surfaces its exit code. In a long-running script, arrange cleanup of your owned children when interrupted.
    prerequisites:
      - Save as demo.sh in an empty directory and run /bin/sh ./demo.sh.
    code: |-
      ( printf 'ready\n' ) &
      worker=$!
      wait "$worker" || exit $?
    expected: ready
    validation:
      status: ran
      toolchain: macOS 27.0 /bin/sh (3.2.57)
      date: 2026-11-19
