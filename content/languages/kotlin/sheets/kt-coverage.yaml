id: kt-coverage
concept: meta.coverage
scope: language
title: Coverage against the Swift Catalog
group: Coverage
subtitle: Every Swift topic, and what this catalog has for it — an equivalent, a partial counterpart, or the reason there is none.
cards:
  - id: how-to-read
    kind: rules
    title: How to read the matrix
    note: Nothing here is a translation made to fill a gap.
    items:
      - tone: good
        text: "**equivalent** — a sheet here covers the same concept and shares its concept id, so the language selector lands on it from the Swift sheet."
      - tone: neutral
        text: "**partial** — a sheet here covers part of it under its own concept id, so the selector does not land on it: the Here column names it and the reason says what is missing."
      - tone: bad
        text: "**no counterpart** — nothing here; the reason says whether the topic does not exist in this language or is simply not written yet."
  - id: matrix
    kind: table
    title: Swift topic by topic
    note: In the Swift catalog's reading order.
    headers: [Swift topic, Disposition, Here, Why]
    rows:
      - ["SwiftUI — State & Data Flow", "equivalent", "Jetpack Compose — State & Data Flow", "the same decision: local state, hoisting, an observable model, environment and view-scoped tasks"]
      - ["SwiftUI — Views, Layout & Animation", "no counterpart", "—", "Compose layout and animation are not written up yet"]
      - ["SwiftUI vs UIKit", "no counterpart", "—", "the analogous pair, Compose vs Android Views, is not written up yet"]
      - ["TCA — Core Loop", "partial", "Jetpack Compose — State & Data Flow", "unidirectional flow with one immutable UI state in a ViewModel; no reducer or effect library like TCA"]
      - ["TCA — Composition, Dependencies, Testing", "no counterpart", "—", "a Swift library's API"]
      - ["TCA + SwiftUI — Navigation & UI", "no counterpart", "—", "a Swift library's API; Navigation Compose is not written up yet"]
      - ["Modern Swift Concurrency — Core", "equivalent", "Coroutines — Core", "suspend functions, structured fan-out, failure propagation, cancellation and callback bridging"]
      - ["Actors, Sendable & Isolation", "partial", "Shared Mutable State — Mutex, Confinement, Actors", "Mutex, confinement and channel-owned state; Kotlin has no compiler-checked isolation or Sendable"]
      - ["Swift 6 Concurrency — Do's & Don'ts", "no counterpart", "—", "about migrating to Swift 6's strict concurrency checking"]
      - ["Multithreading — GCD vs Combine vs async/await", "partial", "Coroutines — Core", "coroutines and dispatchers only; the threads/executors vs RxJava vs coroutines comparison is not drawn"]
      - ["Combine — Core", "equivalent", "Flow — Core", "cold streams, subjects, operators, lifetime and bridging, with a Combine → Flow table"]
      - ["Timers & Async Patterns — Combine vs async/await", "partial", "Flow — Core", "a ticker, cancellation by scope and search-as-you-type; not the full Combine-vs-async catalogue"]
      - ["SwiftUI + Combine — Wiring Them Together", "partial", "Jetpack Compose — State & Data Flow", "`collectAsStateWithLifecycle` is the one Flow → UI connection point; there is no second framework to wire"]
      - ["Timing Operators — Combine vs Swift Concurrency", "partial", "Testing Approaches in Kotlin", "a debounce tested on virtual time; the Flow timing operators are not catalogued"]
      - ["Clean Code in Swift", "no counterpart", "—", "not written yet; the principles are language-neutral and the Swift sheet's advice carries over"]
      - ["SOLID in Swift", "no counterpart", "—", "not written yet; the principles are language-neutral"]
      - ["Functional Programming in Swift", "partial", "Collections — Operation Cookbook", "higher-order functions and lazy sequences; no composition, currying or sealed-type modelling card"]
      - ["Swift Language Essentials", "equivalent", "Kotlin Language Essentials", "the same questions — optionals, enums, generics, errors, value vs reference — answered for Kotlin"]
      - ["Collections — Types & Protocols", "equivalent", "Collections — Lists, Sets, Maps & Arrays", "which container and what it costs"]
      - ["Collections — Operation Cookbook", "equivalent", "Collections — Operation Cookbook", "transform, fold, group, sort, slice, zip and sequences"]
      - ["Swift Engineering Best Practices", "no counterpart", "—", "not written yet"]
      - ["Architectural Approaches", "no counterpart", "—", "not written yet; Android's architecture guide is the reference"]
      - ["Modularization Approaches", "no counterpart", "—", "not written yet; Gradle modules are a different mechanism from Swift packages"]
      - ["Testing Approaches on iOS", "equivalent", "Testing Approaches in Kotlin", "tooling, virtual time, injected seams and JUnit 5"]
      - ["AI Workflows for Swift (Cursor + Claude)", "no counterpart", "—", "Swift-specific by design: it is about why Swift is harder for models and wiring Xcode to an agent"]
      - ["Algorithmic Patterns & Complexity", "equivalent", "Algorithmic Patterns & Complexity", "built-in costs and five core patterns; fewer patterns than the Swift sheet"]
      - ["Streaming & Time-Series Patterns", "no counterpart", "—", "not written yet; the algorithms (ring buffers, sketches, reservoir sampling) are language-neutral"]
      - ["Files, Text & Atomic I/O", "equivalent", "JVM — Files, Text & Atomic I/O", "the same file-safety questions on java.nio"]
      - ["Core Bluetooth (BLE)", "no counterpart", "—", "an Apple framework; Android's `android.bluetooth.le` is the counterpart and is not written up yet"]
