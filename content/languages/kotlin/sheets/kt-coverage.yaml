id: kt-coverage
concept: meta.coverage
scope: language
title: Coverage against the Swift Catalog
group: Coverage
subtitle: Every Swift topic, and what this catalog has for it — an equivalent, a partial counterpart, or the reason there is none.
cards:
  - id: how-to-read
    kind: rules
    title: How to read the matrix
    note: Nothing here is a translation made to fill a gap.
    items:
      - tone: good
        text: "**equivalent** — a sheet here covers the same concept and shares its concept id, so the language selector lands on it from the Swift sheet."
      - tone: neutral
        text: "**partial** — a sheet here covers part of it under its own concept id, so the selector does not land on it: the Here column names it and the reason says what is missing."
      - tone: bad
        text: "**no counterpart** — nothing here; the reason says whether the topic does not exist in this language or is simply not written yet."
  - id: matrix
    kind: table
    title: Swift topic by topic
    note: In the Swift catalog's reading order.
    headers: [Swift topic, Disposition, Here, Why]
    rows:
      - ["SwiftUI — State & Data Flow", "equivalent", "Jetpack Compose — State & Data Flow", "the same decision: local state, hoisting, an observable model, environment and view-scoped tasks"]
      - ["SwiftUI — Views, Layout & Animation", "equivalent", "Jetpack Compose — Layout, Lists, Navigation & Animation", "composables and modifier order, lazy lists with keys, Scaffold, navigation, animation and the rules that keep recomposition cheap"]
      - ["SwiftUI vs UIKit", "equivalent", "Compose vs Views", "the same screen in Compose and in Android Views, interop in both directions and a migration plan"]
      - ["UIKit — Programmatic UI", "equivalent", "Android Views — Programmatic UI", "a view tree built in code, ConstraintSet, RecyclerView with DiffUtil, View Binding and custom views"]
      - ["SwiftUI — Styling, Design Tokens & Theming", "equivalent", "Compose — Material Theme, Tokens & Styling", "Material colour, type and shape tokens, dark and dynamic colour, custom tokens and adaptive values"]
      - ["MVVM — View Models, Bindings & Observation", "equivalent", "MVVM — ViewModel, UiState & Events", "a view model exposing one `StateFlow` of UI state, intents as methods, events as state and tests on the JVM"]
      - ["TCA — Core Loop", "equivalent", "MVI — Unidirectional State with a Reducer", "state, action, pure reducer, effects and a small store — the loop TCA shares with MVI"]
      - ["TCA — Composition, Dependencies, Testing", "no counterpart", "—", "a Swift library's API"]
      - ["TCA + SwiftUI — Navigation & UI", "partial", "Jetpack Compose — Layout, Lists, Navigation & Animation", "type-safe routes and a back stack with Navigation Compose; navigation driven from a store's state, as TCA does it, is not shown"]
      - ["Modern Swift Concurrency — Core", "equivalent", "Coroutines — Core", "suspend functions, structured fan-out, failure propagation, cancellation and callback bridging"]
      - ["Actors, Sendable & Isolation", "partial", "Shared Mutable State — Mutex, Confinement, Actors", "Mutex, confinement and channel-owned state; Kotlin has no compiler-checked isolation or Sendable"]
      - ["Swift 6 Concurrency — Do's & Don'ts", "no counterpart", "—", "about migrating to Swift 6's strict concurrency checking"]
      - ["Multithreading — GCD vs Combine vs async/await", "partial", "Coroutines — Core", "coroutines and dispatchers only; the threads/executors vs RxJava vs coroutines comparison is not drawn"]
      - ["Combine — Core", "equivalent", "Flow — Core", "cold streams, subjects, operators, lifetime and bridging, with a Combine → Flow table"]
      - ["Timers & Async Patterns — Combine vs async/await", "equivalent", "Timers, Delays & Scheduled Work", "delays, drift-free repeating loops, polling, timeouts, retry with backoff and injected time"]
      - ["SwiftUI + Combine — Wiring Them Together", "partial", "Jetpack Compose — State & Data Flow", "`collectAsStateWithLifecycle` is the one Flow → UI connection point; there is no second framework to wire"]
      - ["Timing Operators — Combine vs Swift Concurrency", "equivalent", "Flow Timing Operators — debounce, sample, timeout", "debounce, sample, throttle by hand, delay, timeout and batching, each proved under virtual time"]
      - ["RxSwift — Core", "partial", "Flow — Core", "Flow is Kotlin's own reactive stream and already stands as Combine's equivalent; RxJava and RxKotlin are not covered"]
      - ["Clean Code in Swift", "equivalent", "Clean Code in Kotlin", "naming, small functions, named arguments, KDoc, sealed results and guard clauses in Kotlin's idiom"]
      - ["SOLID in Swift", "equivalent", "SOLID in Kotlin", "the five principles as before and after, with final-by-default classes, delegation and sealed outcomes"]
      - ["Functional Programming in Swift", "equivalent", "Functional Programming in Kotlin", "pure functions, function types, nullable and `Result` containers, sealed types, sequences and `tailrec`"]
      - ["Swift Language Essentials", "equivalent", "Kotlin Language Essentials", "the same questions — optionals, enums, generics, errors, value vs reference — answered for Kotlin"]
      - ["Collections — Types & Protocols", "equivalent", "Collections — Lists, Sets, Maps & Arrays", "which container and what it costs"]
      - ["Collections — Operation Cookbook", "equivalent", "Collections — Operation Cookbook", "transform, fold, group, sort, slice, zip and sequences"]
      - ["Strings — Characters, Unicode & Operations", "equivalent", "Strings — Standard Operations", "UTF-16 chars vs graphemes, searching, slicing, comparing, normalizing, formatting and matching"]
      - ["Serialization — Codable, JSON & Friends", "equivalent", "Serialization — kotlinx.serialization, JSON & Friends", "serializable models, names and missing fields, dates and enums, polymorphism, custom serializers and errors"]
      - ["Swift Engineering Best Practices", "equivalent", "Kotlin Engineering Best Practices", "conventions, errors, null safety, logging, configuration, coroutines, performance and project hygiene"]
      - ["Architectural Approaches", "equivalent", "Architectural Approaches", "MVVM, MVI and clean layers, an offline-first repository, navigation and dependency injection"]
      - ["Modularization Approaches", "equivalent", "Modularization — Gradle Modules & Visibility", "Gradle modules, `internal` and `implementation` as the walls, api and impl pairs and convention plugins"]
      - ["Testing Approaches on iOS", "equivalent", "Testing Approaches in Kotlin", "tooling, virtual time, injected seams and JUnit 5"]
      - ["UI & End-to-End Testing", "equivalent", "UI & End-to-End Testing", "Compose UI tests through semantics, Espresso, UI Automator, waiting without sleeps and fakes behind Hilt"]
      - ["Security, Authentication & Privacy", "equivalent", "Security, Authentication & Privacy", "where secrets live, OAuth with PKCE, JWT checks, Keystore and biometrics, passkeys, pinning and logs"]
      - ["Accessibility on Apple Platforms", "equivalent", "Accessibility on Android", "what TalkBack reads, semantics, touch targets, focus order, live regions, font scaling and testing it"]
      - ["Localization & Internationalization", "equivalent", "Localization & Internationalization", "string resources, plurals, dates, numbers and money per locale, per-app languages, RTL and pseudolocales"]
      - ["AI Workflows for Swift (Cursor + Claude)", "no counterpart", "—", "Swift-specific by design: it is about why Swift is harder for models and wiring Xcode to an agent"]
      - ["Release engineering", "no counterpart", "—", "This catalog has no walkthrough for TestFlight, store review and phased iOS updates."]
      - ["CI/CD for iOS", "no counterpart", "—", "No equivalent sheet covers signing, caching and App Store promotion for these iOS pipeline lanes."]
      - ["Build configuration", "no counterpart", "—", "This catalog does not cover Xcode schemes, archive export settings or dSYM matching."]
      - ["Algorithmic Patterns & Complexity", "equivalent", "Algorithmic Patterns & Complexity", "the JVM collections' costs and the same patterns, with a heap and a deque built in"]
      - ["Streaming & Time-Series Patterns", "equivalent", "Streaming & Time-Series Patterns", "windows, sketches, rate limits, deduplication and backpressure, in plain Kotlin and over Flow and Channel"]
      - ["Files, Text & Atomic I/O", "equivalent", "JVM — Files, Text & Atomic I/O", "the same file-safety questions on java.nio"]
      - ["Networking — REST with URLSession", "equivalent", "Networking — REST with Ktor, OkHttp & Retrofit", "typed calls as suspend functions, a sealed error type, timeouts, retry, token refresh, pagination and caching"]
      - ["Networking — SOAP, gRPC & GraphQL", "equivalent", "Networking — SOAP, gRPC & GraphQL", "the same three protocols from a Kotlin client, plus WebSockets, and when each is the right one"]
      - ["Video Streaming — HLS & AVPlayer", "equivalent", "Video Streaming — Media3 ExoPlayer, HLS & DASH", "adaptive playback with Media3, track selection, live and DRM, errors, lifecycle and downloads"]
      - ["Core Bluetooth (BLE)", "no counterpart", "—", "an Apple framework; Android's `android.bluetooth.le` is the counterpart and is not written up yet"]
      - ["Project Bluebird", "no counterpart", "—", "The project walkthrough assembles SwiftUI and iOS platform APIs into a single exercise."]
      - ["Project Osprey", "no counterpart", "—", "This iOS release exercise depends on TestFlight, Xcode and App Store Connect."]
