cards:
  - id: constraints
    kind: rules
    title: The constraints that define the field
    note: Every card below is an answer to one of these.
    items:
      - tone: modern
        text: "You see each item **once**, in order, and cannot keep them all — so answers are incremental, approximate, or windowed."
      - tone: modern
        text: "**Bounded memory** is the whole game: O(1) or O(window), never O(stream)."
      - tone: modern
        text: "**Time is two things**: event time (when it happened) and processing time (when you saw it). They diverge, and a watermark is how you decide a window is complete."
      - tone: neutral
        text: "**Exact vs approximate** — a sketch trades a few percent of accuracy for orders of magnitude of memory. Say the error bound out loud."
      - tone: neutral
        text: "In Kotlin a stream is a `Flow` (cold, suspending — the collector's pace *is* the backpressure), a `Channel` (a hot, bounded queue between coroutines) or a `Sequence` (synchronous pull, for files and replays)."
      - tone: good
        text: "**Inject the clock.** `TimeSource` with `TestTimeSource` for plain code, `runTest` virtual time for flows — every example here is deterministic that way."
  - id: windows
    kind: table
    title: Windowing a stream
    note: Almost every streaming requirement is one of these windows plus a lateness policy.
    headers: [Window, Shape, Answers, Group by]
    rows:
      - ["Tumbling", "fixed size, no overlap: `[0, 60s)`, `[60s, 120s)`", "orders per minute, a billing period", "`t - Math.floorMod(t, size)`"]
      - ["Hopping", "fixed size advancing by a smaller hop; an event is in `size / hop` windows", "a 5-minute error rate refreshed every 10 s", "every hop start in `(t - size, t]`"]
      - ["Session", "per key, closed by a gap of inactivity", "a user's visit, a burst of typing", "key, extended while the next event is within the gap"]
      - ["Count (sliding)", "the last n events", "the average of the last 100 requests", "position: a ring buffer"]
      - ["Late events", "its window has already closed: window end ≤ watermark (highest event time − allowed lateness)", "what happens to a delayed upload", "drop and count, hold longer, or reopen the window and re-emit"]
  - id: tumbling-window-watermark
    kind: code
    title: Tumbling windows with a watermark
    note: Revenue per minute by event time — a window closes once the watermark passes its end, so a delayed order still counts, up to the allowed lateness.
    prerequisites: &run
      - A Kotlin 2.x compiler (`kotlinc`) and JDK 17 or later
      - "Save as `main.kt`; run `kotlinc main.kt -include-runtime -d main.jar && java -jar main.jar`"
    code: |-
      import java.util.TreeMap

      data class Order(val atMs: Long, val cents: Long)                // atMs: event time
      data class Window(val startMs: Long, var orders: Int = 0, var cents: Long = 0)

      class TumblingWindows(private val sizeMs: Long, private val latenessMs: Long) {
          private val open = TreeMap<Long, Window>()                   // window start -> running totals
          private var watermark = Long.MIN_VALUE                       // highest event time − allowed lateness
          var late = 0
              private set

          /** Adds an order; returns the windows the advancing watermark closed, oldest first. */
          fun add(order: Order): List<Window> {
              val start = order.atMs - Math.floorMod(order.atMs, sizeMs)
              if (start + sizeMs <= watermark) {                       // already final: count it, never reopen
                  late++
                  return emptyList()
              }
              open.getOrPut(start) { Window(start) }.apply { orders++; cents += order.cents }
              watermark = maxOf(watermark, order.atMs - latenessMs)
              return closeWhile { startMs -> startMs + sizeMs <= watermark }
          }

          fun flush(): List<Window> = closeWhile { true }              // end of stream: all open windows are final

          private fun closeWhile(due: (startMs: Long) -> Boolean): List<Window> {
              val closed = mutableListOf<Window>()
              while (open.isNotEmpty() && due(open.firstKey())) closed += open.pollFirstEntry().value
              return closed
          }
      }

      fun main() {
          val perMinute = TumblingWindows(sizeMs = 60_000, latenessMs = 10_000)
          fun show(w: Window) = "[${w.startMs / 1000}s, +60s) count ${w.orders}, ${w.cents} cents"
          val arrivals = listOf(5 to 1200L, 20 to 800L, 58 to 450L, 62 to 2000L, 50 to 300L, 75 to 990L,
              130 to 1500L, 55 to 700L)                                // (second, cents), in arrival order
          for ((second, cents) in arrivals) {
              for (w in perMinute.add(Order(second * 1000L, cents))) println("after ${second}s: ${show(w)}")
          }
          for (w in perMinute.flush()) println("at the end: ${show(w)}")
          println("late orders dropped: ${perMinute.late}")
      }
    expected: |-
      after 75s: [0s, +60s) count 4, 2750 cents
      after 130s: [60s, +60s) count 2, 2990 cents
      at the end: [120s, +60s) count 1, 1500 cents
      late orders dropped: 1
    validation: &ran
      status: ran
      toolchain: kotlinc 2.4.21, JVM 21.0.12.1
      date: "2026-11-16"
  - id: ring-buffer
    kind: code
    title: Ring buffer — a fixed-size sliding window
    note: A rolling average of the last k request latencies in O(1) per event and O(k) memory.
    prerequisites: *run
    code: |-
      class RingBuffer<T>(val capacity: Int) {
          private val slots = arrayOfNulls<Any>(capacity)
          private var head = 0
          var size = 0
              private set

          /** Appends, and returns the element that fell out of the window, if any. */
          @Suppress("UNCHECKED_CAST")
          fun add(element: T): T? {
              val evicted = if (size == capacity) slots[head] as T else null
              slots[head] = element
              head = (head + 1) % capacity
              if (size < capacity) size++
              return evicted
          }

          @Suppress("UNCHECKED_CAST")
          fun toList(): List<T> = List(size) { slots[(head - size + it + capacity) % capacity] as T }
      }

      class MovingAverage(window: Int) {
          private val window = RingBuffer<Double>(window)
          private var sum = 0.0

          fun add(latencyMs: Double): Double {
              window.add(latencyMs)?.let { sum -= it }   // slide: subtract what left, never re-sum
              sum += latencyMs
              return sum / window.size
          }

          fun samples() = window.toList()
      }

      fun main() {
          val average = MovingAverage(window = 3)
          println(listOf(120.0, 80.0, 100.0, 420.0, 110.0).map(average::add))
          println(average.samples())
      }
    expected: |-
      [120.0, 100.0, 100.0, 200.0, 210.0]
      [100.0, 420.0, 110.0]
    validation: *ran
  - id: running-statistics
    kind: code
    title: Running statistics — Welford & EMA
    note: Mean, variance, a z-score anomaly check and a smoothed level, each in O(1) memory.
    prerequisites: *run
    code: |-
      import kotlin.math.abs
      import kotlin.math.sqrt

      /** Online mean and variance. Numerically stable, unlike a running sum of squares. */
      class RunningStats {
          var count = 0L; private set                 // Long: an Int wraps after 2^31 samples
          var mean = 0.0; private set
          private var m2 = 0.0

          fun add(x: Double) {
              count++
              val delta = x - mean
              mean += delta / count
              m2 += delta * (x - mean)
          }

          val variance get() = if (count > 1) m2 / (count - 1) else 0.0
          fun isAnomaly(x: Double) = sqrt(variance).let { sd -> sd > 0 && abs(x - mean) / sd > 3 }
      }

      /** Exponential moving average: no window, no history. alpha = 2 / (period + 1). */
      class Ema(private val alpha: Double) {
          var value: Double? = null; private set
          fun add(x: Double): Double = (value?.let { alpha * x + (1 - alpha) * it } ?: x).also { value = it }
      }

      fun main() {
          val stats = RunningStats()
          val ema = Ema(alpha = 0.5)
          val smoothed = listOf(100.0, 110.0, 90.0, 105.0, 95.0).map { stats.add(it); ema.add(it) }
          println("n=${stats.count} mean=${stats.mean} variance=${stats.variance}")
          println("ema=$smoothed")
          println("400 ms anomalous? ${stats.isAnomaly(400.0)}; 104 ms? ${stats.isAnomaly(104.0)}")
      }
    expected: |-
      n=5 mean=100.0 variance=62.5
      ema=[100.0, 105.0, 97.5, 101.25, 98.125]
      400 ms anomalous? true; 104 ms? false
    sources:
      - title: Algorithms for calculating variance — Wikipedia
        url: https://en.wikipedia.org/wiki/Algorithms_for_calculating_variance
      - title: Exponential smoothing — Wikipedia
        url: https://en.wikipedia.org/wiki/Exponential_smoothing
    validation: *ran
  - id: reservoir-sampling
    kind: code
    title: Reservoir sampling
    note: A uniform sample of k orders from a stream of unknown length, in O(k) memory — for audits and upload sampling.
    prerequisites: *run
    code: |-
      import kotlin.random.Random

      class Reservoir<T>(private val capacity: Int, private val random: Random = Random.Default) {
          private val items = ArrayList<T>(capacity)
          private var seen = 0L
          val sample: List<T> get() = items

          fun add(item: T) {
              seen++
              if (items.size < capacity) {
                  items += item
              } else {
                  val slot = random.nextLong(seen)        // keep with probability k / n
                  if (slot < capacity) items[slot.toInt()] = item
              }
          }
      }

      fun main() {
          // Seeded only so the page is reproducible; production code keeps Random.Default.
          val random = Random(42)
          val audit = Reservoir<String>(capacity = 5, random = random)
          for (i in 1..10_000) audit.add("order-$i")
          println(audit.sample)

          // Uniformity check: 20 000 samples of 2 out of 4 — each item should survive ~50% of the time.
          val survived = IntArray(4)
          repeat(20_000) {
              val r = Reservoir<Int>(capacity = 2, random = random)
              (0..3).forEach(r::add)
              r.sample.forEach { survived[it]++ }
          }
          println(survived.map { it * 100 / 20_000 })
      }
    expected: |-
      [order-4572, order-2717, order-7349, order-729, order-6529]
      [49, 50, 50, 49]
    sources:
      - title: Reservoir sampling — Wikipedia
        url: https://en.wikipedia.org/wiki/Reservoir_sampling
    validation: *ran
  - id: count-min-sketch
    kind: code
    title: Count-Min Sketch — approximate frequencies
    note: Hits per endpoint for any number of endpoints in a fixed width × depth table, never undercounting.
    prerequisites: *run
    code: |-
      /** MurmurHash3's finaliser: spreads every input bit across the output. */
      fun mix(x: Int): Int {
          var h = x
          h = (h xor (h ushr 16)) * 0x85EBCA6B.toInt()
          h = (h xor (h ushr 13)) * 0xC2B2AE35.toInt()
          return h xor (h ushr 16)
      }

      /** width ≈ e / ε, depth ≈ ln(1 / δ). Memory is width × depth longs, whatever the key count. */
      class CountMinSketch(private val width: Int, private val depth: Int) {
          private val table = Array(depth) { LongArray(width) }

          // String.hashCode is 32 bits and easy to collide on purpose ("Aa" and "BB" share every row):
          // for untrusted keys, hash the UTF-8 bytes with a 64-bit hash (Guava Hashing.murmur3_128).
          private fun column(key: String, row: Int) =
              Math.floorMod(mix(key.hashCode() + row * 0x9E3779B9.toInt()), width)

          fun add(key: String, count: Long = 1) {
              for (row in 0 until depth) table[row][column(key, row)] += count
          }

          /** The smallest of the row counters: collisions only ever add, so this is an upper bound. */
          fun estimate(key: String): Long = (0 until depth).minOf { table[it][column(key, it)] }
      }

      fun main() {
          // 1024 × 4 (32 KB): over by at most e / 1024 ≈ 0.27% of all hits, with 98% probability (1 − e⁻⁴).
          val hits = CountMinSketch(width = 1024, depth = 4)
          repeat(500) { hits.add("/checkout") }
          repeat(300) { hits.add("/cart") }
          repeat(200) { hits.add("/search") }
          for (id in 1..5_000) hits.add("/product/$id")              // the long tail
          val exactCounts = listOf("/checkout" to 500, "/cart" to 300, "/search" to 200, "/product/7" to 1)
          for ((path, exact) in exactCounts) {
              println("$path exact=$exact estimate=${hits.estimate(path)}")
          }
      }
    expected: |-
      /checkout exact=500 estimate=503
      /cart exact=300 estimate=302
      /search exact=200 estimate=202
      /product/7 exact=1 estimate=4
    sources:
      - title: Count–min sketch — Wikipedia
        url: https://en.wikipedia.org/wiki/Count%E2%80%93min_sketch
    validation: *ran
  - id: bloom-filter
    kind: code
    title: Bloom filter — approximate membership
    note: '"Have I already synced this event id?" — definitely not, or probably yes, in about 10 bits per id.'
    prerequisites: *run
    code: |-
      import java.util.BitSet
      import kotlin.math.ln
      import kotlin.math.roundToInt

      fun mix(x: Int): Int {
          var h = x
          h = (h xor (h ushr 16)) * 0x85EBCA6B.toInt()
          h = (h xor (h ushr 13)) * 0xC2B2AE35.toInt()
          return h xor (h ushr 16)
      }

      class BloomFilter(expected: Int, falsePositiveRate: Double) {
          // m = -n·ln(p) / (ln 2)²    k = (m / n)·ln 2
          val bitCount = (-expected * ln(falsePositiveRate) / (ln(2.0) * ln(2.0))).toInt()
          val hashCount = (bitCount.toDouble() / expected * ln(2.0)).roundToInt()
          private val bits = BitSet(bitCount)

          // Two hashes make all k positions: h1 + i·h2 (Kirsch–Mitzenmacher). String.hashCode is
          // 32 bits and easy to collide on purpose: for untrusted keys use a 64-bit hash of the bytes.
          private fun positions(key: String): List<Int> {
              val h1 = mix(key.hashCode())
              val h2 = mix(h1) or 1
              return List(hashCount) { i -> Math.floorMod(h1 + i * h2, bitCount) }
          }

          fun add(key: String) = positions(key).forEach { bits.set(it) }

          /** false: definitely absent. true: probably present. */
          fun mightContain(key: String) = positions(key).all { bits.get(it) }
      }

      fun main() {
          // Sized for `expected` ids: past that the false-positive rate climbs (~16% at 2×), so rotate or rebuild.
          val synced = BloomFilter(expected = 10_000, falsePositiveRate = 0.01)
          for (i in 1..10_000) synced.add("evt-$i")
          println("${synced.bitCount / 8 / 1024} KB, ${synced.hashCount} hashes")
          println("evt-42 seen? ${synced.mightContain("evt-42")}")
          val falsePositives = (1..10_000).count { synced.mightContain("new-$it") }
          println("false positives: $falsePositives of 10000 unseen ids")
      }
    expected: |-
      11 KB, 7 hashes
      evt-42 seen? true
      false positives: 93 of 10000 unseen ids
    sources:
      - title: Bloom filter — Wikipedia
        url: https://en.wikipedia.org/wiki/Bloom_filter
    validation: *ran
  - id: heavy-hitters
    kind: code
    title: Heavy hitters — Misra–Gries
    note: The clients hammering an API in O(k) memory, where any client above n / (k + 1) requests is guaranteed to survive.
    prerequisites: *run
    code: |-
      class HeavyHitters<K>(private val capacity: Int) {
          private val counters = LinkedHashMap<K, Long>()          // Long: a busy stream outgrows Int

          fun add(key: K) {
              val current = counters[key]
              when {
                  current != null -> counters[key] = current + 1
                  counters.size < capacity -> counters[key] = 1L
                  else -> {
                      // No free slot: everyone loses one, and whoever reaches zero frees a slot.
                      for (entry in counters.entries) entry.setValue(entry.value - 1)
                      counters.values.removeAll { it == 0L }
                  }
              }
          }

          /** Counts are lower bounds: each may be short by at most n / (k + 1). */
          fun top(): List<Pair<K, Long>> =
              counters.entries.sortedByDescending { it.value }.map { it.key to it.value }
      }

      fun main() {
          val requests = (0 until 1_000).map { i ->
              when (i % 10) {
                  in 0..3 -> "crawler-7"              // 40% of the traffic
                  in 4..6 -> "mobile-app"             // 30%
                  else -> "user-${i % 97}"            // a long tail of real users
              }
          }
          val hitters = HeavyHitters<String>(capacity = 4)
          requests.forEach(hitters::add)
          println(hitters.top().take(2))
          val exact = requests.groupingBy { it }.eachCount()
          println("exact: crawler-7=${exact["crawler-7"]} mobile-app=${exact["mobile-app"]}")
      }
    expected: |-
      [(crawler-7, 300), (mobile-app, 200)]
      exact: crawler-7=400 mobile-app=300
    sources:
      - title: Misra–Gries heavy hitters algorithm — Wikipedia
        url: https://en.wikipedia.org/wiki/Misra%E2%80%93Gries_heavy_hitters_algorithm
    validation: *ran
  - id: streaming-quantiles
    kind: code
    title: Streaming quantiles
    note: p50 / p95 / p99 latency within 1% relative error, without storing the samples.
    prerequisites: *run
    code: |-
      import kotlin.math.ceil
      import kotlin.math.ln
      import kotlin.math.pow
      import kotlin.math.roundToLong

      /** Log-spaced buckets (the DDSketch idea): relative error bounded, memory O(log(max / min)). */
      class QuantileSketch(relativeError: Double = 0.01) {
          private val gamma = (1 + relativeError) / (1 - relativeError)
          private val buckets = sortedMapOf<Int, Long>()
          var count = 0L; private set
          val bucketCount get() = buckets.size

          fun add(positive: Double) {
              require(positive > 0) { "log buckets take positive values; count zeros separately" }
              val index = ceil(ln(positive) / ln(gamma)).toInt()
              buckets[index] = (buckets[index] ?: 0L) + 1
              count++
          }

          fun quantile(q: Double): Double {
              val rank = (q * (count - 1)).toLong()
              var seen = 0L
              for ((index, n) in buckets) {
                  seen += n
                  if (seen > rank) return 2 * gamma.pow(index) / (gamma + 1)   // the bucket's midpoint
              }
              error("empty sketch")
          }
      }

      fun main() {
          val latency = QuantileSketch()
          for (ms in 1..10_000) latency.add(ms.toDouble())
          repeat(200) { latency.add(30_000.0) }                  // a slow dependency timing out
          val report = listOf(0.5, 0.95, 0.99)
              .joinToString { q -> "p${(q * 100).toInt()}=${latency.quantile(q).roundToLong()}" }
          println("$report from ${latency.count} samples in ${latency.bucketCount} buckets")
          // Report percentiles, not the mean: the mean here is ~5.5 s and describes nobody.
      }
    expected: |-
      p50=5066, p95=9607, p99=30040 from 10200 samples in 316 buckets
    sources:
      - title: "DDSketch: a fast and fully-mergeable quantile sketch with relative-error guarantees — arXiv"
        url: https://arxiv.org/abs/1908.10693
    validation: *ran
  - id: rate-limiting
    kind: code
    title: Rate limiting — token bucket vs sliding window
    note: The same arrivals through both limiters, on an injected clock — the bucket lets a refilled trickle through, the window is exact.
    prerequisites: *run
    code: |-
      import kotlin.time.*
      import kotlin.time.Duration.Companion.milliseconds
      import kotlin.time.Duration.Companion.seconds

      /** Bursts up to `capacity`, then `perSecond` sustained. O(1) memory. */
      class TokenBucket(private val capacity: Double, private val perSecond: Double, clock: TimeSource) {
          private var tokens = capacity
          private var lastRefill = clock.markNow()

          @Synchronized                                              // request threads call it concurrently
          fun tryAcquire(): Boolean {
              val elapsed = lastRefill.elapsedNow()
              lastRefill += elapsed                                  // advance the mark: no drift
              tokens = minOf(capacity, tokens + elapsed.toDouble(DurationUnit.SECONDS) * perSecond)
              if (tokens < 1) return false
              tokens -= 1
              return true
          }
      }

      /** At most `limit` in ANY trailing `window`. Exact, O(limit) memory. */
      class SlidingWindowLog(private val limit: Int, private val window: Duration, private val clock: TimeSource) {
          private val accepted = ArrayDeque<TimeMark>()

          @Synchronized
          fun tryAcquire(): Boolean {
              while (accepted.isNotEmpty() && accepted.first().elapsedNow() >= window) accepted.removeFirst()
              if (accepted.size >= limit) return false
              accepted.addLast(clock.markNow())
              return true
          }
      }

      fun verdict(allowed: Boolean) = if (allowed) "ok" else "429"

      fun main() {
          val clock = TestTimeSource()
          val bucket = TokenBucket(capacity = 3.0, perSecond = 3.0, clock = clock)
          val window = SlidingWindowLog(limit = 3, window = 1.seconds, clock = clock)
          var now = 0
          for (at in listOf(0, 0, 0, 0, 500, 900, 1000, 1000)) {
              clock += (at - now).milliseconds
              now = at
              println("t=${at}ms bucket=${verdict(bucket.tryAcquire())} window=${verdict(window.tryAcquire())}")
          }
      }
    expected: |-
      t=0ms bucket=ok window=ok
      t=0ms bucket=ok window=ok
      t=0ms bucket=ok window=ok
      t=0ms bucket=429 window=429
      t=500ms bucket=ok window=429
      t=900ms bucket=ok window=429
      t=1000ms bucket=ok window=ok
      t=1000ms bucket=429 window=ok
    sources:
      - title: Token bucket — Wikipedia
        url: https://en.wikipedia.org/wiki/Token_bucket
      - title: TestTimeSource — Kotlin API reference
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.time/-test-time-source/
    validation: *ran
  - id: debounce-throttle-sample
    kind: code
    title: Debounce, throttle & sample over a Flow
    note: A search box's keystrokes on virtual time — debounce waits for a pause, throttle keeps the first of each window, sample the latest per tick.
    applies:
      runtime: Kotlin/JVM with kotlinx.coroutines
      requires: [kotlinx-coroutines-core, kotlinx-coroutines-test]
      versions: { kotlin: ">=2.0", kotlinx-coroutines: ">=1.10", jvm: ">=17" }
    prerequisites: &runFlow
      - A Kotlin 2.x compiler (`kotlinc`), JDK 17 or later, and the jars `kotlinx-coroutines-core-jvm-1.10.2` and `kotlinx-coroutines-test-jvm-1.10.2`
      - "Save as `main.kt`; run `kotlinc -cp <both jars> main.kt -d out && kotlin -cp out:<both jars> MainKt`"
      - "Or, in a Gradle project: `implementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2\")` and `testImplementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2\")`"
    code: |-
      import kotlinx.coroutines.ExperimentalCoroutinesApi
      import kotlinx.coroutines.FlowPreview
      import kotlinx.coroutines.delay
      import kotlinx.coroutines.flow.*
      import kotlinx.coroutines.test.runTest

      /** Typed at 0, 120, 240, 640, 700 and 760 ms. */
      fun keystrokes(): Flow<String> = flow {
          val typing = listOf("k" to 0L, "ko" to 120L, "kot" to 120L, "kotl" to 400L, "kotli" to 60L,
              "kotlin" to 60L)
          for ((text, pauseMs) in typing) {
              delay(pauseMs)
              emit(text)
          }
      }

      /** Flow has no throttle-first: the first value of each window passes, the rest are dropped. */
      fun <T> Flow<T>.throttleFirst(windowMs: Long, now: () -> Long): Flow<T> = flow {
          var windowStart: Long? = null
          collect { value ->
              val start = windowStart
              if (start == null || now() - start >= windowMs) {
                  windowStart = now()
                  emit(value)
              }
          }
      }

      @OptIn(FlowPreview::class, ExperimentalCoroutinesApi::class)   // debounce/sample; virtual currentTime
      fun main() = runTest {
          println("debounce(300): " + keystrokes().debounce(300).toList())
          val clock = { testScheduler.currentTime }
          println("throttle(300): " + keystrokes().throttleFirst(300, clock).toList())
          println("sample(250):   " + keystrokes().sample(250).toList())
      }
    expected: |-
      debounce(300): [kot, kotlin]
      throttle(300): [k, kotl]
      sample(250):   [kot, kotli]
    validation: &ranFlow
