id: kt-streams
concept: algorithms.streaming
scope: shared
title: "Streaming & Time-Series Patterns"
group: Shared concepts
subtitle: "Unbounded data, bounded memory: windows, sketches, rate limits and backpressure — in plain Kotlin and over Flow and Channel."
applies:
  platforms: [jvm, android]
  runtime: Kotlin/JVM (the standard library and java.util)
  versions: { kotlin: ">=2.0", jvm: ">=17" }
sources:
