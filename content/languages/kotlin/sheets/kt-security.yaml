id: kt-security
concept: security.auth-and-data
scope: platform
title: "Security, Authentication & Privacy"
group: Quality & reach
subtitle: "Where secrets go on Android, OAuth 2.0 with PKCE and refresh-token rotation, verifying a JWT, AES-GCM and HMAC with javax.crypto, Keystore keys behind BiometricPrompt, passkeys with Credential Manager, network security config and pinning, WebView and deep-link input, and what never reaches Logcat."
applies:
  platforms: [android, jvm]
  runtime: Kotlin/JVM with the JDK's java.security and javax.crypto; Android for the Keystore, biometric and Credential Manager cards
  requires: [kotlinx-serialization-json]
  versions: { kotlin: ">=2.4", kotlinx-serialization: ">=1.13", jvm: ">=21" }
