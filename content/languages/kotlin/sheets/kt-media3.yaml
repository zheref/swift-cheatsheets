id: kt-media3
concept: media.video-streaming
scope: platform
title: "Video Streaming — Media3 ExoPlayer, HLS & DASH"
group: Networking & media
subtitle: "Which Media3 module plays which protocol, how a multivariant playlist drives adaptive bitrate, playing in Compose and in Views, MediaItems with live and DRM configuration, track selection, state and error recovery, lifecycle, background playback and downloads."
applies:
  platforms: [android]
  runtime: an Android app with AndroidX Media3 (ExoPlayer)
  requires: [androidx.media3:media3-exoplayer, androidx.media3:media3-exoplayer-hls, androidx.media3:media3-exoplayer-dash, androidx.media3:media3-ui-compose-material3]
  versions: { kotlin: ">=2.4", media3: "1.11.1", compose: "1.12.0", lifecycle: "2.11.0", android: "API 23+" }
