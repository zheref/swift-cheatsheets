concept: ui.views-layout-animation
scope: platform
title: "Jetpack Compose — Layout, Lists, Navigation & Animation"
group: Android
subtitle: Composables with their inputs and local state, Modifier order, Row/Column/Box, lazy lists with keys, Scaffold, Navigation Compose and Navigation 3, animation and the rules that keep recomposition cheap.
