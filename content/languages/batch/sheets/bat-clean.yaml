id: bat-clean
concept: practice.clean-code
scope: shared
title: Small commands with clear contracts
group: Programming and automation
subtitle: Name the input, guard the failure path and return one kind of result.
applies:
  platforms:
    - windows
  runtime: Windows Command Prompt (cmd.exe)
  versions:
    windows: ">=10"
sources:
  - title: Windows command reference
    url: https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/exit
cards:
  - id: example
    kind: code
    title: Give the caller usage on failure
    note: The guard keeps the ordinary path short. Capture stderr separately when testing a usage failure. Use exit /b to return to the caller.
    prerequisites:
      - Save as demo.cmd in an empty directory and run cmd.exe /d /e:on /v:off /c demo.cmd.
    code: |-
      @echo off
      call :check 2>usage.txt
      if not errorlevel 2 exit /b 1
      echo usage required
      exit /b 0
      :check
      if "%~1"=="" (
        1>&2 echo Usage: report.cmd FILE
        exit /b 2
      )
      if not exist "%~1" exit /b 1
      exit /b 0
    expected: usage required
    validation:
      status: ran
      toolchain: Windows 11 cmd.exe (10.0.26200.9445)
      date: 2026-11-19
