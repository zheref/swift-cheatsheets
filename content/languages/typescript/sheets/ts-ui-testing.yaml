id: ts-ui-testing
concept: testing.ui-e2e
scope: platform
title: "UI & End-to-End Testing"
group: "Quality & reach"
subtitle: "Component tests that act like a user, Playwright journeys through the real app, role-based selectors, no sleeps, isolated network and state — and a suite that does not flake."
applies:
  platforms: [browser, node]
  runtime: Node.js test runners driving jsdom or real browsers
  versions: { typescript: ">=5.5", node: ">=22.18", "@testing-library/react": ">=16", "@playwright/test": ">=1.49" }
sources:
  - title: Testing Library — Guiding principles
    url: https://testing-library.com/docs/guiding-principles
  - title: Playwright — Writing tests
    url: https://playwright.dev/docs/writing-tests
  - title: Playwright — Best practices
    url: https://playwright.dev/docs/best-practices
cards:
  - id: tooling
    kind: table
    title: The testing trophy, by tool
    note: "Most confidence per second comes from component tests that render and interact; keep a few end-to-end journeys for what only the real app proves."
    headers: [Layer, Tool, Use it for, Watch out]
    rows:
      - ["static", "`tsc --noEmit`, ESLint (`eslint-plugin-jsx-a11y`, `eslint-plugin-testing-library`)", "typos, wrong props, missing labels", "proves nothing about behaviour"]
      - ["component / integration", "Testing Library + `@testing-library/user-event`, with Vitest, Jest or `node:test`, in jsdom or happy-dom", "a screen's behaviour as the user sees it, in milliseconds", "no layout, no real focus rings, no CSS"]
      - ["network for components", "MSW (Mock Service Worker)", "the same HTTP handlers in tests, Storybook and dev", "unhandled requests should fail the test"]
      - ["end-to-end", "Playwright (`@playwright/test`)", "the real app in Chromium, Firefox and WebKit; parallel, auto-waiting, traces", "seconds per test — keep to the critical journeys"]
      - ["end-to-end", "Cypress", "in-browser runner with time-travel debugging", "one tab per test, other origins need `cy.origin`; chains, not `await`"]
      - ["visual regression", "Playwright `toHaveScreenshot()`, Chromatic, Percy", "pixel diffs of components and pages", "pin the OS, fonts and viewport, or diffs are noise"]
      - ["accessibility", "axe — `@axe-core/playwright`", "WCAG violations on each page", "automated checks find a share of issues, not all"]
  - id: component-test
    kind: code
    title: A component test that renders, interacts, asserts
    note: "Render the component, act through `user-event` — real key presses and clicks, with the disabled and visibility checks a user meets — and assert on text and roles, never on state or props."
    prerequisites:
      - "A React project: `npm create vite@latest app -- --template react-ts`"
      - "`npm i -D @testing-library/react @testing-library/dom @testing-library/user-event jsdom tsx` (Vitest users: `environment: \"jsdom\"` replaces the three setup lines)"
      - "Put a `tsconfig.json` with `\"compilerOptions\": { \"jsx\": \"react-jsx\" }` next to the file (tsx takes JSX settings only from tsconfig; without it, `React is not defined`), save as `todo-list.test.tsx`, and run `npx tsx --test todo-list.test.tsx`"
    code: |-
      import assert from "node:assert/strict";
      import { afterEach, mock, test } from "node:test";
      import { useState, type FormEvent } from "react";
      import { JSDOM } from "jsdom";

      const { window } = new JSDOM("<!doctype html><body></body>");   // Testing Library needs a document first
      Object.assign(globalThis, { window, document: window.document, IS_REACT_ACT_ENVIRONMENT: true });
      const { render, screen, cleanup } = await import("@testing-library/react");
      const { userEvent } = await import("@testing-library/user-event");
      afterEach(cleanup);

      function TodoList({ save }: { save: (title: string) => Promise<void> }) {
        const [todos, setTodos] = useState<string[]>([]);
        const [draft, setDraft] = useState("");
        const [status, setStatus] = useState("");
        async function add(event: FormEvent) {
          event.preventDefault();
          setTodos([...todos, draft]);
          setDraft("");
          await save(draft);
          setStatus(`Saved "${draft}"`);
        }
        return (
          <form onSubmit={add}>
            <label htmlFor="new-todo">New to-do</label>
            <input id="new-todo" value={draft} onChange={(e) => setDraft(e.target.value)} />
            <button type="submit" disabled={!draft.trim()}>Add</button>
            <ul aria-label="To-dos">{todos.map((t) => <li key={t}>{t}</li>)}</ul>
            <p role="status">{status}</p>
          </form>
        );
      }

      test("adds a to-do and confirms it was saved", async () => {
        const user = userEvent.setup();
        const save = mock.fn(async (_title: string) => {});
        render(<TodoList save={save} />);
        await user.click(screen.getByRole("button", { name: "Add" }));   // disabled: user-event adds nothing
        await user.type(screen.getByRole("textbox", { name: "New to-do" }), "Buy milk{Enter}");
        assert.deepEqual(screen.getAllByRole("listitem").map((li) => li.textContent), ["Buy milk"]);
        await screen.findByText('Saved "Buy milk"', { selector: "[role=status]" });   // retries: no sleep
        assert.deepEqual(save.mock.calls.map((c) => c.arguments), [["Buy milk"]]);
      });
    expected: "`✔ adds a to-do and confirms it was saved`, then `tests 1`, `pass 1`, `fail 0`, and the process exits 0 (the timings vary)."
    applies:
      versions: { typescript: ">=5.5", node: ">=22.18", "@testing-library/react": ">=16", "@testing-library/user-event": ">=14" }
    sources:
      - title: user-event — Testing Library
        url: https://testing-library.com/docs/user-event/intro
      - title: Async methods — Testing Library
        url: https://testing-library.com/docs/dom-testing-library/api-async
    validation:
      status: ran
      toolchain: Node 24.16.0, TypeScript 5.9.3
      date: "2026-11-16"
      check: exit-code
      jsx: react
  - id: select-and-wait
    kind: compare
    title: Select by role, wait on the UI — never by layout, never by sleep
    note: "A role and accessible name survive a redesign and prove the control is usable; a web-first assertion retries until the UI is right or times out."
    columns:
      - label: Layout selectors and sleeps
        tone: bad
        code: |-
          import { test, expect } from "@playwright/test";

          test("adds a to-do", async ({ page }) => {
            await page.goto("/");
            await page.locator("#app > form > input.form-control").fill("Buy milk");
            await page.locator("form .btn.btn-primary").click();
            await page.waitForTimeout(2000);                   // too long on a fast run, too short on CI
            const count = await page.locator("ul > li.todo-item").count();   // read once, never retried
            expect(count).toBe(1);
          });
      - label: Roles, names and web-first assertions
        tone: good
        code: |-
          import { test, expect } from "@playwright/test";

          test("adds a to-do", async ({ page }) => {
            await page.goto("/");
            await page.getByRole("textbox", { name: "New to-do" }).fill("Buy milk");
            await page.getByRole("button", { name: "Add" }).click();   // waits until visible, enabled, stable
            const todos = page.getByRole("list", { name: "To-dos" }).getByRole("listitem");
            await expect(todos).toHaveText(["Buy milk"]);              // retries until true or timeout
            await expect(page.getByRole("status")).toHaveText('Saved "Buy milk"');
          });
    prerequisites: &playwright
      - "A Playwright project: `npm init playwright@latest`, which installs `@playwright/test` and the browsers"
      - "Set `use: { baseURL: \"http://localhost:5173\" }` and a `webServer` entry in `playwright.config.ts` so the app starts with the tests"
      - "Save under `tests/` as `todos.spec.ts` and run `npx playwright test`"
    expected: "Both type-check; the first passes or fails depending on machine speed and markup, the second waits exactly as long as the app needs and survives a restyle."
    sources:
      - title: Locators — Playwright
        url: https://playwright.dev/docs/locators
      - title: Auto-waiting — Playwright
        url: https://playwright.dev/docs/actionability
    validation: &compiled
      status: compiled
      toolchain: Node 24.16.0, TypeScript 5.9.3, @playwright/test 1.65.1
      date: "2026-11-16"
      host: a Playwright project with browsers installed and the app served at `baseURL`
  - id: e2e-journey
    kind: code
    title: An end-to-end journey with Playwright
    note: "One test per critical journey, through the real UI and the real server — each test with its own account, so parallel workers never share or wipe each other's data."
    prerequisites: *playwright
    code: |-
      import { test, expect } from "@playwright/test";

      test.beforeEach(async ({ page }, testInfo) => {
        // a test-build-only endpoint creates a fresh, empty account and answers with its session cookie;
        // page.request shares the page's cookie jar, so the browser is signed in as that account
        // unique per run too: testId and workerIndex repeat on every run and on every developer's machine
        const email = `e2e-${testInfo.workerIndex}-${crypto.randomUUID()}@example.test`;
        const created = await page.request.post("/api/test/users", { data: { email } });
        expect(created.ok()).toBe(true);
        await page.goto("/");
      });

      test("adds, completes and clears a to-do", async ({ page }) => {
        const newTodo = page.getByRole("textbox", { name: "New to-do" });
        const todos = page.getByRole("list", { name: "To-dos" }).getByRole("listitem");

        await newTodo.fill("Buy milk");
        await newTodo.press("Enter");
        await newTodo.fill("Book dentist");
        await newTodo.press("Enter");
        await expect(todos).toHaveText(["Buy milk", "Book dentist"]);

        await todos.filter({ hasText: "Buy milk" }).getByRole("checkbox").check();
        await expect(page.getByRole("status")).toHaveText("1 left");

        await page.getByRole("button", { name: "Clear completed" }).click();
        await expect(todos).toHaveText(["Book dentist"]);

        await page.reload();                                             // persisted, not just rendered
        await expect(todos).toHaveText(["Book dentist"]);
      });
    expected: "Playwright runs the journey in each configured browser, in parallel with other tests; a failure leaves a trace with DOM snapshots, network and console for every step (`npx playwright show-trace`)."
    sources:
      - title: Assertions — Playwright
        url: https://playwright.dev/docs/test-assertions
      - title: APIRequestContext — Playwright
        url: https://playwright.dev/docs/api/class-apirequestcontext
    validation: *compiled
  - id: network-isolation
    kind: code
    title: Isolate the network with page.route
    note: "Stub the APIs a test is not about — errors, empty states, third parties — so the result depends on the app alone."
    prerequisites: *playwright
    code: |-
      import { test, expect } from "@playwright/test";

      test.beforeEach(async ({ context }) => {
        // analytics and other third parties are not under test: never let them slow or fail a run
        await context.route(/googletagmanager|segment\.io/, (route) => route.abort());
      });

      test("shows the empty state", async ({ page }) => {
        await page.route("**/api/todos", (route) => route.fulfill({ json: [] }));
        await page.goto("/");
        await expect(page.getByText("Nothing to do — add your first to-do")).toBeVisible();
      });

      test("explains a server error and recovers on retry", async ({ page }) => {
        let calls = 0;
        await page.route("**/api/todos", async (route) => {
          calls += 1;
          if (calls === 1) return route.fulfill({ status: 503, json: { error: "unavailable" } });
          return route.fulfill({ json: [{ id: 1, title: "Buy milk", done: false }] });
        });
        await page.goto("/");
        await expect(page.getByRole("alert")).toHaveText("Could not load your to-dos.");
        await page.getByRole("button", { name: "Try again" }).click();
        await expect(page.getByRole("listitem")).toHaveText(["Buy milk"]);
      });
    expected: "Both tests pass without a backend for `/api/todos`; every analytics request is aborted."
    sources:
      - title: Mock APIs — Playwright
        url: https://playwright.dev/docs/mock
    validation: *compiled
  - id: msw-component
    kind: code
    title: MSW for component tests
    note: "Mock at the network layer, not the fetch function: the component's real data code runs, and the same handlers serve Storybook and dev."
    prerequisites:
      - "`npm i -D msw vitest jsdom @testing-library/react @testing-library/dom` and `environment: \"jsdom\"` in the Vitest config"
      - "Save as `TodoPage.test.tsx` beside the component and run `npx vitest`"
    code: |-
      import { http, HttpResponse } from "msw";
      import { setupServer } from "msw/node";
      import { afterAll, afterEach, beforeAll, expect, test } from "vitest";
      import { cleanup, render, screen } from "@testing-library/react";
      import { TodoPage } from "./TodoPage";

      const api = "https://api.example.com/todos";
      const server = setupServer(
        http.get(api, () => HttpResponse.json([{ id: 1, title: "Buy milk", done: false }])),
      );

      // MSW 3 renamed onUnhandledRequest to onUnhandledFrame: "error" halts any request without a handler
      beforeAll(() => server.listen({ onUnhandledFrame: "error" }));
      afterEach(() => {
        server.resetHandlers();                    // per-test overrides never leak
        cleanup();                                 // Vitest without globals: RTL cannot register this itself
      });
      afterAll(() => server.close());

      test("lists the saved to-dos", async () => {
        render(<TodoPage />);
        expect((await screen.findByRole("listitem")).textContent).toBe("Buy milk");
      });

      test("explains a server error", async () => {
        server.use(http.get(api, () => new HttpResponse(null, { status: 503 })));
        render(<TodoPage />);
        expect((await screen.findByRole("alert")).textContent).toBe("Could not load your to-dos.");
      });
    expected: "Both tests pass with no server running; a request to a URL without a handler is halted with an error instead of reaching the network."
    applies:
      versions: { typescript: ">=5.5", node: ">=22.18", msw: ">=3", vitest: ">=3", "@testing-library/react": ">=16" }
    sources:
      - title: setupServer().listen() — Mock Service Worker
        url: https://mswjs.io/docs/api/setup-server/listen
    validation:
      status: excerpt
      host: a Vitest project with `msw` 3 (not among this catalog's example libraries)
  - id: fixtures-and-page-objects
    kind: code
    title: Page objects as fixtures
    note: "Put locators and multi-step actions in one class, hand it to tests as a fixture — tests then read as the journey, and a markup change is fixed once."
    prerequisites: *playwright
    code: |-
      import { test as base, expect, type Locator, type Page } from "@playwright/test";

      class TodoPage {
        readonly newTodo: Locator;
        readonly items: Locator;
        readonly remaining: Locator;

        constructor(page: Page) {
          this.newTodo = page.getByRole("textbox", { name: "New to-do" });
          this.items = page.getByRole("list", { name: "To-dos" }).getByRole("listitem");
          this.remaining = page.getByRole("status");
        }
        async add(...titles: string[]): Promise<void> {
          for (const title of titles) {
            await this.newTodo.fill(title);
            await this.newTodo.press("Enter");
          }
        }
        async complete(title: string): Promise<void> {
          await this.items.filter({ hasText: title }).getByRole("checkbox").check();
        }
      }

      const test = base.extend<{ todoPage: TodoPage }>({
        todoPage: async ({ page }, use) => {
          await page.goto("/");
          await use(new TodoPage(page));             // setup above, teardown below this line
        },
      });

      test("counts what is left", async ({ todoPage }) => {
        await todoPage.add("Buy milk", "Book dentist");
        await todoPage.complete("Buy milk");
        await expect(todoPage.remaining).toHaveText("1 left");
      });
    expected: "The test receives a ready `TodoPage` on a loaded page; assertions stay in the test, locators stay in the class."
    sources:
      - title: Fixtures — Playwright
        url: https://playwright.dev/docs/test-fixtures
      - title: Page object models — Playwright
        url: https://playwright.dev/docs/pom
    validation: *compiled
  - id: auth-state
    kind: code
    title: Log in once, reuse the storage state
    note: "A setup project logs in through the UI once and saves cookies and local storage; every other test starts already signed in."
    prerequisites:
      - "A Playwright project: `npm init playwright@latest`"
      - "In `playwright.config.ts`, `projects: [{ name: \"setup\", testMatch: /.*\\.setup\\.ts/ }, { name: \"chromium\", use: { ...devices[\"Desktop Chrome\"], storageState: \"playwright/.auth/user.json\" }, dependencies: [\"setup\"] }]`"
      - "Add `playwright/.auth` to `.gitignore`, save this as `tests/auth.setup.ts`, and run `npx playwright test`"
    code: |-
      import { test as setup, expect } from "@playwright/test";

      const authFile = "playwright/.auth/user.json";

      setup("sign in as the test user", async ({ page }) => {
        const email = process.env.E2E_USER_EMAIL;
        const password = process.env.E2E_USER_PASSWORD;   // a test account's secret, from CI — never committed
        if (!email || !password) throw new Error("Set E2E_USER_EMAIL and E2E_USER_PASSWORD");

        await page.goto("/login");
        await page.getByRole("textbox", { name: "Email" }).fill(email);
        await page.getByLabel("Password").fill(password);
        await page.getByRole("button", { name: "Sign in" }).click();

        // wait for proof that the session is really set before saving it
        await expect(page.getByRole("button", { name: "Account menu" })).toBeVisible();
        await page.context().storageState({ path: authFile });
      });
    expected: "The setup project runs first and writes `playwright/.auth/user.json`; tests in the `chromium` project open already signed in. Tests that change account data should use their own account, as in the journey card."
    sources:
      - title: Authentication — Playwright
        url: https://playwright.dev/docs/auth
    validation: *compiled
  - id: cypress-same-flow
    kind: code
    title: The same flow in Cypress
    note: "Cypress commands are queued chains, not promises: never `await` them, and let `should` retry the assertion."
    prerequisites:
      - "`npm i -D cypress @testing-library/cypress`, then `import \"@testing-library/cypress/add-commands\"` in `cypress/support/e2e.ts`"
      - "In `cypress/tsconfig.json`, `\"compilerOptions\": { \"types\": [\"cypress\", \"@testing-library/cypress\"] }` so `cy.findByRole` type-checks"
      - "Set `baseUrl` in `cypress.config.ts`, save as `cypress/e2e/todos.cy.ts`, and run `npx cypress run`"
    code: |-
      describe("to-dos", () => {
        beforeEach(() => {
          // cy.session caches the cookies and storage of this login across the tests of a spec
          cy.session("ada", () => {
            cy.request("POST", "/api/test/login", { email: "ada@example.com" });
          });
          cy.intercept("GET", "/api/todos", { fixture: "todos.json" }).as("todos");
          cy.visit("/");
          cy.wait("@todos");
        });

        it("adds a to-do", () => {
          cy.findByRole("textbox", { name: "New to-do" }).type("Buy milk{enter}");
          cy.findByRole("list", { name: "To-dos" })
            .findAllByRole("listitem")
            .should("have.length", 3)
            .last()
            .should("have.text", "Buy milk");
          cy.findByRole("status").should("have.text", "3 left");
        });
      });
    expected: "The test logs in once per spec run, serves `/api/todos` from `cypress/fixtures/todos.json` (two items), and passes."
    sources:
      - title: cy.session — Cypress
        url: https://docs.cypress.io/api/commands/session
      - title: Cypress Testing Library
        url: https://testing-library.com/docs/cypress-testing-library/intro
    validation:
      status: excerpt
      host: a Cypress project with `@testing-library/cypress` (neither is among this catalog's example libraries)
  - id: flake-checklist
    kind: rules
    title: The flake checklist
    note: A test that fails one run in fifty is a test nobody believes — fix the cause, do not add retries.
    items:
      - tone: bad
        text: "Fixed sleeps (`waitForTimeout`, `cy.wait(2000)`, `setTimeout` in a test). Wait for something the user can see: web-first assertions, `findBy*`."
      - tone: bad
        text: "Reading a value once and asserting on it (`expect(await locator.count()).toBe(1)`) — use `await expect(locator).toHaveCount(1)`, which retries."
      - tone: bad
        text: "Shared accounts and global resets with `fullyParallel: true`: workers wipe each other's data. Give each test its own account or records, and run it alone with `--repeat-each`."
      - tone: good
        text: "Isolate what is not under test: stub third parties and error paths (`page.route`, MSW), pin the clock (`page.clock.install()`), `locale` and `timezoneId`."
      - tone: good
        text: "Select by role, label or text; a `data-testid` only where no accessible name exists. Never CSS paths or `nth-child`."
      - tone: good
        text: "Record a trace on the first retry (`trace: \"on-first-retry\"`) and read it before touching the test; run new tests with `--repeat-each=20` before merging."
      - tone: neutral
        text: "Retries in CI (`retries: 2`) hide flakes — keep them, but report flaky tests and treat each one as a bug."
