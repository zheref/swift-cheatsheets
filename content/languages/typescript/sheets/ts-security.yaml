  - id: password-hashing-server
    kind: code
    title: "Passwords: a slow, salted KDF on the server"
    note: "Store passwords with a slow, salted KDF — here scrypt at OWASP's minimum, N=2^17, r=8, p=1, which needs `maxmem` above Node's 32 MiB default — in a PHC-style string, compared in constant time, failing closed on a corrupt record and re-hashed when the parameters change."
    prerequisites:
      - Node.js 22.18 or later (it runs `.mts` files directly by stripping the types)
      - "Save as `main.mts` and run `node main.mts`"
    code: |-
      import { scrypt, randomBytes, timingSafeEqual } from "node:crypto";

      // Prefer Argon2id where you have it (OWASP: m=19 MiB, t=2, p=1): crypto.argon2("argon2id", …) on
      // Node 24.7+ ("Stability: 1.2 - Release candidate"), or the argon2 npm package on Node 22.
      type Params = { log2N: number; r: number; p: number };
      const CURRENT: Params = { log2N: 17, r: 8, p: 1 };   // OWASP's scrypt minimum: N=2^17, r=8, p=1 (128 MiB)
      const MAXMEM = 256 * 1024 * 1024;                    // Node's 32 MiB default would throw for these
      const b64 = (bytes: Buffer) => bytes.toString("base64").replace(/=+$/, "");

      function derive(password: string, salt: Buffer, { log2N, r, p }: Params): Promise<Buffer> {
        return new Promise((resolve, reject) => {
          const options = { N: 2 ** log2N, r, p, maxmem: MAXMEM };
          scrypt(password.normalize("NFKC"), salt, 32, options, (err, key) => (err ? reject(err) : resolve(key)));
        });
      }

      async function hashPassword(password: string, params = CURRENT): Promise<string> {
        const salt = randomBytes(16);                      // unique per user: equal passwords hash differently
        const key = await derive(password, salt, params);
        return `$scrypt$ln=${params.log2N},r=${params.r},p=${params.p}$${b64(salt)}$${b64(key)}`;   // PHC style
      }

      const STORED = /^\$scrypt\$ln=(\d+),r=(\d+),p=(\d+)\$([A-Za-z0-9+/]{22})\$([A-Za-z0-9+/]{43})$/;

      async function verifyPassword(password: string, stored: string) {
        const m = STORED.exec(stored);
        if (!m) return { ok: false, rehash: false };      // corrupt or foreign record: a failed login, not a crash
        const params = { log2N: Number(m[1]), r: Number(m[2]), p: Number(m[3]) };
        const key = await derive(password, Buffer.from(m[4]!, "base64"), params).catch(() => null);
        const ok = key !== null && timingSafeEqual(key, Buffer.from(m[5]!, "base64"));   // both 32 bytes
        const outdated = params.log2N < CURRENT.log2N || params.r < CURRENT.r || params.p < CURRENT.p;
        return { ok, rehash: ok && outdated };            // re-hash with CURRENT while the password is at hand
      }

      const pass = "correct horse battery staple";
      const stored = await hashPassword(pass);
      console.log(stored.startsWith("$scrypt$ln=17,r=8,p=1$"), "| salted:", stored !== (await hashPassword(pass)));
      console.log("right:", await verifyPassword(pass, stored));
      console.log("wrong:", await verifyPassword(pass + "r", stored));
      console.log("corrupt:", await verifyPassword(pass, stored.slice(0, -5)));
      const legacy = await hashPassword(pass, { log2N: 14, r: 8, p: 1 });   // last year's setting
      console.log("old parameters:", await verifyPassword(pass, legacy));
    expected: |-
      true | salted: true
      right: { ok: true, rehash: false }
      wrong: { ok: false, rehash: false }
      corrupt: { ok: false, rehash: false }
      old parameters: { ok: true, rehash: true }
    applies:
      platforms: [node]
      runtime: Node.js 22.18+ (a server — never hash passwords only in the browser)
      versions: { typescript: ">=5.5", node: ">=22.18" }
    sources:
      - title: Password Storage — OWASP
        url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      - title: crypto.scrypt — Node.js documentation
        url: https://nodejs.org/api/crypto.html#cryptoscryptpassword-salt-keylen-options-callback
      - title: crypto.argon2 — Node.js documentation
        url: https://nodejs.org/api/crypto.html#cryptoargon2algorithm-parameters-callback
    validation: *ran
  - id: passkeys-webauthn
    kind: code
    title: Passkeys with WebAuthn, in outline
    note: "The server issues a one-time challenge as JSON, the browser asks the authenticator (Face ID, Windows Hello, a security key), and the server verifies the signed response, so no shared secret ever exists (the JSON helpers are Baseline 2025)."
    prerequisites:
      - "A page served over HTTPS (or `localhost`) whose origin matches the relying-party ID"
      - "A server that creates and verifies WebAuthn options — e.g. with `@simplewebauthn/server` — at `/webauthn/*`"
      - "An `<input autocomplete=\"username webauthn\">` on the sign-in page for passkey autofill"
    code: |-
      async function postJson(path: string, body: unknown = {}): Promise<any> {
        const response = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
        return response.json();
      }

      export async function registerPasskey(): Promise<void> {
        const options = await postJson("/webauthn/register/options");   // rp, user, challenge, algorithms
        const credential = await navigator.credentials.create({
          publicKey: PublicKeyCredential.parseCreationOptionsFromJSON(options),
        });
        if (!(credential instanceof PublicKeyCredential)) throw new Error("registration cancelled");
        await postJson("/webauthn/register/verify", credential.toJSON());   // the server stores the public key
      }

      export async function signInWithPasskey(signal: AbortSignal): Promise<void> {
        const options = await postJson("/webauthn/login/options");
        const conditional = await PublicKeyCredential.isConditionalMediationAvailable?.();
        const credential = await navigator.credentials.get({
          publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(options),
          mediation: conditional ? "conditional" : "optional",   // conditional: offered in username autofill
          signal,
        });
        if (!(credential instanceof PublicKeyCredential)) throw new Error("sign-in cancelled");
        await postJson("/webauthn/login/verify", credential.toJSON());   // signature, challenge, origin checked
      }
    expected: "Registration stores a passkey on the user's device; afterwards the username field offers it in autofill and signing in needs only the device's biometric or PIN."
    applies:
      platforms: [browser]
      runtime: a browser page over HTTPS
      versions: { typescript: ">=5.5", browsers: "Baseline 2025" }
    sources:
      - title: Web Authentication API — MDN
        url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Authentication_API
      - title: "PublicKeyCredential: parseRequestOptionsFromJSON() — MDN"
        url: https://developer.mozilla.org/en-US/docs/Web/API/PublicKeyCredential/parseRequestOptionsFromJSON_static
      - title: Passkeys — web.dev
        url: https://web.dev/articles/passkey-registration
    validation:
      status: compiled
      toolchain: Node 24.16.0, TypeScript 5.9.3
      date: "2026-11-16"
      host: a browser page over HTTPS with a passkey-capable authenticator and a WebAuthn server
  - id: secrets-validation-redaction
    kind: code
    title: Secrets in config, validation at the boundary, redaction in the logger
    note: "Read secrets from the server's environment and validate them once at startup, validate every request body before it touches the domain, and redact inside the logger (pino's `redact` paths, or better an allowlist of loggable fields) so no call site can forget."
    prerequisites:
      - Node.js 22.18 or later (it runs `.mts` files directly by stripping the types)
      - "`npm i zod`"
      - "Save as `main.mts` and run `node main.mts` (in production pass `process.env` to `loadConfig`)"
    code: |-
      import { z } from "zod";

      const Config = z.object({
        DATABASE_URL: z.url(),
        PAYMENT_API_KEY: z.string().min(20),             // server-only: never prefixed VITE_ / NEXT_PUBLIC_
      });

      function loadConfig(env: Record<string, string | undefined>) {
        const result = Config.safeParse(env);
        const names = result.error?.issues.map((i) => i.path.join(".")).join(", ");   // names, never values
        if (!result.success) throw new Error(`invalid config: ${names}`);
        return result.data;
      }

      const SignUp = z.strictObject({                    // unknown keys rejected: no `isAdmin: true` smuggled in
        email: z.email(),
        displayName: z.string().trim().min(1).max(50),
        password: z.string().min(12).max(200),
      });

      const SENSITIVE = /pass|token|secret|authorization|cookie|key|email/i;
      function redact(value: unknown): unknown {
        if (Array.isArray(value)) return value.map(redact);
        if (value === null || typeof value !== "object") return value;
        const entries = Object.entries(value).map(([k, v]) => [k, SENSITIVE.test(k) ? "[redacted]" : redact(v)]);
        return Object.fromEntries(entries);
      }

      const log = (event: string, data: object) =>      // every log line goes through here
        console.log(JSON.stringify({ event, ...(redact(data) as object) }));

      try {
        loadConfig({ DATABASE_URL: "postgres://db.internal/shop", PAYMENT_API_KEY: "sk_short" });
      } catch (e) {
        console.log((e as Error).message);
      }

      const body = { email: "ana@example.com", displayName: "Ana", password: "a long passphrase", isAdmin: true };
      const parsed = SignUp.safeParse(body);
      console.log("sign-up accepted:", parsed.success, parsed.error?.issues.map((i) => i.code).join(","));
      log("signup_rejected", { headers: { authorization: "Bearer at-123" }, body });
    expected: |-
      invalid config: PAYMENT_API_KEY
      sign-up accepted: false unrecognized_keys
      {"event":"signup_rejected","headers":{"authorization":"[redacted]"},"body":{"email":"[redacted]","displayName":"Ana","password":"[redacted]","isAdmin":true}}
    applies:
      platforms: [node]
      runtime: Node.js 22.18+
      versions: { typescript: ">=5.5", node: ">=22.18", zod: ">=4.0" }
    sources:
      - title: Logging Cheat Sheet — OWASP
        url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
      - title: Redaction — pino
        url: https://getpino.io/#/docs/redaction
      - title: Env variables and modes — Vite
        url: https://vite.dev/guide/env-and-mode
    validation: *ran
  - id: security-privacy-rules
    kind: rules
    title: Security and privacy rules
    note: What reviewers and auditors look for first.
    items:
      - tone: bad
        text: "Tokens in `localStorage`, secrets in the bundle, or `decodeJwt()` used as authentication. The browser is not a safe; the server decides."
      - tone: bad
        text: "`innerHTML`, `insertAdjacentHTML`, `eval` and `new Function` with data. `require-trusted-types-for 'script'` (Baseline 2026) makes the browser refuse them — roll it out in `Content-Security-Policy-Report-Only` first, then add named policies, because it breaks every library that writes HTML strings."
      - tone: bad
        text: "SQL built with template strings, `exec()` with interpolated input, file paths joined from user input. Bind parameters, use `execFile` with an argument array, resolve paths inside a fixed directory."
      - tone: bad
        text: "`rejectUnauthorized: false`, `NODE_TLS_REJECT_UNAUTHORIZED=0` or a custom `checkServerIdentity` that returns early — TLS without certificate verification is plaintext with extra steps. Add a private CA with `ca:` or `NODE_EXTRA_CA_CERTS` instead."
      - tone: good
        text: "HTTPS everywhere with HSTS; cookies `HttpOnly; Secure; SameSite=Lax` with the `__Host-` prefix; refuse writes whose origin is not proven to be yours."
      - tone: good
        text: "Validate at every boundary — request bodies, query strings, environment, webhooks, `postMessage` — with a schema, and reject unknown keys on writes."
      - tone: good
        text: "**Minimise**: collect only the fields a feature needs, keep them only as long as it needs them, and delete on account closure. **Consent**: load analytics and marketing scripts only after an explicit opt-in, and make withdrawing as easy as granting."
      - tone: bad
        text: "Logging request bodies, headers, tokens, passwords, card numbers or full emails. Redact in the logger's configuration, not at each call site."
      - tone: good
        text: "Prefer **Argon2id** for passwords where you have it (OWASP: m=19 MiB, t=2, p=1): `crypto.argon2(\"argon2id\", …)` on Node 24.7+ (\"Stability: 1.2 - Release candidate\"), or the `argon2` npm package on Node 22; scrypt at N=2^17, r=8, p=1 is OWASP's fallback."
      - tone: neutral
        text: "Crypto primitives come from `crypto.subtle` or `node:crypto`, never a hand-rolled algorithm; let vetted libraries (jose, oidc-client-ts, SimpleWebAuthn) own the protocols."
