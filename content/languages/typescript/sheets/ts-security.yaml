id: ts-security
concept: security.auth-and-data
scope: platform
title: "Security, Authentication & Privacy"
group: "Quality & reach"
subtitle: "Where tokens live, OAuth with PKCE and rotating refresh, verifying JWTs, XSS, injection, CSP and CSRF, Web Crypto, Argon2id, passkeys, secrets — and what never reaches a log."
applies:
  platforms: [browser, node]
  runtime: a browser page and a Node.js server; Web Crypto (`crypto.subtle`) is the same API in both
  versions: { typescript: ">=5.5", node: ">=22.18", browsers: "Baseline 2024" }
sources:
  - title: Web Crypto API — MDN
    url: https://developer.mozilla.org/en-US/docs/Web/API/Web_Crypto_API
  - title: RFC 10017 — OAuth 2.0 for Browser-Based Applications
    url: https://www.rfc-editor.org/rfc/rfc10017
  - title: OWASP Cheat Sheet Series
