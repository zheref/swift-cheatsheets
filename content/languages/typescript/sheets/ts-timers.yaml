id: ts-timers
concept: reactive.timers-and-async
scope: platform
title: "Timers & Async Patterns"
group: "Reactive & time"
subtitle: "Delays, tickers, polling, deadlines, debounce and throttle, concurrency limits — with AbortSignal for cancellation and an injected clock for tests."
applies:
  platforms: [browser, node]
  runtime: Node.js or a browser
  versions: { typescript: ">=5.5", node: ">=22.18" }
sources:
  - title: setTimeout — MDN
    url: https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout
  - title: AbortSignal — MDN
    url: https://developer.mozilla.org/en-US/docs/Web/API/AbortSignal
  - title: Timers — Node.js
    url: https://nodejs.org/api/timers.html
