  - id: streaming-pitfalls
    kind: rules
    title: Streaming pitfalls
    note: The bugs that only appear at production volume.
    items:
      - tone: bad
        text: "Unbounded buffers: an array used as a queue, `events.on` over a fast emitter, an RxJS `buffer` with no limit. Every hot source needs a stated policy."
      - tone: bad
        text: "Recomputing the whole window per event — O(n·k) instead of O(n). Slide: add the newcomer, subtract the evicted."
      - tone: bad
        text: "`queue.shift()` on a long array is O(n): use a head index or a ring buffer."
      - tone: bad
        text: "Using processing time when the business asks about event time. Network and device delays reorder everything."
      - tone: bad
        text: "Assuming exactly-once delivery. Design for at-least-once and make the consumer idempotent."
      - tone: bad
        text: "Summing squares for variance — it cancels to nonsense at large offsets. Use Welford."
      - tone: bad
        text: "Counting past 2^53 in a `number`, past 2^32 in a `Uint32Array`, or hashing with bitwise operators and forgetting they are 32-bit: `>>> 0` to read unsigned, `bigint` for more."
      - tone: bad
        text: "A merge or operator that stops early without calling `return()` on its inputs leaks their sockets and file handles."
      - tone: good
        text: "Decide the lateness policy explicitly: drop, hold until a watermark passes, or reopen the window and re-emit."
      - tone: good
        text: "Instrument the stream itself: input rate, drop count, queue depth, end-to-end lag."
