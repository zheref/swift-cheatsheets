cards:
  - id: tca-to-rtk
    kind: table
    title: TCA composition, in Redux Toolkit
    note: "The same jobs — compose features, inject dependencies, cancel effects, test — with RTK's names."
    headers: [Job, TCA, Redux Toolkit]
    rows:
      - - A feature's state, actions and reducer
        - "`@Reducer struct Feature`"
        - "`createSlice({ name, initialState, reducers })`"
      - - Parent embeds children
        - "`Scope(state:action:)`"
        - "`combineSlices(cartSlice, historySlice)`; `injectInto` for lazy features"
      - - One feature reacts to another's event
        - "parent matches `.child(.delegate(…))`"
        - "`extraReducers` with a shared `createAction`, or a listener"
      - - Collections of children
        - "`IdentifiedArrayOf`, `forEach`"
        - "`createEntityAdapter` (`ids` + `entities`)"
      - - Async effect feeding results back
        - "`.run { send in … }`"
        - "`createAsyncThunk` → `pending` / `fulfilled` / `rejected`"
      - - Cancellation
        - "`.cancellable(id:, cancelInFlight: true)`"
        - "the thunk's `signal` and `promise.abort()`; `cancelActiveListeners()` in a listener"
      - - Dependencies
        - "`@Dependency(\\.apiClient)`"
        - "`thunk: { extraArgument }`, `createListenerMiddleware({ extra })`"
      - - Derived state
        - "computed properties"
        - "`createSelector`, slice `selectors`"
      - - Server cache
        - "a client plus effects"
        - "RTK Query `createApi`"
      - - Tests
        - "`TestStore` with `withDependencies`"
