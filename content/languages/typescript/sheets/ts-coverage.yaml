id: ts-coverage
concept: meta.coverage
scope: language
title: Coverage against the Swift Catalog
group: Coverage
subtitle: Every Swift topic, and what this catalog has for it — an equivalent, a partial counterpart, or the reason there is none.
cards:
  - id: how-to-read
    kind: rules
    title: How to read the matrix
    note: Nothing here is a translation made to fill a gap.
    items:
      - tone: good
        text: "**equivalent** — a sheet here covers the same concept and shares its concept id, so the language selector lands on it from the Swift sheet."
      - tone: neutral
        text: "**partial** — a sheet here covers part of it under its own concept id, so the selector does not land on it: the Here column names it and the reason says what is missing."
      - tone: bad
        text: "**no counterpart** — nothing here; the reason says whether the topic does not exist in this language or is simply not written yet."
  - id: matrix
    kind: table
    title: Swift topic by topic
    note: In the Swift catalog's reading order.
    headers: [Swift topic, Disposition, Here, Why]
    rows:
      - ["SwiftUI — State & Data Flow", "equivalent", "React — State & Data Flow", "which hook owns which state, lifting and context, effects tied to the component — React's answer to the property-wrapper table"]
      - ["SwiftUI — Views, Layout & Animation", "equivalent", "React — Components, Layout & Animation", "components and props, lists with keys, layout with flexbox and grid, routing, transitions and the re-render rules"]
      - ["SwiftUI vs UIKit", "equivalent", "jQuery vs React vs SolidJS", "the same screen written imperatively and declaratively, and what each model costs"]
      - ["UIKit — Programmatic UI", "equivalent", "The DOM & jQuery — Programmatic UI", "building and updating a screen by hand — elements, events, layout and cleanup — with the DOM API and jQuery"]
      - ["SwiftUI — Styling, Design Tokens & Theming", "equivalent", "Styling — Design Tokens & Chakra UI", "design tokens, semantic colours, dark mode, component variants and responsive values; Tailwind has its own sheet"]
      - ["MVVM — View Models, Bindings & Observation", "equivalent", "MVVM & Lightweight Stores", "a view model the view observes, two-way form binding, loading states and testing it without the view"]
      - ["TCA — Core Loop", "equivalent", "Redux — Core Loop", "state, action, reducer, store and effects — the loop TCA shares with Redux"]
      - ["TCA — Composition, Dependencies, Testing", "equivalent", "Redux Toolkit — Slices, Effects, Testing", "composing slices, injecting dependencies into effects, and testing reducers and effects"]
      - ["TCA + SwiftUI — Navigation & UI", "no counterpart", "—", "state-driven navigation is a Swift library's API; on the web, navigation belongs to the router and the URL, not the store"]
      - ["Modern Swift Concurrency — Core", "equivalent", "Async/Await, Promises & Cancellation", "async/await, fan-out, cancellation, async iteration and callback bridging on the event loop"]
      - ["Actors, Sendable & Isolation", "partial", "Concurrency Models — Event Loop, Workers & Atomics", "workers isolate by message passing and share only `SharedArrayBuffer`; the language has no actor or `Sendable` checking"]
      - ["Swift 6 Concurrency — Do's & Don'ts", "no counterpart", "—", "about migrating to Swift 6's strict concurrency checking"]
      - ["Multithreading — GCD vs Combine vs async/await", "equivalent", "Concurrency Models — Event Loop, Workers & Atomics", "the same jobs — off the main thread, fan-out, shared state, cancellation — on the event loop and in workers"]
      - ["Combine — Core", "equivalent", "RxJS — Core", "observables, subjects, the operators that matter, error handling, subscription lifetime and bridging to promises"]
      - ["Timers & Async Patterns — Combine vs async/await", "equivalent", "Timers & Async Patterns", "repeating timers, delays, polling, timeouts and scheduled work, with and without RxJS"]
      - ["SwiftUI + Combine — Wiring Them Together", "equivalent", "RxJS + React — Wiring Them Together", "subscribing a component to a stream, view models over observables, and the pitfalls"]
      - ["Timing Operators — Combine vs Swift Concurrency", "equivalent", "Timing Operators — RxJS vs Plain Async", "debounce, throttle, delay, timeout and batching, in RxJS and by hand, with injectable time"]
      - ["RxSwift — Core", "partial", "RxJS — Core", "RxJS is the same ReactiveX family and already stands as Combine's equivalent; traits, `DisposeBag` and RxCocoa bindings are RxSwift's own"]
      - ["Clean Code in Swift", "equivalent", "Clean Code in TypeScript", "naming, small functions, arguments, comments, errors and guard clauses in TypeScript's idiom"]
      - ["SOLID in Swift", "equivalent", "SOLID in TypeScript", "the five principles as before and after, with structural types and functions"]
      - ["Functional Programming in Swift", "equivalent", "Functional Programming in TypeScript", "pure functions, composition, currying, option and result unions, laziness and memoization"]
      - ["Swift Language Essentials", "equivalent", "TypeScript Language Essentials", "the same questions — generics, optionals, errors, value vs reference, pattern matching — answered for TypeScript"]
      - ["Collections — Types & Protocols", "equivalent", "Collections — Array, Map, Set & Friends", "which container and what it costs"]
      - ["Collections — Operation Cookbook", "equivalent", "Collections — Operation Cookbook", "transform, fold, search, sort, group, slice, dedupe, lazy pipelines"]
      - ["Strings — Characters, Unicode & Operations", "equivalent", "Strings — Standard Operations", "code units vs code points vs graphemes, normalization, searching, formatting and safe comparison"]
      - ["Serialization — Codable, JSON & Friends", "equivalent", "Serialization — JSON, Validation & Binary", "typed decoding with validation at the boundary, dates and big numbers, versioned payloads and binary formats"]
      - ["Swift Engineering Best Practices", "equivalent", "TypeScript Engineering Best Practices", "API design, errors, configuration and secrets, logging, performance and project hygiene"]
      - ["Architectural Approaches", "equivalent", "Architectural Approaches", "MVC, MVVM, Flux and clean layering compared for web and Node applications"]
      - ["Modularization Approaches", "equivalent", "Modularization Approaches", "ES modules, package boundaries, workspaces and enforcing a public surface"]
      - ["Testing Approaches on iOS", "equivalent", "Testing Approaches in TypeScript", "runner, assertions, test doubles, injectable time, async assertions and an integration test"]
      - ["UI & End-to-End Testing", "equivalent", "UI & End-to-End Testing", "component tests with Testing Library and browser tests with Playwright, by role and label rather than by markup"]
      - ["Security, Authentication & Privacy", "equivalent", "Security, Authentication & Privacy", "sessions and tokens, OAuth with PKCE, password hashing, XSS and CSRF, secrets and data minimisation"]
      - ["Accessibility on Apple Platforms", "equivalent", "Accessibility on the Web", "semantics first, names and roles, focus management, live regions, reduced motion and testing it"]
      - ["Localization & Internationalization", "equivalent", "Localization with Intl", "messages with plurals, numbers, dates, lists and collation with `Intl`, right-to-left layout and pseudo-locales"]
      - ["AI Workflows for Swift (Cursor + Claude)", "no counterpart", "—", "Swift-specific by design: it is about why Swift is harder for models and wiring Xcode to an agent"]
      - ["Algorithmic Patterns & Complexity", "equivalent", "Algorithmic Patterns & Complexity", "built-in costs and the same patterns, from two pointers to tries and union-find"]
      - ["Streaming & Time-Series Patterns", "equivalent", "Streaming & Time-Series Patterns", "ring buffers, running statistics, sketches, rate limiting, backpressure and batching"]
      - ["Files, Text & Atomic I/O", "equivalent", "Node.js — Files, Text & Atomic I/O", "the same file-safety questions on Node's fs"]
      - ["Networking — REST with URLSession", "equivalent", "Networking — REST with fetch", "a typed client, timeouts and cancellation, retries with backoff, pagination, caching and token refresh"]
      - ["Networking — SOAP, gRPC & GraphQL", "equivalent", "Networking — SOAP, gRPC & GraphQL", "the same three protocols from a browser or Node client, and when each is the right one"]
      - ["Video Streaming — HLS & AVPlayer", "equivalent", "Video Streaming — HLS, DASH & Media Source", "adaptive playback with hls.js and dash.js over Media Source Extensions, quality, captions, errors and DRM"]
      - ["Core Bluetooth (BLE)", "no counterpart", "—", "an Apple framework; Web Bluetooth exists only in Chromium-based browsers and is not covered"]
      - ["Project Bluebird", "no counterpart", "—", "The project walkthrough assembles SwiftUI and iOS platform APIs into a single exercise."]
