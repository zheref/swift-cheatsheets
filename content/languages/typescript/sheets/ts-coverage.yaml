id: ts-coverage
concept: meta.coverage
scope: language
title: Coverage against the Swift Catalog
group: Coverage
subtitle: Every Swift topic, and what this catalog has for it — an equivalent, a partial counterpart, or the reason there is none.
cards:
  - id: how-to-read
    kind: rules
    title: How to read the matrix
    note: Nothing here is a translation made to fill a gap.
    items:
      - tone: good
        text: "**equivalent** — a sheet here covers the same concept and shares its concept id, so the language selector lands on it from the Swift sheet."
      - tone: neutral
        text: "**partial** — a sheet here covers part of it under its own concept id, so the selector does not land on it: the Here column names it and the reason says what is missing."
      - tone: bad
        text: "**no counterpart** — nothing here; the reason says whether the topic does not exist in this language or is simply not written yet."
  - id: matrix
    kind: table
    title: Swift topic by topic
    note: In the Swift catalog's reading order.
    headers: [Swift topic, Disposition, Here, Why]
    rows:
      - ["SwiftUI — State & Data Flow", "partial", "Browser — State, Events & Requests", "framework-free state and rendering; the property-wrapper decision table belongs to UI frameworks (React, Vue, Svelte), not to TypeScript"]
      - ["SwiftUI — Views, Layout & Animation", "no counterpart", "—", "layout and animation are HTML, CSS and a UI framework's business, not the language's"]
      - ["SwiftUI vs UIKit", "no counterpart", "—", "a comparison of two Apple UI frameworks; the web has no such pair in the language"]
      - ["TCA — Core Loop", "no counterpart", "—", "The Composable Architecture is a Swift library; Redux-style reducers are not written up here yet"]
      - ["TCA — Composition, Dependencies, Testing", "no counterpart", "—", "a Swift library's API"]
      - ["TCA + SwiftUI — Navigation & UI", "no counterpart", "—", "a Swift library's API on an Apple UI framework"]
      - ["Modern Swift Concurrency — Core", "equivalent", "Async/Await, Promises & Cancellation", "async/await, fan-out, cancellation, async iteration and callback bridging on the event loop"]
      - ["Actors, Sendable & Isolation", "no counterpart", "—", "each JavaScript realm runs on one thread, so ordinary objects cannot race; workers share only messages and `SharedArrayBuffer`"]
      - ["Swift 6 Concurrency — Do's & Don'ts", "no counterpart", "—", "about migrating to Swift 6's strict concurrency checking"]
      - ["Multithreading — GCD vs Combine vs async/await", "partial", "Async/Await, Promises & Cancellation", "one event loop: the callback → promise → async/await progression is there, thread pools are not"]
      - ["Combine — Core", "partial", "Async/Await, Promises & Cancellation", "async iterables cover pull-based streams; push-based operator libraries (RxJS) are not part of the language and not covered"]
      - ["Timers & Async Patterns — Combine vs async/await", "partial", "Async/Await, Promises & Cancellation", "delays, timeouts, polling and fan-out are covered; there is no Combine side to compare"]
      - ["SwiftUI + Combine — Wiring Them Together", "no counterpart", "—", "specific to two Apple frameworks"]
      - ["Timing Operators — Combine vs Swift Concurrency", "partial", "Testing Approaches in TypeScript", "a hand-written debounce tested with fake timers; the language has no timing operators"]
      - ["Clean Code in Swift", "no counterpart", "—", "not written yet; the principles are language-neutral and the Swift sheet's advice carries over"]
      - ["SOLID in Swift", "no counterpart", "—", "not written yet; the principles are language-neutral"]
      - ["Functional Programming in Swift", "partial", "Modeling with the Type System", "unions that make illegal states unrepresentable; higher-order functions are in the operation cookbook; no composition or currying card"]
      - ["Swift Language Essentials", "equivalent", "TypeScript Language Essentials", "the same questions — generics, optionals, errors, value vs reference, pattern matching — answered for TypeScript"]
      - ["Collections — Types & Protocols", "equivalent", "Collections — Array, Map, Set & Friends", "which container and what it costs"]
      - ["Collections — Operation Cookbook", "equivalent", "Collections — Operation Cookbook", "transform, fold, search, sort, group, slice, dedupe, lazy pipelines"]
      - ["Swift Engineering Best Practices", "no counterpart", "—", "not written yet"]
      - ["Architectural Approaches", "no counterpart", "—", "not written yet; web architectures are framework-specific"]
      - ["Modularization Approaches", "no counterpart", "—", "not written yet; ES modules and package boundaries are a different mechanism from Swift packages"]
      - ["Testing Approaches on iOS", "equivalent", "Testing Approaches in TypeScript", "runner, assertions, test doubles, injectable time and async assertions with node:test"]
      - ["AI Workflows for Swift (Cursor + Claude)", "no counterpart", "—", "Swift-specific by design: it is about why Swift is harder for models and wiring Xcode to an agent"]
      - ["Algorithmic Patterns & Complexity", "equivalent", "Algorithmic Patterns & Complexity", "built-in costs and five core patterns; fewer patterns than the Swift sheet"]
      - ["Streaming & Time-Series Patterns", "no counterpart", "—", "not written yet; the algorithms (ring buffers, sketches, reservoir sampling) are language-neutral"]
      - ["Files, Text & Atomic I/O", "equivalent", "Node.js — Files, Text & Atomic I/O", "the same file-safety questions on Node's fs"]
      - ["Core Bluetooth (BLE)", "no counterpart", "—", "an Apple framework; Web Bluetooth exists only in Chromium-based browsers and is not covered"]
