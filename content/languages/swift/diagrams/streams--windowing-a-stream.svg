)" opacity=".22" stroke="var(--good)" stroke-width="1.2"/><text x="613.5" y="86.5" font-size="9.5" text-anchor="middle" fill="var(--good)" font-weight="700">W3</text><rect x="719.0" y="68" width="203.0" height="30" rx="5" fill="var(--good)" opacity=".22" stroke="var(--good)" stroke-width="1.2"/><text x="820.5" y="86.5" font-size="9.5" text-anchor="middle" fill="var(--good)" font-weight="700">W4</text><text x="6" y="132" font-size="10.5" text-anchor="start" fill="var(--modern)" font-weight="700">sliding</text><text x="6" y="145" font-size="8.8" text-anchor="start" fill="var(--faint)">size 40, step 20</text><rect x="98.0" y="112" width="327.2" height="12" rx="5" fill="var(--modern)" opacity=".22" stroke="var(--modern)" stroke-width="1.2"/><rect x="263.6" y="126" width="327.2" height="12" rx="5" fill="var(--modern)" opacity=".22" stroke="var(--modern)" stroke-width="1.2"/><rect x="429.2" y="112" width="327.2" height="12" rx="5" fill="var(--modern)" opacity=".22" stroke="var(--modern)" stroke-width="1.2"/><rect x="594.8" y="126" width="327.2" height="12" rx="5" fill="var(--modern)" opacity=".22" stroke="var(--modern)" stroke-width="1.2"/><text x="924.0" y="152" font-size="9" text-anchor="end" fill="var(--modern)">overlapping - every event lands in 2 windows</text><text x="6" y="186" font-size="10.5" text-anchor="start" fill="var(--legacy)" font-weight="700">session</text><text x="6" y="199" font-size="8.8" text-anchor="start" fill="var(--faint)">gap &gt; 6 closes it</text><rect x="104.3" y="172" width="207.0" height="30" rx="5" fill="var(--legacy)" opacity=".22" stroke="var(--legacy)" stroke-width="1.2"/><text x="207.77999999999997" y="190.5" font-size="9.5" text-anchor="middle" fill="var(--legacy)" font-weight="700">session 1</text><rect x="352.7" y="172" width="99.4" height="30" rx="5" fill="var(--legacy)" opacity=".22" stroke="var(--legacy)" stroke-width="1.2"/><text x="402.36" y="190.5" font-size="9.5" text-anchor="middle" fill="var(--legacy)" font-weight="700">sess