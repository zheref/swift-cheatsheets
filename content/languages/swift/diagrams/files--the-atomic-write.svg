<svg class="dg" viewBox="0 0 940 286" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">THE ATOMIC WRITE, STEP BY STEP</text><rect x="3.0" y="42" width="172.4" height="80" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="14.0" y="61" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">1. Write to temp</text><text x="14.0" y="78.0" font-size="9.4" text-anchor="start" class="mono">a NEW file, in the SAME</text><text x="14.0" y="91.5" font-size="9.4" text-anchor="start" class="mono">directory as the target</text><text x="14.0" y="105.0" font-size="9.4" text-anchor="start" class="mono">(rename needs one volume)</text><line x1="177.4" y1="82" x2="189.4" y2="82" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="193.4" y="42" width="172.4" height="80" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="204.4" y="61" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">2. Flush</text><text x="204.4" y="78.0" font-size="9.4" text-anchor="start" class="mono">fsync, or F_FULLFSYNC</text><text x="204.4" y="91.5" font-size="9.4" text-anchor="start" class="mono">for real durability</text><text x="204.4" y="105.0" font-size="9.4" text-anchor="start" class="mono">bytes leave the page cache</text><line x1="367.8" y1="82" x2="379.8" y2="82" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="383.8" y="42" width="172.4" height="80" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="394.8" y="61" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">3. Rename over</text><text x="394.8" y="78.0" font-size="9.4" text-anchor="start" class="mono">rename(2) / replaceItemAt</text><text x="394.8" y="91.5" font-size="9.4" text-anchor="start" class="mono">ATOMIC on one volume:</text><text x="394.8" y="105.0" font-size="9.4" text-anchor="start" class="mono">the swap has no midpoint</text><line x1="558.2" y1="82" x2="570.2" y2="82" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="574.2" y="42" width="172.4" height="80" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="585.2" y="61" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">4. fsync the dir</text><text x="585.2" y="78.0" font-size="9.4" text-anchor="start" class="mono">makes the rename itself</text><text x="585.2" y="91.5" font-size="9.4" text-anchor="start" class="mono">survive power loss</text><text x="585.2" y="105.0" font-size="9.4" text-anchor="start" class="mono">usually skipped - know that</text><line x1="748.6" y1="82" x2="760.6" y2="82" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="764.6" y="42" width="172.4" height="80" rx="9" fill="var(--bg2)" stroke="var(--accent)" stroke-width="1.6"/><text x="775.6" y="61" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="700">5. Done</text><text x="775.6" y="78.0" font-size="9.4" text-anchor="start" class="mono">every reader saw either</text><text x="775.6" y="91.5" font-size="9.4" text-anchor="start" class="mono">the whole old file or</text><text x="775.6" y="105.0" font-size="9.4" text-anchor="start" class="mono">the whole new one</text><text x="4" y="142" font-size="10.5" text-anchor="start" fill="var(--faint)" font-weight="800">IF THE PROCESS DIES HERE...</text><line x1="3" y1="150" x2="934" y2="150" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><rect x="3.0" y="156" width="362.8" height="32" rx="5" fill="var(--good)" opacity=".22" stroke="var(--good)" stroke-width="1.2"/><text x="184.4" y="175.5" font-size="9.5" text-anchor="middle" fill="var(--good)" font-weight="700">old file untouched - a stray temp file is the only damage</text><rect x="383.8" y="156" width="172.4" height="32" rx="5" fill="var(--good)" opacity=".22" stroke="var(--good)" stroke-width="1.2"/><text x="470.0" y="175.5" font-size="9.5" text-anchor="middle" fill="var(--good)" font-weight="700">old OR new, never a mix</text><rect x="574.2" y="156" width="359.8" height="32" rx="5" fill="var(--legacy)" opacity=".22" stroke="var(--legacy)" stroke-width="1.2"/><text x="754.1" y="175.5" font-size="9.5" text-anchor="middle" fill="var(--legacy)" font-weight="700">content is correct; on power loss the rename itself may be lost</text><rect x="3" y="202" width="460" height="72" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="14" y="221" font-size="12.5" text-anchor="start" fill="var(--good)" font-weight="700">What Foundation already does for you</text><text x="14" y="238.0" font-size="10.5" text-anchor="start" class="mono">try data.write(to: url, options: .atomic)</text><text x="14" y="251.5" font-size="10.5" text-anchor="start" class="mono">-&gt; temp file + rename. It does NOT fsync,</text><text x="14" y="265.0" font-size="10.5" text-anchor="start" class="mono">so it is crash-safe, not power-loss-safe.</text><rect x="477" y="202" width="457" height="72" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="488" y="221" font-size="12.5" text-anchor="start" fill="var(--bad)" font-weight="700">The classic mistake</text><text x="488" y="238.0" font-size="10.5" text-anchor="start" class="mono">let h = FileHandle(forWritingTo: url)</text><text x="488" y="251.5" font-size="10.5" text-anchor="start" class="mono">h.truncateFile(atOffset: 0)   // &lt;- destroys the</text><text x="488" y="265.0" font-size="10.5" text-anchor="start" class="mono">h.write(newData)              //    only good copy</text></svg>
