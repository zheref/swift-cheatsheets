 fill="var(--faint)">constant</text><text x="618" y="80" font-size="9.6" text-anchor="start" class="mono">dictionary lookup, array index</text><text x="936" y="66" font-size="10" text-anchor="end" fill="var(--good)" font-weight="700">1 step</text><circle cx="606" cy="102" r="4" fill="var(--good)" opacity="1"/><text x="618" y="106" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="800">O(log n)</text><text x="722" y="106" font-size="10" text-anchor="start" fill="var(--faint)">logarithmic</text><text x="618" y="120" font-size="9.6" text-anchor="start" class="mono">binary search, balanced tree</text><text x="936" y="106" font-size="10" text-anchor="end" fill="var(--good)" font-weight="700">~20 steps</text><circle cx="606" cy="142" r="4" fill="var(--modern)" opacity="1"/><text x="618" y="146" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="800">O(n)</text><text x="722" y="146" font-size="10" text-anchor="start" fill="var(--faint)">linear</text><text x="618" y="160" font-size="9.6" text-anchor="start" class="mono">one pass, map / filter / reduce</text><text x="936" y="146" font-size="10" text-anchor="end" fill="var(--modern)" font-weight="700">1 million</text><circle cx="606" cy="182" r="4" fill="var(--legacy)" opacity="1"/><text x="618" y="186" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="800">O(n log n)</text><text x="722" y="186" font-size="10" text-anchor="start" fill="var(--faint)">linearithmic</text><text x="618" y="200" font-size="9.6" text-anchor="start" class="mono">sort(), heap build + drain</text><text x="936" y="186" font-size="10" text-anchor="end" fill="var(--legacy)" font-weight="700">~20 million</text><circle cx="606" cy="222" r="4" fill="var(--bad)" opacity="1"/><text x="618" y="226" font-size="11.5" text-anchor="start" fill="var(--bad)" font-weight="800">O(n^2)</text><text x="722" y="226" font-size="10" text-anchor="start" fill="var(--faint)">quadratic</text><text x="618" y="240" font-size="9.6" text-anchor="start" class="mono">nested loop, naive dedupe</text><text x="936" y="226" font-size="10" text-anchor="end" fill="var(--bad)" font-weight="700">10^12 - too slow</text><circle cx="606" cy="262" r="4" fill="var(--bad)" opacity="1"/><text x="618" y="266" font-size="11.5" text-anchor="start" fill="var(--bad)" font-weight="800">O(2^n), O(n!)</text><text x="722" y="266" font-size="10" text-anchor="start" fill="var(--faint)">exponential</text><text x="618" y="280" font-size="9.6" text-anchor="start" class="mono">all subsets, all permutations</text><text x="936" y="266" font-size="10" text-anchor="end" fill="var(--bad)" font-weight="700">not happening</text><text x="4" y="320" font-size="10.5" text-anchor="start" fill="var(--faint)">Space matters too: recursion depth is O(n) stack. An interviewer asking "can you do better?" usually means drop one factor of n with a hash map, a sort, or two pointers.</text></svg>
