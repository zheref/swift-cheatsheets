<svg class="dg" viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">CLEAN ARCHITECTURE - THE DEPENDENCY RULE</text><rect x="12" y="30" width="462" height="292" rx="14" fill="var(--legacy)" opacity=".10" stroke="var(--legacy)" stroke-width="1.6"/><text x="24" y="48" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="800">Frameworks &amp; Drivers</text><rect x="52" y="68" width="382" height="216" rx="14" fill="var(--typ)" opacity=".10" stroke="var(--typ)" stroke-width="1.6"/><text x="64" y="86" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="800">Interface Adapters</text><rect x="100" y="108" width="286" height="136" rx="14" fill="var(--modern)" opacity=".10" stroke="var(--modern)" stroke-width="1.6"/><text x="112" y="126" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="800">Use Cases</text><rect x="150" y="148" width="186" height="56" rx="14" fill="var(--good)" opacity=".10" stroke="var(--good)" stroke-width="1.6"/><text x="162" y="166" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="800">Entities</text><line x1="470" y1="340" x2="300" y2="340" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ah-accent)"/><text x="478" y="344" font-size="10.5" text-anchor="start" fill="var(--accent)" font-weight="700">source-code dependencies point INWARD only</text><text x="12" y="340" font-size="10" text-anchor="start" fill="var(--faint)">inner layers know nothing about outer ones</text><rect x="496" y="30" width="440" height="70" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="507" y="49" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Frameworks &amp; Drivers</text><text x="507" y="66.0" font-size="9.8" text-anchor="start" class="mono">SwiftUI / UIKit views, URLSession,</text><text x="507" y="79.5" font-size="9.8" text-anchor="start" class="mono">CoreData, CoreBluetooth, Keychain</text><text x="507" y="93.0" font-size="9.8" text-anchor="start" class="mono">-&gt; disposable detail; swap freely</text><rect x="496" y="108" width="440" height="70" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="507" y="127" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">Interface Adapters</text><text x="507" y="144.0" font-size="9.8" text-anchor="start" class="mono">ViewModels / Presenters, Repository</text><text x="507" y="157.5" font-size="9.8" text-anchor="start" class="mono">implementations, DTO &lt;-&gt; Entity mappers</text><text x="507" y="171.0" font-size="9.8" text-anchor="start" class="mono">-&gt; where protocols get satisfied</text><rect x="496" y="186" width="440" height="70" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="507" y="205" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">Use Cases (Interactors)</text><text x="507" y="222.0" font-size="9.8" text-anchor="start" class="mono">PlaceOrder, SyncDevices, Refund</text><text x="507" y="235.5" font-size="9.8" text-anchor="start" class="mono">orchestrate entities; no UIKit import</text><text x="507" y="249.0" font-size="9.8" text-anchor="start" class="mono">-&gt; depends on protocols it declares</text><rect x="496" y="264" width="440" height="70" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="507" y="283" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Entities</text><text x="507" y="300.0" font-size="9.8" text-anchor="start" class="mono">struct Order, Money, DeviceID</text><text x="507" y="313.5" font-size="9.8" text-anchor="start" class="mono">pure Swift, no frameworks</text><text x="507" y="327.0" font-size="9.8" text-anchor="start" class="mono">-&gt; the rules that outlive the app</text></svg>
