<svg class="dg" viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">THE TEST PYRAMID, iOS EDITION</text><polygon points="250.000000,26.000000 250.000000,26.000000 314.830769,112.000000 185.169231,112.000000" fill="var(--bad)" opacity=".17" stroke="var(--bad)" stroke-width="1.5"/><text x="250.0" y="86.0" font-size="12" text-anchor="middle" fill="var(--bad)" font-weight="800">UI / End-to-end</text><text x="250.0" y="101.0" font-size="10.5" text-anchor="middle" fill="var(--bad)" font-weight="700">5 - 10 %</text><polygon points="185.169231,112.000000 314.830769,112.000000 380.415385,199.000000 119.584615,199.000000" fill="var(--legacy)" opacity=".17" stroke="var(--legacy)" stroke-width="1.5"/><text x="250.0" y="173.0" font-size="12" text-anchor="middle" fill="var(--legacy)" font-weight="800">Integration</text><text x="250.0" y="188.0" font-size="10.5" text-anchor="middle" fill="var(--legacy)" font-weight="700">20 - 30 %</text><polygon points="119.584615,199.000000 380.415385,199.000000 446.000000,286.000000 54.000000,286.000000" fill="var(--good)" opacity=".17" stroke="var(--good)" stroke-width="1.5"/><text x="250.0" y="260.0" font-size="12" text-anchor="middle" fill="var(--good)" font-weight="800">Unit</text><text x="250.0" y="275.0" font-size="10.5" text-anchor="middle" fill="var(--good)" font-weight="700">60 - 70 %</text><line x1="24" y1="286.0" x2="24" y2="32.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><text x="14" y="156" font-size="9.5" font-weight="700" fill="var(--faint)" text-anchor="middle" transform="rotate(-90 14 156)">slower - flakier - costlier</text><rect x="500" y="18" width="436" height="88" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="511" y="37" font-size="12.5" text-anchor="start" fill="var(--bad)" font-weight="700">UI / End-to-end</text><text x="511" y="54.0" font-size="10.5" text-anchor="start" class="mono">XCUITest, XCUIApplication</text><text x="511" y="67.5" font-size="10.5" text-anchor="start" class="mono">minutes, flaky, needs a device</text><text x="511" y="81.0" font-size="10.5" text-anchor="start" class="mono">launch args to stub the backend</text><text x="511" y="94.5" font-size="10.5" text-anchor="start" class="mono">assert: 3-5 critical journeys only</text><rect x="500" y="114" width="436" height="88" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="511" y="133" font-size="12.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Integration</text><text x="511" y="150.0" font-size="10.5" text-anchor="start" class="mono">XCTest + real collaborators</text><text x="511" y="163.5" font-size="10.5" text-anchor="start" class="mono">URLProtocol / in-memory store</text><text x="511" y="177.0" font-size="10.5" text-anchor="start" class="mono">seconds; no live network</text><text x="511" y="190.5" font-size="10.5" text-anchor="start" class="mono">assert: modules wired correctly</text><rect x="500" y="210" width="436" height="88" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="511" y="229" font-size="12.5" text-anchor="start" fill="var(--good)" font-weight="700">Unit</text><text x="511" y="246.0" font-size="10.5" text-anchor="start" class="mono">Swift Testing / XCTest</text><text x="511" y="259.5" font-size="10.5" text-anchor="start" class="mono">pure functions, reducers, mappers</text><text x="511" y="273.0" font-size="10.5" text-anchor="start" class="mono">milliseconds, deterministic</text><text x="511" y="286.5" font-size="10.5" text-anchor="start" class="mono">assert: logic + edge cases</text><text x="500" y="316" font-size="11" text-anchor="start" fill="var(--accent)" font-weight="700">Rule: if a bug can be caught one layer down, write it one layer down.</text></svg>
