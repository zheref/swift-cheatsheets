<svg class="dg" viewBox="0 0 940 322" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">THE PROTOCOL LADDER - EACH RUNG ADDS A GUARANTEE</text><rect x="3.0" y="42" width="214.0" height="92" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="14.0" y="61" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Sequence</text><text x="14.0" y="78.0" font-size="9.4" text-anchor="start" class="mono">ONE pass, may be infinite</text><text x="14.0" y="91.5" font-size="9.4" text-anchor="start" class="mono">makeIterator() / next()</text><text x="14.0" y="105.0" font-size="9.4" text-anchor="start" class="mono">map filter reduce first(where:)</text><text x="14.0" y="118.5" font-size="9.4" text-anchor="start" class="mono">no count, no indices, no reuse</text><line x1="219.0" y1="88" x2="239.0" y2="88" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><text x="229.0" y="82.0" font-size="9.5" text-anchor="middle" fill="var(--faint)" font-weight="700">refines</text><rect x="243.0" y="42" width="214.0" height="92" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="254.0" y="61" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">Collection</text><text x="254.0" y="78.0" font-size="9.4" text-anchor="start" class="mono">multi-pass, finite, indexed</text><text x="254.0" y="91.5" font-size="9.4" text-anchor="start" class="mono">startIndex endIndex subscript</text><text x="254.0" y="105.0" font-size="9.4" text-anchor="start" class="mono">count isEmpty indices first</text><text x="254.0" y="118.5" font-size="9.4" text-anchor="start" class="mono">index math may be O(n)</text><line x1="459.0" y1="88" x2="479.0" y2="88" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><text x="469.0" y="82.0" font-size="9.5" text-anchor="middle" fill="var(--faint)" font-weight="700">refines</text><rect x="483.0" y="42" width="214.0" height="92" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="494.0" y="61" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">BidirectionalCollection</text><text x="494.0" y="78.0" font-size="9.4" text-anchor="start" class="mono">can walk backwards</text><text x="494.0" y="91.5" font-size="9.4" text-anchor="start" class="mono">index(before:) last reversed()</text><text x="494.0" y="105.0" font-size="9.4" text-anchor="start" class="mono">String Set Dictionary</text><text x="494.0" y="118.5" font-size="9.4" text-anchor="start" class="mono">suffix / dropLast are cheap</text><line x1="699.0" y1="88" x2="719.0" y2="88" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><text x="709.0" y="82.0" font-size="9.5" text-anchor="middle" fill="var(--faint)" font-weight="700">refines</text><rect x="723.0" y="42" width="214.0" height="92" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="734.0" y="61" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">RandomAccessCollection</text><text x="734.0" y="78.0" font-size="9.4" text-anchor="start" class="mono">O(1) index offset AND count</text><text x="734.0" y="91.5" font-size="9.4" text-anchor="start" class="mono">distance(from:to:) is O(1)</text><text x="734.0" y="105.0" font-size="9.4" text-anchor="start" class="mono">Array ArraySlice Range</text><text x="734.0" y="118.5" font-size="9.4" text-anchor="start" class="mono">makes sort + binary search fast</text><text x="4" y="158" font-size="11" text-anchor="start" fill="var(--accent)" font-weight="800">ORTHOGONAL CAPABILITIES - MIX THEM IN</text><rect x="3.0" y="166" width="294.0" height="92" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="14.0" y="185" font-size="11.5" text-anchor="start" fill="var(--attr)" font-weight="700">MutableCollection</text><text x="14.0" y="202.0" font-size="9.4" text-anchor="start" class="mono">subscript has a SETTER</text><text x="14.0" y="215.5" font-size="9.4" text-anchor="start" class="mono">length cannot change</text><text x="14.0" y="229.0" font-size="9.4" text-anchor="start" class="mono">swapAt sort() reverse()</text><text x="14.0" y="242.5" font-size="9.4" text-anchor="start" class="mono">shuffle() partition(by:)</text><rect x="323.0" y="166" width="294.0" height="92" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="334.0" y="185" font-size="11.5" text-anchor="start" fill="var(--attr)" font-weight="700">RangeReplaceableCollection</text><text x="334.0" y="202.0" font-size="9.4" text-anchor="start" class="mono">the length CAN change</text><text x="334.0" y="215.5" font-size="9.4" text-anchor="start" class="mono">append insert remove +=</text><text x="334.0" y="229.0" font-size="9.4" text-anchor="start" class="mono">replaceSubrange(_:with:)</text><text x="334.0" y="242.5" font-size="9.4" text-anchor="start" class="mono">removeAll(where:)</text><rect x="643.0" y="166" width="294.0" height="92" rx="9" fill="var(--bg2)" stroke="var(--str)" stroke-width="1.6"/><text x="654.0" y="185" font-size="11.5" text-anchor="start" fill="var(--str)" font-weight="700">SetAlgebra</text><text x="654.0" y="202.0" font-size="9.4" text-anchor="start" class="mono">union intersection subtracting</text><text x="654.0" y="215.5" font-size="9.4" text-anchor="start" class="mono">symmetricDifference</text><text x="654.0" y="229.0" font-size="9.4" text-anchor="start" class="mono">isSubset(of:) isDisjoint(with:)</text><text x="654.0" y="242.5" font-size="9.4" text-anchor="start" class="mono">Set  OptionSet  IndexSet</text><text x="4" y="282" font-size="10.2" text-anchor="start" fill="var(--faint)">Array = RandomAccess + Mutable + RangeReplaceable    String = Bidirectional + RangeReplaceable (NOT RandomAccess)    Set / Dictionary = Bidirectional, not ordered</text><rect x="4" y="292" width="241.7" height="18" rx="9.0" fill="var(--good)" opacity=".16"/><text x="124.85" y="304.5" font-size="10" text-anchor="middle" fill="var(--good)" font-weight="700">target the WEAKEST rung that compiles</text><rect x="251.7" y="292" width="253.9" height="18" rx="9.0" fill="var(--legacy)" opacity=".16"/><text x="378.65" y="304.5" font-size="10" text-anchor="middle" fill="var(--legacy)" font-weight="700">Sequence for infinite or streaming data</text><rect x="511.59999999999997" y="292" width="229.5" height="18" rx="9.0" fill="var(--bad)" opacity=".16"/><text x="626.3499999999999" y="304.5" font-size="10" text-anchor="middle" fill="var(--bad)" font-weight="700">a Slice reuses the parent's indices</text></svg>
