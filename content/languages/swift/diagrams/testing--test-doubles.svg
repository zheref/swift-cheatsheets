<svg class="dg" viewBox="0 0 940 266" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">TEST DOUBLES - KNOW THE FIVE NAMES</text><line x1="120" y1="36" x2="820" y2="36" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-neutral)"/><text x="470" y="30" font-size="10" text-anchor="middle" fill="var(--faint)" font-weight="700">no behaviour   -&gt;   real behaviour</text><rect x="3.0" y="52" width="174.0" height="94" rx="9" fill="var(--bg2)" stroke="var(--faint)" stroke-width="1.6"/><text x="14.0" y="71" font-size="12.5" text-anchor="start" fill="var(--faint)" font-weight="700">Dummy</text><text x="14.0" y="88.0" font-size="10.5" text-anchor="start" class="mono">never actually used;</text><text x="14.0" y="101.5" font-size="10.5" text-anchor="start" class="mono">just fills a slot</text><text x="14.0" y="115.0" font-size="10.5" text-anchor="start" class="mono"></text><text x="14.0" y="128.5" font-size="10.5" text-anchor="start" class="mono">let noop: () -&gt; Void = { }</text><rect x="193.0" y="52" width="174.0" height="94" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="204.0" y="71" font-size="12.5" text-anchor="start" fill="var(--modern)" font-weight="700">Stub</text><text x="204.0" y="88.0" font-size="10.5" text-anchor="start" class="mono">returns canned answers</text><text x="204.0" y="101.5" font-size="10.5" text-anchor="start" class="mono">no assertions on it</text><text x="204.0" y="115.0" font-size="10.5" text-anchor="start" class="mono"></text><text x="204.0" y="128.5" font-size="10.5" text-anchor="start" class="mono">{ _ in .success(.mock) }</text><rect x="383.0" y="52" width="174.0" height="94" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="394.0" y="71" font-size="12.5" text-anchor="start" fill="var(--typ)" font-weight="700">Spy</text><text x="394.0" y="88.0" font-size="10.5" text-anchor="start" class="mono">a stub that RECORDS</text><text x="394.0" y="101.5" font-size="10.5" text-anchor="start" class="mono">what it was asked</text><text x="394.0" y="115.0" font-size="10.5" text-anchor="start" class="mono"></text><text x="394.0" y="128.5" font-size="10.5" text-anchor="start" class="mono">var saved: [Item] = []</text><rect x="573.0" y="52" width="174.0" height="94" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="584.0" y="71" font-size="12.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Mock</text><text x="584.0" y="88.0" font-size="10.5" text-anchor="start" class="mono">stub + verifies the</text><text x="584.0" y="101.5" font-size="10.5" text-anchor="start" class="mono">expected interaction</text><text x="584.0" y="115.0" font-size="10.5" text-anchor="start" class="mono"></text><text x="584.0" y="128.5" font-size="10.5" text-anchor="start" class="mono">#expect(spy.calls == 1)</text><rect x="763.0" y="52" width="174.0" height="94" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="774.0" y="71" font-size="12.5" text-anchor="start" fill="var(--good)" font-weight="700">Fake</text><text x="774.0" y="88.0" font-size="10.5" text-anchor="start" class="mono">a real, lightweight</text><text x="774.0" y="101.5" font-size="10.5" text-anchor="start" class="mono">implementation</text><text x="774.0" y="115.0" font-size="10.5" text-anchor="start" class="mono"></text><text x="774.0" y="128.5" font-size="10.5" text-anchor="start" class="mono">InMemoryRepository()</text><text x="4" y="172" font-size="11" text-anchor="start" fill="var(--accent)" font-weight="700">In Swift you rarely need a mocking framework: a struct of closures IS a stub, a spy and a mock.</text><rect x="4" y="184" width="460" height="70" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="15" y="203" font-size="12.5" text-anchor="start" fill="var(--good)" font-weight="700">Injectable seam</text><text x="15" y="220.0" font-size="10.5" text-anchor="start" class="mono">struct API { var user: (Int) async throws -&gt; User }</text><text x="15" y="233.5" font-size="10.5" text-anchor="start" class="mono">let sut = Service(api: .init(user: { _ in .mock }))</text><rect x="476" y="184" width="460" height="70" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="487" y="203" font-size="12.5" text-anchor="start" fill="var(--typ)" font-weight="700">Verify without a framework</text><text x="487" y="220.0" font-size="10.5" text-anchor="start" class="mono">final class Spy { private(set) var calls = 0 }</text><text x="487" y="233.5" font-size="10.5" text-anchor="start" class="mono">#expect(spy.calls == 1)</text></svg>
