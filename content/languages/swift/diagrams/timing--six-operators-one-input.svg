 stroke-linejoin="round"/><text x="370.4" y="28.0" font-size="8.6" text-anchor="middle" fill="var(--faint)">200</text><path d="M508.8,32.0 L508.8,332.0" fill="none" stroke="var(--faint)" stroke-width="1" opacity=".35" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text x="508.8" y="28.0" font-size="8.6" text-anchor="middle" fill="var(--faint)">400</text><path d="M647.2,32.0 L647.2,332.0" fill="none" stroke="var(--faint)" stroke-width="1" opacity=".35" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text x="647.2" y="28.0" font-size="8.6" text-anchor="middle" fill="var(--faint)">600</text><path d="M785.6,32.0 L785.6,332.0" fill="none" stroke="var(--faint)" stroke-width="1" opacity=".35" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/><text x="785.6" y="28.0" font-size="8.6" text-anchor="middle" fill="var(--faint)">800</text><text x="6" y="41.0" font-size="10.5" text-anchor="start" fill="var(--accent)" font-weight="800">input</text><text x="6" y="55.0" font-size="8.5" text-anchor="start" fill="var(--faint)">8 values, two bursts</text><line x1="232.0" y1="44.0" x2="924.0" y2="44.0" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><circle cx="266.6" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="266.6" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">A</text><circle cx="315.03999999999996" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="315.03999999999996" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">B</text><circle cx="356.56" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="356.56" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">C</text><circle cx="591.84" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="591.84" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">D</text><circle cx="619.52" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="619.52" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">E</text><circle cx="647.2" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="647.2" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">F</text><circle cx="674.88" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="674.88" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">G</text><circle cx="716.4" cy="44.0" r="9" fill="var(--accent)" opacity=".95"/><text x="716.4" y="47.5" font-size="9.5" text-anchor="middle" font-weight="800">H</text><text x="6" y="87.0" font-size="10.5" text-anchor="start" fill="var(--good)" font-weight="800">debounce(200ms)</text><text x="6" y="101.0" font-size="8.5" text-anchor="start" fill="var(--faint)">waits for 200 ms of SILENCE, keeps the LAST of a burst</text><line x1="232.0" y1="90.0" x2="924.0" y2="90.0" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><circle cx="494.96" cy="90.0" r="9" fill="var(--good)" opacity=".95"/><text x="494.96" y="93.5" font-size="9.5" text-anchor="middle" font-weight="800">C</text><circle cx="854.8000000000001" cy="90.0" r="9" fill="var(--good)" opacity=".95"/><text x="854.8000000000001" y="93.5" font-size="9.5" text-anchor="middle" font-weight="800">H</text><text x="6" y="133.0" font-size="10.5" text-anchor="start" fill="var(--modern)" font-weight="800">throttle(latest: false)</text><text x="6" y="147.0" font-size="8.5" text-anchor="start" fill="var(--faint)">at most one per window - keeps the FIRST</text><line x1="232.0" y1="136.0" x2="924.0" y2="136.0" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><circle cx="370.4" cy="136.0" r="9" fill="var(--modern)" opacity=".95"/><text x="370.4" y="139.5" font-size="9.5" text-anchor="middle" font-weight="800">A</text><circle cx="647.2" cy="136.0" r="9" fill="var(--modern)" opacity=".95"/><text x="647.2" y="139.5" font-size="9.5" text-anchor="middle" font-weight="800">D</text><circle cx="785.6" cy="136.0" r="9" fill="var(--modern)" opacity=".95"/><text x="785.6" y="139.5" font-size="9.5" text-anchor="middle" font-weight="800">F</text><text x="6" y="179.0" font-size="10.5" text-anchor="start" fill="var(--modern)" font-weight="800">throttle(latest: true)</text><text x="6" y="193.0" font-size="8.5" text-anchor="start" fill="var(--faint)">at most one per window - keeps the LAST</text><line x1="232.0" y1="182.0" x2="924.0" y2="182.0" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><circle cx="370.4" cy="182.0" r="9" fill="var(--modern)" opacity=".95"/><text x="370.4" y="185.5" font-size="9.5" text-anchor="middle" font-weight="800">C</text><circle cx="647.2" cy="182.0" r="9" fill="var(--modern)" opacity=".95"/><text x="647.2" y="185.5" font-size="9.5" text-anchor="middle" font-weight="800">E</text><circle cx="785.6" cy="182.0" r="9" fill="var(--modern)" opacity=".95"/><text x="785.6" y="185.5" font-size="9.5" text-anchor="middle" font-weight="800">H</text><text x="6" y="225.0" font-size="10.5" text-anchor="start" fill="var(--typ)" font-weight="800">delay(150ms)</text><text x="6" y="239.0" font-size="8.5" text-anchor="start" fill="var(--faint)">shifts EVERYTHING, drops nothing</text><line x1="232.0" y1="228.0" x2="924.0" y2="228.0" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><circle cx="370.4" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="370.4" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">A</text><circle cx="418.84000000000003" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="418.84000000000003" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">B</text><circle cx="460.36" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="460.36" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">C</text><circle cx="695.6400000000001" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="695.6400000000001" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">D</text><circle cx="723.3199999999999" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="723.3199999999999" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">E</text><circle cx="751.0" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="751.0" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">F</text><circle cx="778.6800000000001" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="778.6800000000001" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">G</text><circle cx="820.1999999999999" cy="228.0" r="9" fill="var(--typ)" opacity=".95"/><text x="820.1999999999999" y="231.5" font-size="9.5" text-anchor="middle" font-weight="800">H</text><text x="6" y="271.0" font-size="10.5" text-anchor="start" fill="var(--legacy)" font-weight="800">collect(byTime: 200ms)</text><text x="6" y="285.0" font-size="8.5" text-anchor="start" fill="var(--faint)">buffers each window into an array</text><line x1="232.0" y1="274.0" x2="924.0" y2="274.0" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><rect x="343.4" y="263.0" width="54.0" height="22" rx="11" fill="var(--legacy)" opacity=".30" stroke="var(--legacy)" stroke-width="1.2"/><text x="370.4" y="277.5" font-size="9" text-anchor="middle" fill="var(--legacy)" font-weight="700">[A,B,C]</text><rect x="626.2" y="263.0" width="42.0" height="22" rx="11" fill="var(--legacy)" opacity=".30" stroke="var(--legacy)" stroke-width="1.2"/><text x="647.2" y="277.5" font-size="9" text-anchor="middle" fill="var(--legacy)" font-weight="700">[D,E]</text><rect x="758.6" y="263.0" width="54.0" height="22" rx="11" fill="var(--legacy)" opacity=".30" stroke="var(--legacy)" stroke-width="1.2"/><text x="785.6" y="277.5" font-size="9" text-anchor="middle" fill="var(--legacy)" font-weight="700">[F,G,H]</text><text x="6" y="317.0" font-size="10.5" text-anchor="start" fill="var(--bad)" font-weight="800">timeout(300ms)</text><text x="6" y="331.0" font-size="8.5" text-anchor="start" fill="var(--faint)">no value for 300 ms -&gt; the stream FAILS and is over</text><line x1="232.0" y1="320.0" x2="564.16" y2="320.0" stroke="var(--faint)" stroke-width="1.2" opacity=".6"/><circle cx="266.6" cy="320.0" r="9" fill="var(--bad)" opacity=".95"/><text x="266.6" y="323.5" font-size="9.5" text-anchor="middle" font-weight="800">A</text><circle cx="315.03999999999996" cy="320.0" r="9" fill="var(--bad)" opacity=".95"/><text x="315.03999999999996" y="323.5" font-size="9.5" text-anchor="middle" font-weight="800">B</text><circle cx="356.56" cy="320.0" r="9" fill="var(--bad)" opacity=".95"/><text x="356.56" y="323.5" font-size="9.5" text-anchor="middle" font-weight="800">C</text><path d="M556.2,312.0 L572.2,328.0" fill="none" stroke="var(--bad)" stroke-width="2.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M556.2,328.0 L572.2,312.0" fill="none" stroke="var(--bad)" stroke-width="2.6" opacity="1" stroke-linecap="round" stroke-linejoin="round"/><text x="580.16" y="318.0" font-size="9" text-anchor="start" fill="var(--bad)" font-weight="700">failure at 480 ms - the 340 ms gap blew the budget</text><text x="6" y="354.0" font-size="10.4" text-anchor="start" fill="var(--accent)" font-weight="700">debounce = "tell me when they stop typing".   throttle = "at most N per second".   delay = "same thing, later".   collect = "batch it".   timeout = "give up".</text><text x="6" y="370.0" font-size="9.6" text-anchor="start" fill="var(--faint)">Combine delivers the leading value of a throttle immediately and then one per window; empty collect windows can still emit []. Verify against your Combine version.</text></svg>
