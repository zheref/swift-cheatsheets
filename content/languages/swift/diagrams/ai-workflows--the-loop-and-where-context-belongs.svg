<svg class="dg" viewBox="0 0 940 302" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">THE LOOP THAT ACTUALLY SHIPS SWIFT CODE</text><rect x="3.0" y="34" width="172.4" height="78" rx="9" fill="var(--bg2)" stroke="var(--accent)" stroke-width="1.6"/><text x="14.0" y="53" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="700">1. Ground</text><text x="14.0" y="70.0" font-size="9.4" text-anchor="start" class="mono">point at the real files</text><text x="14.0" y="83.5" font-size="9.4" text-anchor="start" class="mono">paste the real error</text><text x="14.0" y="97.0" font-size="9.4" text-anchor="start" class="mono">@file, not "my app"</text><line x1="177.4" y1="73" x2="189.4" y2="73" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="193.4" y="34" width="172.4" height="78" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="204.4" y="53" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">2. Plan</text><text x="204.4" y="70.0" font-size="9.4" text-anchor="start" class="mono">plan mode / ask for a plan</text><text x="204.4" y="83.5" font-size="9.4" text-anchor="start" class="mono">approve or correct it</text><text x="204.4" y="97.0" font-size="9.4" text-anchor="start" class="mono">before any edit</text><line x1="367.8" y1="73" x2="379.8" y2="73" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="383.8" y="34" width="172.4" height="78" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="394.8" y="53" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">3. Implement</text><text x="394.8" y="70.0" font-size="9.4" text-anchor="start" class="mono">small, reviewable diffs</text><text x="394.8" y="83.5" font-size="9.4" text-anchor="start" class="mono">one concern per turn</text><text x="394.8" y="97.0" font-size="9.4" text-anchor="start" class="mono">tests first when you can</text><line x1="558.2" y1="73" x2="570.2" y2="73" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="574.2" y="34" width="172.4" height="78" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="585.2" y="53" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">4. Verify</text><text x="585.2" y="70.0" font-size="9.4" text-anchor="start" class="mono">xcodebuild test via MCP</text><text x="585.2" y="83.5" font-size="9.4" text-anchor="start" class="mono">agent reads the failure</text><text x="585.2" y="97.0" font-size="9.4" text-anchor="start" class="mono">loop until green</text><line x1="748.6" y1="73" x2="760.6" y2="73" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="764.6" y="34" width="172.4" height="78" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="775.6" y="53" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">5. Review</text><text x="775.6" y="70.0" font-size="9.4" text-anchor="start" class="mono">you read every diff</text><text x="775.6" y="83.5" font-size="9.4" text-anchor="start" class="mono">check API + concurrency</text><text x="775.6" y="97.0" font-size="9.4" text-anchor="start" class="mono">then commit</text><path d="M850.8000000000001,112 L850.8000000000001,132 L89.2,132 L89.2,116" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-neutral)" stroke-linejoin="round"/><text x="470" y="145" font-size="9.5" text-anchor="middle" fill="var(--faint)" font-weight="700">failing test / wrong approach -&gt; back to grounding, not to nagging</text><text x="4" y="176" font-size="11" text-anchor="start" fill="var(--accent)" font-weight="800">WHERE EACH KIND OF CONTEXT BELONGS</text><rect x="3.0" y="190" width="172.4" height="76" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="14.0" y="209" font-size="11" text-anchor="start" fill="var(--modern)" font-weight="700">Always-on rules</text><text x="14.0" y="226.0" font-size="9.2" text-anchor="start" class="mono">CLAUDE.md / AGENTS.md</text><text x="14.0" y="239.5" font-size="9.2" text-anchor="start" class="mono">.cursor/rules/*.mdc</text><text x="14.0" y="253.0" font-size="9.2" text-anchor="start" class="mono">keep it SHORT</text><rect x="193.4" y="190" width="172.4" height="76" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="204.4" y="209" font-size="11" text-anchor="start" fill="var(--typ)" font-weight="700">Reusable know-how</text><text x="204.4" y="226.0" font-size="9.2" text-anchor="start" class="mono">Claude Code skills</text><text x="204.4" y="239.5" font-size="9.2" text-anchor="start" class="mono">(SKILL.md + scripts)</text><text x="204.4" y="253.0" font-size="9.2" text-anchor="start" class="mono">loaded on demand</text><rect x="383.8" y="190" width="172.4" height="76" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="394.8" y="209" font-size="11" text-anchor="start" fill="var(--good)" font-weight="700">Isolated work</text><text x="394.8" y="226.0" font-size="9.2" text-anchor="start" class="mono">subagents / parallel agents</text><text x="394.8" y="239.5" font-size="9.2" text-anchor="start" class="mono">own context window</text><text x="394.8" y="253.0" font-size="9.2" text-anchor="start" class="mono">search, review, migrate</text><rect x="574.2" y="190" width="172.4" height="76" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="585.2" y="209" font-size="11" text-anchor="start" fill="var(--legacy)" font-weight="700">Hard guarantees</text><text x="585.2" y="226.0" font-size="9.2" text-anchor="start" class="mono">hooks + permissions</text><text x="585.2" y="239.5" font-size="9.2" text-anchor="start" class="mono">format on write,</text><text x="585.2" y="253.0" font-size="9.2" text-anchor="start" class="mono">tests before commit</text><rect x="764.6" y="190" width="172.4" height="76" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="775.6" y="209" font-size="11" text-anchor="start" fill="var(--attr)" font-weight="700">External systems</text><text x="775.6" y="226.0" font-size="9.2" text-anchor="start" class="mono">MCP servers</text><text x="775.6" y="239.5" font-size="9.2" text-anchor="start" class="mono">XcodeBuildMCP, Xcode MCP,</text><text x="775.6" y="253.0" font-size="9.2" text-anchor="start" class="mono">Figma, Sentry, docs</text><text x="4" y="288" font-size="10.5" text-anchor="start" fill="var(--faint)">If it must be enforced -&gt; a hook. If it is knowledge -&gt; a skill. If it is a delegation boundary -&gt; a subagent. If it is always true -&gt; one short line in CLAUDE.md.</text></svg>
