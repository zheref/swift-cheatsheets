<svg class="dg" viewBox="0 0 940 444" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">PATTERN PICKER - READ THE TRIGGER, REACH FOR THE PATTERN</text><rect x="3.0" y="30" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="14.0" y="49" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Two pointers</text><text x="14.0" y="66.0" font-size="9.4" text-anchor="start" class="mono">sorted array, pair/triplet, in-place</text><text x="14.0" y="79.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(1)</text><rect x="320.3333333333333" y="30" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="331.3333333333333" y="49" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Sliding window</text><text x="331.3333333333333" y="66.0" font-size="9.4" text-anchor="start" class="mono">contiguous subarray/substring, 'longest'</text><text x="331.3333333333333" y="79.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(k)</text><rect x="637.6666666666666" y="30" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="648.6666666666666" y="49" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Binary search</text><text x="648.6666666666666" y="66.0" font-size="9.4" text-anchor="start" class="mono">sorted, or 'minimise the maximum'</text><text x="648.6666666666666" y="79.5" font-size="9.4" text-anchor="start" class="mono">O(log n)</text><rect x="3.0" y="94" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="14.0" y="113" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">Hash map counting</text><text x="14.0" y="130.0" font-size="9.4" text-anchor="start" class="mono">frequency, anagram, 'seen before'</text><text x="14.0" y="143.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(n)</text><rect x="320.3333333333333" y="94" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="331.3333333333333" y="113" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">Prefix sum</text><text x="331.3333333333333" y="130.0" font-size="9.4" text-anchor="start" class="mono">range sums, 'subarray equals k'</text><text x="331.3333333333333" y="143.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(n)</text><rect x="637.6666666666666" y="94" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="648.6666666666666" y="113" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">Sort then sweep</text><text x="648.6666666666666" y="130.0" font-size="9.4" text-anchor="start" class="mono">intervals, overlaps, scheduling</text><text x="648.6666666666666" y="143.5" font-size="9.4" text-anchor="start" class="mono">O(n log n)</text><rect x="3.0" y="158" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="14.0" y="177" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">Monotonic stack</text><text x="14.0" y="194.0" font-size="9.4" text-anchor="start" class="mono">'next greater', spans, histograms</text><text x="14.0" y="207.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(n)</text><rect x="320.3333333333333" y="158" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="331.3333333333333" y="177" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">Heap / top-K</text><text x="331.3333333333333" y="194.0" font-size="9.4" text-anchor="start" class="mono">'k largest', streaming median, merge k</text><text x="331.3333333333333" y="207.5" font-size="9.4" text-anchor="start" class="mono">O(n log k)</text><rect x="637.6666666666666" y="158" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="648.6666666666666" y="177" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">Fast &amp; slow pointers</text><text x="648.6666666666666" y="194.0" font-size="9.4" text-anchor="start" class="mono">linked list cycle, middle, palindrome</text><text x="648.6666666666666" y="207.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(1)</text><rect x="3.0" y="222" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="14.0" y="241" font-size="11.5" text-anchor="start" fill="var(--attr)" font-weight="700">BFS</text><text x="14.0" y="258.0" font-size="9.4" text-anchor="start" class="mono">shortest path on unweighted graph, levels</text><text x="14.0" y="271.5" font-size="9.4" text-anchor="start" class="mono">O(V+E)</text><rect x="320.3333333333333" y="222" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="331.3333333333333" y="241" font-size="11.5" text-anchor="start" fill="var(--attr)" font-weight="700">DFS / backtracking</text><text x="331.3333333333333" y="258.0" font-size="9.4" text-anchor="start" class="mono">all combinations, permutations, paths</text><text x="331.3333333333333" y="271.5" font-size="9.4" text-anchor="start" class="mono">O(2^n) / O(n!)</text><rect x="637.6666666666666" y="222" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="648.6666666666666" y="241" font-size="11.5" text-anchor="start" fill="var(--attr)" font-weight="700">Topological sort</text><text x="648.6666666666666" y="258.0" font-size="9.4" text-anchor="start" class="mono">dependencies, 'can you finish', ordering</text><text x="648.6666666666666" y="271.5" font-size="9.4" text-anchor="start" class="mono">O(V+E)</text><rect x="3.0" y="286" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="14.0" y="305" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Union-Find</text><text x="14.0" y="322.0" font-size="9.4" text-anchor="start" class="mono">connected components, cycle in undirected</text><text x="14.0" y="335.5" font-size="9.4" text-anchor="start" class="mono">~O(1) amortised</text><rect x="320.3333333333333" y="286" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="331.3333333333333" y="305" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Dynamic programming</text><text x="331.3333333333333" y="322.0" font-size="9.4" text-anchor="start" class="mono">'ways to', 'min cost', overlapping subproblems</text><text x="331.3333333333333" y="335.5" font-size="9.4" text-anchor="start" class="mono">O(n*m)</text><rect x="637.6666666666666" y="286" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="648.6666666666666" y="305" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Greedy</text><text x="648.6666666666666" y="322.0" font-size="9.4" text-anchor="start" class="mono">local choice provably optimal, intervals</text><text x="648.6666666666666" y="335.5" font-size="9.4" text-anchor="start" class="mono">O(n log n)</text><rect x="3.0" y="350" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="14.0" y="369" font-size="11.5" text-anchor="start" fill="var(--bad)" font-weight="700">Trie</text><text x="14.0" y="386.0" font-size="9.4" text-anchor="start" class="mono">prefix search, autocomplete, word dictionary</text><text x="14.0" y="399.5" font-size="9.4" text-anchor="start" class="mono">O(len)</text><rect x="320.3333333333333" y="350" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="331.3333333333333" y="369" font-size="11.5" text-anchor="start" fill="var(--bad)" font-weight="700">Bit manipulation</text><text x="331.3333333333333" y="386.0" font-size="9.4" text-anchor="start" class="mono">subsets, 'appears once', flags</text><text x="331.3333333333333" y="399.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(1)</text><rect x="637.6666666666666" y="350" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="648.6666666666666" y="369" font-size="11.5" text-anchor="start" fill="var(--bad)" font-weight="700">Cyclic sort</text><text x="648.6666666666666" y="386.0" font-size="9.4" text-anchor="start" class="mono">values are 1...n, 'find the missing'</text><text x="648.6666666666666" y="399.5" font-size="9.4" text-anchor="start" class="mono">O(n) / O(1)</text><text x="4" y="434" font-size="11" text-anchor="start" fill="var(--accent)" font-weight="700">Say the pattern name out loud before you write code - it tells the interviewer you recognised the shape of the problem.</text></svg>
