<svg class="dg" viewBox="0 0 940 334" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="18" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">CENTRAL ROLE - THE ONLY SEQUENCE THAT WORKS</text><text x="456" y="18" font-size="10" text-anchor="start" fill="var(--faint)">→ you call        ← the delegate answers</text><rect x="3.0" y="44" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--accent)" stroke-width="1.6"/><text x="14.0" y="63" font-size="12.5" text-anchor="start" fill="var(--accent)" font-weight="700">1. Create manager</text><text x="14.0" y="80.0" font-size="10.5" text-anchor="start" class="mono">→ CBCentralManager(delegate:)</text><text x="14.0" y="93.5" font-size="10.5" text-anchor="start" class="mono">← centralManagerDidUpdateState</text><text x="14.0" y="107.0" font-size="10.5" text-anchor="start" class="mono">gate everything on .poweredOn</text><line x1="220.5" y1="87.0" x2="238.5" y2="87.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="242.5" y="44" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="253.5" y="63" font-size="12.5" text-anchor="start" fill="var(--modern)" font-weight="700">2. Scan</text><text x="253.5" y="80.0" font-size="10.5" text-anchor="start" class="mono">→ scanForPeripherals(svcUUIDs)</text><text x="253.5" y="93.5" font-size="10.5" text-anchor="start" class="mono">← didDiscover + advData + RSSI</text><text x="253.5" y="107.0" font-size="10.5" text-anchor="start" class="mono">stopScan() as soon as found</text><line x1="460.0" y1="87.0" x2="478.0" y2="87.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="482.0" y="44" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="493.0" y="63" font-size="12.5" text-anchor="start" fill="var(--modern)" font-weight="700">3. Connect</text><text x="493.0" y="80.0" font-size="10.5" text-anchor="start" class="mono">→ central.connect(peripheral)</text><text x="493.0" y="93.5" font-size="10.5" text-anchor="start" class="mono">← didConnect / didFailToConnect</text><text x="493.0" y="107.0" font-size="10.5" text-anchor="start" class="mono">STRONGLY retain the peripheral</text><line x1="699.5" y1="87.0" x2="717.5" y2="87.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="721.5" y="44" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="732.5" y="63" font-size="12.5" text-anchor="start" fill="var(--typ)" font-weight="700">4. Discover services</text><text x="732.5" y="80.0" font-size="10.5" text-anchor="start" class="mono">→ p.discoverServices([svcUUID])</text><text x="732.5" y="93.5" font-size="10.5" text-anchor="start" class="mono">← didDiscoverServices</text><text x="732.5" y="107.0" font-size="10.5" text-anchor="start" class="mono">set p.delegate = self first</text><rect x="3.0" y="206" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="14.0" y="225" font-size="12.5" text-anchor="start" fill="var(--typ)" font-weight="700">5. Discover characteristics</text><text x="14.0" y="242.0" font-size="10.5" text-anchor="start" class="mono">→ discoverCharacteristics(_:for:)</text><text x="14.0" y="255.5" font-size="10.5" text-anchor="start" class="mono">← didDiscoverCharacteristicsFor</text><text x="14.0" y="269.0" font-size="10.5" text-anchor="start" class="mono">cache the ones you use</text><line x1="220.5" y1="249.0" x2="238.5" y2="249.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="242.5" y="206" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="253.5" y="225" font-size="12.5" text-anchor="start" fill="var(--good)" font-weight="700">6. Subscribe</text><text x="253.5" y="242.0" font-size="10.5" text-anchor="start" class="mono">→ setNotifyValue(true, for: c)</text><text x="253.5" y="255.5" font-size="10.5" text-anchor="start" class="mono">← didUpdateNotificationStateFor</text><text x="253.5" y="269.0" font-size="10.5" text-anchor="start" class="mono">← didUpdateValueFor (the stream)</text><line x1="460.0" y1="249.0" x2="478.0" y2="249.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="482.0" y="206" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="493.0" y="225" font-size="12.5" text-anchor="start" fill="var(--good)" font-weight="700">7. Read / Write</text><text x="493.0" y="242.0" font-size="10.5" text-anchor="start" class="mono">→ readValue(for: c)</text><text x="493.0" y="255.5" font-size="10.5" text-anchor="start" class="mono">→ writeValue(d, for: c, type:)</text><text x="493.0" y="269.0" font-size="10.5" text-anchor="start" class="mono">← didWriteValueFor (.withResponse)</text><line x1="699.5" y1="249.0" x2="717.5" y2="249.0" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="721.5" y="206" width="215.5" height="86" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="732.5" y="225" font-size="12.5" text-anchor="start" fill="var(--legacy)" font-weight="700">8. Tear down</text><text x="732.5" y="242.0" font-size="10.5" text-anchor="start" class="mono">→ cancelPeripheralConnection(p)</text><text x="732.5" y="255.5" font-size="10.5" text-anchor="start" class="mono">← didDisconnectPeripheral(error)</text><text x="732.5" y="269.0" font-size="10.5" text-anchor="start" class="mono">reconnect with backoff</text><path d="M829.25,130 L829.25,170 L110.75,170 L110.75,202" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-neutral)" stroke-linejoin="round"/><text x="470.0" y="165" font-size="9.5" text-anchor="middle" fill="var(--faint)" font-weight="700">connected - now you own the peripheral's delegate</text><rect x="4" y="306" width="235.6" height="18" rx="9.0" fill="var(--faint)" opacity=".16"/><text x="121.8" y="318.5" font-size="10" text-anchor="middle" fill="var(--faint)" font-weight="700">every step is async + delegate based</text><rect x="245.6" y="306" width="223.4" height="18" rx="9.0" fill="var(--bad)" opacity=".16"/><text x="357.29999999999995" y="318.5" font-size="10" text-anchor="middle" fill="var(--bad)" font-weight="700">errors arrive in the SAME callback</text><rect x="475.0" y="306" width="235.6" height="18" rx="9.0" fill="var(--legacy)" opacity=".16"/><text x="592.8" y="318.5" font-size="10" text-anchor="middle" fill="var(--legacy)" font-weight="700">iOS caches the GATT table per device</text><rect x="716.6" y="306" width="199.0" height="18" rx="9.0" fill="var(--good)" opacity=".16"/><text x="816.1" y="318.5" font-size="10" text-anchor="middle" fill="var(--good)" font-weight="700">one CBCentralManager is enough</text></svg>
