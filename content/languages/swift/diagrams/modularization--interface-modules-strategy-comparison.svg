<svg class="dg" viewBox="0 0 940 390" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">INTERFACE MODULES - HOW TO BREAK A DEPENDENCY (AND A BUILD BOTTLENECK)</text><rect x="6" y="60" width="214" height="76" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="17" y="79" font-size="12.5" text-anchor="start" fill="var(--modern)" font-weight="700">FeatureCheckout</text><text x="17" y="96.0" font-size="10.5" text-anchor="start" class="mono">imports CatalogInterface</text><text x="17" y="109.5" font-size="10.5" text-anchor="start" class="mono">compiles WITHOUT CatalogImpl</text><rect x="300" y="60" width="220" height="76" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="311" y="79" font-size="12.5" text-anchor="start" fill="var(--good)" font-weight="700">CatalogInterface</text><text x="311" y="96.0" font-size="10.5" text-anchor="start" class="mono">protocol CatalogService { }</text><text x="311" y="109.5" font-size="10.5" text-anchor="start" class="mono">struct Product { }</text><text x="311" y="123.0" font-size="10.5" text-anchor="start" class="mono">tiny + rarely changes</text><rect x="600" y="16" width="220" height="76" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="611" y="35" font-size="12.5" text-anchor="start" fill="var(--typ)" font-weight="700">CatalogImpl</text><text x="611" y="52.0" font-size="10.5" text-anchor="start" class="mono">final class LiveCatalog</text><text x="611" y="65.5" font-size="10.5" text-anchor="start" class="mono">the heavy module</text><rect x="600" y="116" width="220" height="76" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="611" y="135" font-size="12.5" text-anchor="start" fill="var(--legacy)" font-weight="700">CatalogMock</text><text x="611" y="152.0" font-size="10.5" text-anchor="start" class="mono">struct StubCatalog</text><text x="611" y="165.5" font-size="10.5" text-anchor="start" class="mono">used by tests + previews</text><rect x="300" y="210" width="220" height="66" rx="9" fill="var(--bg2)" stroke="var(--accent)" stroke-width="1.6"/><text x="311" y="229" font-size="12.5" text-anchor="start" fill="var(--accent)" font-weight="700">App</text><text x="311" y="246.0" font-size="10.5" text-anchor="start" class="mono">the only module that sees</text><text x="311" y="259.5" font-size="10.5" text-anchor="start" class="mono">BOTH sides: it wires them</text><line x1="224" y1="98" x2="294" y2="98" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><text x="259.0" y="92.0" font-size="9.5" text-anchor="middle" fill="var(--faint)" font-weight="700">imports</text><path d="M596,54 L560,54 L560,92 L526,92" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-neutral)" stroke-linejoin="round"/><path d="M596,154 L560,154 L560,104 L526,104" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-neutral)" stroke-linejoin="round"/><text x="534" y="46" font-size="9.5" text-anchor="start" fill="var(--faint)" font-weight="700">conforms to</text><path d="M410,204 L410,142" fill="none" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ah-accent)" stroke-linejoin="round"/><path d="M524,244 L926,244 L926,98" fill="none" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#ah-accent)" stroke-linejoin="round"/><text x="716" y="238" font-size="9.8" text-anchor="start" fill="var(--accent)" font-weight="700">injects the live implementation at startup</text><text x="6" y="158" font-size="10.5" text-anchor="start" fill="var(--faint)">Result: touching CatalogImpl no longer recompiles FeatureCheckout.</text><text x="6" y="176" font-size="10.5" text-anchor="start" fill="var(--faint)">Tests and SwiftUI previews link the mock instead - fast and hermetic.</text><rect x="3.0" y="296" width="218.5" height="82" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="14.0" y="315" font-size="11.5" text-anchor="start" fill="var(--bad)" font-weight="700">Single target</text><text x="14.0" y="332.0" font-size="9.6" text-anchor="start" class="mono">fastest to start</text><text x="14.0" y="345.5" font-size="9.6" text-anchor="start" class="mono">slowest to build at scale</text><text x="14.0" y="359.0" font-size="9.6" text-anchor="start" class="mono">no boundaries enforced</text><rect x="241.5" y="296" width="218.5" height="82" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="252.5" y="315" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">Layer-based</text><text x="252.5" y="332.0" font-size="9.6" text-anchor="start" class="mono">UI / Domain / Data</text><text x="252.5" y="345.5" font-size="9.6" text-anchor="start" class="mono">clear rules</text><text x="252.5" y="359.0" font-size="9.6" text-anchor="start" class="mono">every feature still touches all 3</text><rect x="480.0" y="296" width="218.5" height="82" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="491.0" y="315" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">Feature-based</text><text x="491.0" y="332.0" font-size="9.6" text-anchor="start" class="mono">one module per feature</text><text x="491.0" y="345.5" font-size="9.6" text-anchor="start" class="mono">teams work in parallel</text><text x="491.0" y="359.0" font-size="9.6" text-anchor="start" class="mono">watch for shared-code sprawl</text><rect x="718.5" y="296" width="218.5" height="82" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="729.5" y="315" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Feature + interfaces</text><text x="729.5" y="332.0" font-size="9.6" text-anchor="start" class="mono">impl hidden behind protocols</text><text x="729.5" y="345.5" font-size="9.6" text-anchor="start" class="mono">best build times + testability</text><text x="729.5" y="359.0" font-size="9.6" text-anchor="start" class="mono">most setup cost</text><text x="4" y="290" font-size="11" text-anchor="start" fill="var(--accent)" font-weight="800">PICKING A STRATEGY</text></svg>
