y="167.0" font-size="10.5" text-anchor="start" class="mono">→ readValue(for:)</text><path d="M400,142 L426,142 L426,142 L446,142" fill="none" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)" stroke-linejoin="round"/><rect x="452" y="196" width="250" height="76" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="463" y="215" font-size="12.5" text-anchor="start" fill="var(--legacy)" font-weight="700">CBCharacteristic</text><text x="463" y="232.0" font-size="10.5" text-anchor="start" class="mono">0x2A39 Control Point</text><text x="463" y="245.5" font-size="10.5" text-anchor="start" class="mono">.write / .withoutResponse</text><text x="463" y="259.0" font-size="10.5" text-anchor="start" class="mono">→ writeValue(_:for:type:)</text><path d="M400,142 L426,142 L426,234 L446,234" fill="none" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)" stroke-linejoin="round"/><line x1="164" y1="142" x2="208" y2="142" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><rect x="746" y="12" width="190" height="76" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="757" y="31" font-size="12.5" text-anchor="start" fill="var(--attr)" font-weight="700">CBDescriptor</text><text x="757" y="48.0" font-size="10.5" text-anchor="start" class="mono">0x2902 CCCD</text><text x="757" y="61.5" font-size="10.5" text-anchor="start" class="mono">toggled for you by</text><text x="757" y="75.0" font-size="10.5" text-anchor="start" class="mono">setNotifyValue(true:for:)</text><line x1="706" y1="50" x2="740" y2="50" stroke="var(--faint)" stroke-width="1.6" marker-end="url(#ah-neutral)"/><text x="4" y="300" font-size="10.5" text-anchor="start" fill="var(--faint)">characteristic.properties  (an OptionSet - always check it before you act)</text><rect x="4" y="310" width="46.5" height="18" rx="9.0" fill="var(--good)" opacity=".16"/><text x="27.25" y="322.5" font-size="10" text-anchor="middle" fill="v