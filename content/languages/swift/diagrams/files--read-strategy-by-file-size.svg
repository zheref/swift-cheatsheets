<svg class="dg" viewBox="0 0 940 280" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">PICK THE STRATEGY FROM THE SIZE</text><text x="112.25" y="36" font-size="10.5" text-anchor="middle" fill="var(--good)" font-weight="800">up to ~1 MB</text><rect x="3.0" y="44" width="218.5" height="124" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="14.0" y="63" font-size="12" text-anchor="start" fill="var(--good)" font-weight="700">Load it whole</text><text x="14.0" y="80.0" font-size="9.4" text-anchor="start" class="mono">String(contentsOf: url,</text><text x="14.0" y="93.5" font-size="9.4" text-anchor="start" class="mono">          encoding: .utf8)</text><text x="14.0" y="107.0" font-size="9.4" text-anchor="start" class="mono">Data(contentsOf: url)</text><text x="14.0" y="120.5" font-size="9.4" text-anchor="start" class="mono"></text><text x="14.0" y="134.0" font-size="9.4" text-anchor="start" class="mono">simplest, one syscall,</text><text x="14.0" y="147.5" font-size="9.4" text-anchor="start" class="mono">peak memory = file size</text><text x="350.75" y="36" font-size="10.5" text-anchor="middle" fill="var(--modern)" font-weight="800">~1 - 100 MB</text><rect x="241.5" y="44" width="218.5" height="124" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="252.5" y="63" font-size="12" text-anchor="start" fill="var(--modern)" font-weight="700">Memory-map it</text><text x="252.5" y="80.0" font-size="9.4" text-anchor="start" class="mono">Data(contentsOf: url,</text><text x="252.5" y="93.5" font-size="9.4" text-anchor="start" class="mono">     options: .mappedIfSafe)</text><text x="252.5" y="107.0" font-size="9.4" text-anchor="start" class="mono"></text><text x="252.5" y="120.5" font-size="9.4" text-anchor="start" class="mono">the kernel pages it in on</text><text x="252.5" y="134.0" font-size="9.4" text-anchor="start" class="mono">demand; random access is</text><text x="252.5" y="147.5" font-size="9.4" text-anchor="start" class="mono">free, no copy</text><text x="589.25" y="36" font-size="10.5" text-anchor="middle" fill="var(--legacy)" font-weight="800">100 MB - GBs</text><rect x="480.0" y="44" width="218.5" height="124" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="491.0" y="63" font-size="12" text-anchor="start" fill="var(--legacy)" font-weight="700">Stream it</text><text x="491.0" y="80.0" font-size="9.4" text-anchor="start" class="mono">for try await line in url.lines</text><text x="491.0" y="93.5" font-size="9.4" text-anchor="start" class="mono">handle.read(upToCount: 1 &lt;&lt; 16)</text><text x="491.0" y="107.0" font-size="9.4" text-anchor="start" class="mono"></text><text x="491.0" y="120.5" font-size="9.4" text-anchor="start" class="mono">one pass, constant memory,</text><text x="491.0" y="134.0" font-size="9.4" text-anchor="start" class="mono">cannot random-access</text><text x="827.75" y="36" font-size="10.5" text-anchor="middle" fill="var(--bad)" font-weight="800">bigger than RAM</text><rect x="718.5" y="44" width="218.5" height="124" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="729.5" y="63" font-size="12" text-anchor="start" fill="var(--bad)" font-weight="700">Chunk, sort, merge</text><text x="729.5" y="80.0" font-size="9.4" text-anchor="start" class="mono">split into sorted runs -&gt;</text><text x="729.5" y="93.5" font-size="9.4" text-anchor="start" class="mono">k-way merge with a heap</text><text x="729.5" y="107.0" font-size="9.4" text-anchor="start" class="mono"></text><text x="729.5" y="120.5" font-size="9.4" text-anchor="start" class="mono">external sort: O(n log n) time,</text><text x="729.5" y="134.0" font-size="9.4" text-anchor="start" class="mono">O(k * chunk) memory</text><text x="4" y="190" font-size="10.5" text-anchor="start" fill="var(--faint)" font-weight="800">PEAK MEMORY, RELATIVE</text><rect x="3.0" y="198" width="218.5" height="20" rx="5" fill="var(--good)" opacity=".35" stroke="var(--good)" stroke-width="1.2"/><text x="3.0" y="234" font-size="9.6" text-anchor="start" fill="var(--good)" font-weight="700">= the whole file</text><rect x="241.5" y="198" width="65.5" height="20" rx="5" fill="var(--modern)" opacity=".35" stroke="var(--modern)" stroke-width="1.2"/><text x="241.5" y="234" font-size="9.6" text-anchor="start" fill="var(--modern)" font-weight="700">= pages touched</text><rect x="480.0" y="198" width="26.0" height="20" rx="5" fill="var(--legacy)" opacity=".35" stroke="var(--legacy)" stroke-width="1.2"/><text x="480.0" y="234" font-size="9.6" text-anchor="start" fill="var(--legacy)" font-weight="700">= one chunk</text><rect x="718.5" y="198" width="43.7" height="20" rx="5" fill="var(--bad)" opacity=".35" stroke="var(--bad)" stroke-width="1.2"/><text x="718.5" y="234" font-size="9.6" text-anchor="start" fill="var(--bad)" font-weight="700">= k chunks</text><rect x="4" y="250" width="266.1" height="18" rx="9.0" fill="var(--bad)" opacity=".16"/><text x="137.05" y="262.5" font-size="10" text-anchor="middle" fill="var(--bad)" font-weight="700">file I/O blocks - never on the main actor</text><rect x="276.1" y="250" width="241.7" height="18" rx="9.0" fill="var(--legacy)" opacity=".16"/><text x="396.95000000000005" y="262.5" font-size="10" text-anchor="middle" fill="var(--legacy)" font-weight="700">mmap still page-faults on a slow disk</text><rect x="523.8" y="250" width="241.7" height="18" rx="9.0" fill="var(--good)" opacity=".16"/><text x="644.65" y="262.5" font-size="10" text-anchor="middle" fill="var(--good)" font-weight="700">one pass? stream. random access? map.</text><rect x="771.5" y="250" width="168.5" height="18" rx="9.0" fill="var(--modern)" opacity=".16"/><text x="855.75" y="262.5" font-size="10" text-anchor="middle" fill="var(--modern)" font-weight="700">test on a real-sized file</text></svg>
