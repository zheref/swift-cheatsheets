<svg class="dg" viewBox="0 0 940 444" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/></marker><marker id="ah-modern" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--modern)"/></marker><marker id="ah-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--good)"/></marker><marker id="ah-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker><marker id="ah-legacy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--legacy)"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker><marker id="ah-type" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--typ)"/></marker><marker id="ah-attr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--attr)"/></marker><marker id="ah-str" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--str)"/></marker></defs><text x="4" y="16" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="800">PICK THE CONTAINER</text><rect x="3.0" y="30" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="14.0" y="49" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Array</text><text x="14.0" y="66.0" font-size="9.3" text-anchor="start" class="mono">ordered, indexed, duplicates ok</text><text x="14.0" y="79.5" font-size="9.3" text-anchor="start" class="mono">index O(1) · append O(1)* · contains O(n)</text><rect x="320.3333333333333" y="30" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="331.3333333333333" y="49" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Set</text><text x="331.3333333333333" y="66.0" font-size="9.3" text-anchor="start" class="mono">membership + dedupe, unordered</text><text x="331.3333333333333" y="79.5" font-size="9.3" text-anchor="start" class="mono">insert / contains O(1) avg</text><rect x="637.6666666666666" y="30" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--good)" stroke-width="1.6"/><text x="648.6666666666666" y="49" font-size="11.5" text-anchor="start" fill="var(--good)" font-weight="700">Dictionary</text><text x="648.6666666666666" y="66.0" font-size="9.3" text-anchor="start" class="mono">key to value, unordered</text><text x="648.6666666666666" y="79.5" font-size="9.3" text-anchor="start" class="mono">subscript O(1) avg</text><rect x="3.0" y="94" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="14.0" y="113" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">ContiguousArray</text><text x="14.0" y="130.0" font-size="9.3" text-anchor="start" class="mono">Array without ObjC bridging</text><text x="14.0" y="143.5" font-size="9.3" text-anchor="start" class="mono">same, slightly faster for classes</text><rect x="320.3333333333333" y="94" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="331.3333333333333" y="113" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">ArraySlice</text><text x="331.3333333333333" y="130.0" font-size="9.3" text-anchor="start" class="mono">a window onto an Array, no copy</text><text x="331.3333333333333" y="143.5" font-size="9.3" text-anchor="start" class="mono">shares storage · indices are the PARENT's</text><rect x="637.6666666666666" y="94" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--modern)" stroke-width="1.6"/><text x="648.6666666666666" y="113" font-size="11.5" text-anchor="start" fill="var(--modern)" font-weight="700">Range / ClosedRange</text><text x="648.6666666666666" y="130.0" font-size="9.3" text-anchor="start" class="mono">0..&lt;n, a..​.b — a lazy collection</text><text x="648.6666666666666" y="143.5" font-size="9.3" text-anchor="start" class="mono">O(1) count · contains O(1)</text><rect x="3.0" y="158" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="14.0" y="177" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">String / Substring</text><text x="14.0" y="194.0" font-size="9.3" text-anchor="start" class="mono">grapheme clusters, not bytes</text><text x="14.0" y="207.5" font-size="9.3" text-anchor="start" class="mono">count O(n) · no Int subscript</text><rect x="320.3333333333333" y="158" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="331.3333333333333" y="177" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">KeyValuePairs</text><text x="331.3333333333333" y="194.0" font-size="9.3" text-anchor="start" class="mono">ordered literal pairs, duplicates ok</text><text x="331.3333333333333" y="207.5" font-size="9.3" text-anchor="start" class="mono">lookup O(n) — for small fixed config</text><rect x="637.6666666666666" y="158" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--legacy)" stroke-width="1.6"/><text x="648.6666666666666" y="177" font-size="11.5" text-anchor="start" fill="var(--legacy)" font-weight="700">IndexSet</text><text x="648.6666666666666" y="194.0" font-size="9.3" text-anchor="start" class="mono">a set of integers, run-length packed</text><text x="648.6666666666666" y="207.5" font-size="9.3" text-anchor="start" class="mono">great for row/section index math</text><rect x="3.0" y="222" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="14.0" y="241" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">Deque</text><text x="14.0" y="258.0" font-size="9.3" text-anchor="start" class="mono">queue: push/pop at BOTH ends</text><text x="14.0" y="271.5" font-size="9.3" text-anchor="start" class="mono">O(1) both ends (Array.removeFirst is O(n))</text><rect x="320.3333333333333" y="222" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="331.3333333333333" y="241" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">OrderedSet</text><text x="331.3333333333333" y="258.0" font-size="9.3" text-anchor="start" class="mono">Set that keeps insertion order</text><text x="331.3333333333333" y="271.5" font-size="9.3" text-anchor="start" class="mono">O(1) lookup + a random-access view</text><rect x="637.6666666666666" y="222" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="648.6666666666666" y="241" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">OrderedDictionary</text><text x="648.6666666666666" y="258.0" font-size="9.3" text-anchor="start" class="mono">Dictionary with a stable order</text><text x="648.6666666666666" y="271.5" font-size="9.3" text-anchor="start" class="mono">O(1) lookup, ordered iteration</text><rect x="3.0" y="286" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="14.0" y="305" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">Heap</text><text x="14.0" y="322.0" font-size="9.3" text-anchor="start" class="mono">min/max priority queue</text><text x="14.0" y="335.5" font-size="9.3" text-anchor="start" class="mono">insert / popMin O(log n) · min O(1)</text><rect x="320.3333333333333" y="286" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="331.3333333333333" y="305" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">TreeDictionary / TreeSet</text><text x="331.3333333333333" y="322.0" font-size="9.3" text-anchor="start" class="mono">persistent, cheap copies + diffing</text><text x="331.3333333333333" y="335.5" font-size="9.3" text-anchor="start" class="mono">O(log n), structural sharing</text><rect x="637.6666666666666" y="286" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--typ)" stroke-width="1.6"/><text x="648.6666666666666" y="305" font-size="11.5" text-anchor="start" fill="var(--typ)" font-weight="700">BitSet</text><text x="648.6666666666666" y="322.0" font-size="9.3" text-anchor="start" class="mono">dense set of small integers</text><text x="648.6666666666666" y="335.5" font-size="9.3" text-anchor="start" class="mono">1 bit per element, fast set algebra</text><rect x="3.0" y="350" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--attr)" stroke-width="1.6"/><text x="14.0" y="369" font-size="11.5" text-anchor="start" fill="var(--attr)" font-weight="700">IdentifiedArray</text><text x="14.0" y="386.0" font-size="9.3" text-anchor="start" class="mono">ordered AND keyed by Identifiable id</text><text x="14.0" y="399.5" font-size="9.3" text-anchor="start" class="mono">TCA — O(1) by id, O(1) by index</text><rect x="320.3333333333333" y="350" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--accent)" stroke-width="1.6"/><text x="331.3333333333333" y="369" font-size="11.5" text-anchor="start" fill="var(--accent)" font-weight="700">.lazy view</text><text x="331.3333333333333" y="386.0" font-size="9.3" text-anchor="start" class="mono">chain map/filter with no intermediates</text><text x="331.3333333333333" y="399.5" font-size="9.3" text-anchor="start" class="mono">work happens on demand, per element</text><rect x="637.6666666666666" y="350" width="299.3333333333333" height="56" rx="9" fill="var(--bg2)" stroke="var(--bad)" stroke-width="1.6"/><text x="648.6666666666666" y="369" font-size="11.5" text-anchor="start" fill="var(--bad)" font-weight="700">AnyCollection / AnySequence</text><text x="648.6666666666666" y="386.0" font-size="9.3" text-anchor="start" class="mono">erase the concrete type at an API edge</text><text x="648.6666666666666" y="399.5" font-size="9.3" text-anchor="start" class="mono">adds a box + dynamic dispatch</text><text x="4" y="434" font-size="10.5" text-anchor="start" fill="var(--accent)" font-weight="700">Deque · OrderedSet · OrderedDictionary · Heap · BitSet · TreeDictionary all come from apple/swift-collections — one SPM dependency, no bridging cost.</text></svg>
