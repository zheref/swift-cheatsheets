id: files
concept: io.files-and-text
scope: platform
title: Files, Text & Atomic I/O
group: iOS Platform
subtitle: Where to put data, how to write it so a crash can't corrupt it, and how to read a file bigger than memory.
applies:
  platforms:
    - ios
    - ipados
    - macos
    - tvos
    - watchos
    - visionos
  requires:
    - Foundation
sources:
  - title: FileManager — Apple Developer Documentation
    url: https://developer.apple.com/documentation/foundation/filemanager
cards:
  - id: the-atomic-write
    kind: diagram
    title: The atomic write
    note: Temp file, flush, rename. Every safe writer on every OS is this shape.
    svg: files--the-atomic-write.svg
  - id: read-strategy-by-file-size
    kind: diagram
    title: Read strategy by file size
    note: The API you choose is a memory decision. Pick it from the size, not from habit.
    svg: files--read-strategy-by-file-size.svg
  - id: where-things-belong
    kind: table
    title: Where things belong
    note: Getting this wrong gets apps rejected and data deleted.
    headers:
      - Directory
      - Modern accessor
      - Backed up?
      - Use for
    rows:
      - - Documents
        - "`URL.documentsDirectory`"
        - yes
        - user-created content they'd miss — and can see in Files
      - - Application Support
        - "`URL.applicationSupportDirectory`"
        - yes
        - app-generated data the user never browses (databases, caches you must keep)
      - - Caches
        - "`URL.cachesDirectory`"
        - no
        - re-downloadable data. **The system deletes this under pressure**
      - - tmp
        - "`URL.temporaryDirectory`"
        - no
        - scratch files for the current operation; purged aggressively
      - - App Group container
        - "`FileManager.default.containerURL(forSecurityApplicationGroupIdentifier:)`"
        - yes
        - sharing with widgets and extensions — needs file coordination
      - - Bundle (read-only)
        - "`Bundle.main.url(forResource:withExtension:)`"
        - n/a
        - shipped resources. Never writable
  - id: urls-not-paths
    kind: code
    title: URLs, not paths
    note: "`URL` is the modern currency; string paths lose information."
    code: |-
      // iOS 16+ / macOS 13+ — the terse accessors
      let docs = URL.documentsDirectory
      let file = docs.appending(path: "notes/today.txt")           // percent-encodes correctly

      // Older, and still the only way to ask for creation as a side effect
      let support = try FileManager.default.url(for: .applicationSupportDirectory,
                                                in: .userDomainMask,
                                                appropriateFor: nil,
                                                create: true)      // creates it if missing

      // Make the parent directory yourself when you build paths by hand
      try FileManager.default.createDirectory(at: file.deletingLastPathComponent(),
                                              withIntermediateDirectories: true)

      file.lastPathComponent      // "today.txt"
      file.deletingPathExtension().lastPathComponent   // "today"
      file.pathExtension          // "txt"
      file.path(percentEncoded: false)                 // only when a C API demands a path

      // Never build a path with string interpolation: "\(docs)/notes/\(name).txt"
      // breaks on spaces, unicode, and names containing "/".
  - id: reading-a-small-text-file
    kind: compare
    title: Reading a small text file
    note: ""
    columns:
      - label: Do
        tone: good
        code: |-
          // Encoding is required — the inferring overload is deprecated.
          let text = try String(contentsOf: url, encoding: .utf8)

          // Bytes, when it isn't text
          let data = try Data(contentsOf: url)

          // A malformed-UTF8-tolerant decode
          guard let text = String(data: data, encoding: .utf8) else {
            throw FileError.notUTF8(url)
          }

          // Reading is blocking: keep it off the main actor
          nonisolated func load(_ url: URL) throws -> String {
            try String(contentsOf: url, encoding: .utf8)
          }
      - label: Don't
        tone: bad
        code: |-
          // TOCTOU race: the answer is already stale
          if FileManager.default.fileExists(atPath: url.path) {
            let text = try String(contentsOf: url, encoding: .utf8)
          }
          // Just try, and handle the error:
          do { text = try String(contentsOf: url, encoding: .utf8) }
          catch CocoaError.fileNoSuchFile { text = "" }

          // Deprecated / lossy
          String(contentsOfFile: path)          // no encoding, deprecated
          try! String(contentsOf: url)          // crashes on a missing file

          // Blocking the main actor on a 50 MB file
          @MainActor func load() { text = try! String(contentsOf: url) }
  - id: writing-atomically-the-one-liner-and-what-it-hides
    kind: code
    title: Writing atomically — the one-liner and what it hides
    note: ""
    code: |-
      // Data: .atomic writes to a temp file in the same directory, then renames.
      try data.write(to: url, options: [.atomic])

      // String: same guarantee, different spelling
      try text.write(to: url, atomically: true, encoding: .utf8)

      // Fail instead of clobbering an existing file
      try data.write(to: url, options: [.withoutOverwriting])   // throws if it exists

      // Codable round trip, atomically
      let encoder = JSONEncoder()
      encoder.outputFormatting = [.sortedKeys]        // stable bytes -> smaller diffs, cheap dedupe
      try encoder.encode(model).write(to: url, options: [.atomic])

      // What .atomic guarantees:  a reader never sees a half-written file.
      // What it does NOT guarantee: that the bytes survive a power cut. That needs fsync.

      // On iOS, an atomic write can FAIL while the device is locked if the file has a
      // data-protection class, because the temp file inherits it. For background writes:
      try data.write(to: url, options: [.atomic, .completeFileProtectionUntilFirstUserAuthentication])
  - id: real-durability-fsync-and-f-fullfsync
    kind: code
    title: "Real durability: fsync and F_FULLFSYNC"
    note: When "the user pulled the battery" has to be survivable.
    code: |-
      /// Writes atomically AND flushes to the physical medium.
      func writeDurably(_ data: Data, to url: URL) throws {
        let directory = url.deletingLastPathComponent()
        let temp = directory.appending(path: ".\(UUID().uuidString).tmp")

        // 1. write the new bytes to a sibling temp file
        try data.write(to: temp)

        // 2. flush them past the page cache. On Apple platforms plain fsync only
        //    reaches the drive's write cache; F_FULLFSYNC goes all the way down.
        let handle = try FileHandle(forWritingTo: temp)
        guard fcntl(handle.fileDescriptor, F_FULLFSYNC) != -1 else {
          try? FileManager.default.removeItem(at: temp)
          throw POSIXError(.EIO)
        }
        try handle.close()

        // 3. atomic swap. replaceItemAt handles the same-volume + backup dance,
        //    and preserves the destination's metadata.
        _ = try FileManager.default.replaceItemAt(url, withItemAt: temp)
      }

      // Cost: F_FULLFSYNC is SLOW (tens of ms). Use it for a ledger or a journal,
      // not for every keystroke of an autosave.
  - id: appending-log-files-and-journals
    kind: code
    title: "Appending: log files and journals"
    note: Append-only is the cheapest durable structure there is.
    code: |-
      /// One writer, serialized by an actor. FileHandle is not Sendable.
      actor AppendLog {
        private let handle: FileHandle

        init(url: URL) throws {
          if !FileManager.default.fileExists(atPath: url.path(percentEncoded: false)) {
            FileManager.default.createFile(atPath: url.path(percentEncoded: false), contents: nil)
          }
          handle = try FileHandle(forWritingTo: url)
          try handle.seekToEnd()
        }

        func append(_ line: String) throws {
          try handle.write(contentsOf: Data((line + "\n").utf8))
        }

        /// Call on a cadence, not per line — each one is a syscall.
        func flush() throws { try handle.synchronize() }

        deinit { try? handle.close() }
      }

      // Compaction: when the log outgrows its budget, fold it into a snapshot
      // and atomically replace both. Never edit a log in place.
      func compact() async throws {
        let snapshot = try await replay()                     // fold the log
        try encode(snapshot).write(to: snapshotURL, options: .atomic)
        try Data().write(to: logURL, options: .atomic)        // truncate atomically
      }
  - id: streaming-a-large-text-file
    kind: code
    title: Streaming a large text file
    note: Constant memory, one pass. The default for anything over ~100 MB.
    code: |-
      // Async line-by-line, straight off the URL. Handles buffering for you.
      for try await line in url.lines {
        process(line)                       // memory stays O(longest line)
      }

      // JSON Lines: one independent object per line — the format to reach for
      // when a single JSON array would not fit in memory.
      let decoder = JSONDecoder()
      var total = 0
      for try await line in url.lines where !line.isEmpty {
        let event = try decoder.decode(Event.self, from: Data(line.utf8))
        total += event.amount
      }

      // Raw byte chunks, when the data isn't line-delimited
      let handle = try FileHandle(forReadingFrom: url)
      defer { try? handle.close() }
      while let chunk = try handle.read(upToCount: 1 << 16), !chunk.isEmpty {   // 64 KB
        try consume(chunk)
      }

      // Memory-mapped, for random access without loading everything
      let mapped = try Data(contentsOf: url, options: [.mappedIfSafe])
      let slice = mapped[offset ..< (offset + length)]     // pages fault in on demand
      // .mappedIfSafe declines to map network volumes; .alwaysMapped insists (and can trap).
  - id: streaming-a-large-write
    kind: code
    title: Streaming a large write
    note: Buffer in memory, syscall in batches.
    code: |-
      /// Writes an arbitrarily long sequence without ever holding it all.
      func export(_ rows: some Sequence<Row>, to url: URL) throws {
        let temp = url.deletingLastPathComponent().appending(path: ".export.tmp")
        FileManager.default.createFile(atPath: temp.path(percentEncoded: false), contents: nil)
        let handle = try FileHandle(forWritingTo: temp)
        defer { try? handle.close() }

        var buffer = Data()
        buffer.reserveCapacity(1 << 18)               // 256 KB

        for row in rows {
          buffer.append(contentsOf: row.csvLine.utf8)
          if buffer.count >= 1 << 18 {                // amortise the syscall
            try handle.write(contentsOf: buffer)
            buffer.removeAll(keepingCapacity: true)   // keep the allocation
          }
        }
        if !buffer.isEmpty { try handle.write(contentsOf: buffer) }
        try handle.close()

        _ = try FileManager.default.replaceItemAt(url, withItemAt: temp)   // publish atomically
      }

      // Rule: one write(contentsOf:) per 64-256 KB. Per-row writes are 1000x slower.
  - id: algorithm-external-merge-sort
    kind: code
    title: Algorithm — external merge sort
    note: "Sort a file larger than RAM: split into sorted runs, then k-way merge."
    code: |-
      import Collections

      /// Phase 1: read `chunkSize` lines at a time, sort in memory, spill to a run file.
      func makeRuns(from url: URL, chunkSize: Int, into dir: URL) async throws -> [URL] {
        var runs: [URL] = []
        var buffer: [String] = []
        buffer.reserveCapacity(chunkSize)

        func spill() throws {
          guard !buffer.isEmpty else { return }
          let run = dir.appending(path: "run-\(runs.count).txt")
          try buffer.sorted().joined(separator: "\n").write(to: run, atomically: true, encoding: .utf8)
          runs.append(run)
          buffer.removeAll(keepingCapacity: true)
        }

        for try await line in url.lines {
          buffer.append(line)
          if buffer.count == chunkSize { try spill() }
        }
        try spill()
        return runs
      }

      /// Phase 2: merge every run with a k-element heap. O(n log k), memory O(k).
      func merge(_ runs: [URL], into out: URL) async throws {
        struct Head: Comparable {
          let line: String
          let run: Int
          static func < (a: Self, b: Self) -> Bool { a.line < b.line }
        }

        var iterators = try runs.map { $0.lines.makeAsyncIterator() }
        var heap = Heap<Head>()
        for i in iterators.indices {
          if let first = try await iterators[i].next() { heap.insert(Head(line: first, run: i)) }
        }

        let temp = out.deletingLastPathComponent().appending(path: ".merge.tmp")
        FileManager.default.createFile(atPath: temp.path(percentEncoded: false), contents: nil)
        let handle = try FileHandle(forWritingTo: temp)
        var buffer = Data()

        while let smallest = heap.popMin() {                  // always the global minimum
          buffer.append(contentsOf: (smallest.line + "\n").utf8)
          if buffer.count > 1 << 18 { try handle.write(contentsOf: buffer); buffer.removeAll(keepingCapacity: true) }
          if let next = try await iterators[smallest.run].next() {
            heap.insert(Head(line: next, run: smallest.run))
          }
        }
        try handle.write(contentsOf: buffer)
        try handle.close()
        _ = try FileManager.default.replaceItemAt(out, withItemAt: temp)
      }
  - id: algorithm-an-offset-index-for-random-access
    kind: code
    title: Algorithm — an offset index for random access
    note: Build once, then seek to any line in O(1).
    code: |-
      /// Byte offset of the start of every line. ~8 bytes of index per line.
      func buildIndex(for url: URL) throws -> [UInt64] {
        var offsets: [UInt64] = [0]
        let handle = try FileHandle(forReadingFrom: url)
        defer { try? handle.close() }
        var position: UInt64 = 0

        while let chunk = try handle.read(upToCount: 1 << 16), !chunk.isEmpty {
          for (i, byte) in chunk.enumerated() where byte == UInt8(ascii: "\n") {
            offsets.append(position + UInt64(i) + 1)
          }
          position += UInt64(chunk.count)
        }
        offsets.removeLast()                    // the trailing newline starts nothing
        return offsets
      }

      func line(_ n: Int, in url: URL, index: [UInt64]) throws -> String {
        let handle = try FileHandle(forReadingFrom: url)
        defer { try? handle.close() }
        try handle.seek(toOffset: index[n])
        let length = Int((n + 1 < index.count ? index[n + 1] : .max) - index[n])
        let data = try handle.read(upToCount: min(length, 1 << 20)) ?? Data()
        return String(decoding: data, as: UTF8.self).trimmingCharacters(in: .newlines)
      }

      // Fixed-width records? Skip the index entirely: offset = n * recordSize,
      // and you can BINARY SEARCH a sorted file in O(log n) seeks.
  - id: algorithm-tail-dedupe-sample-checksum
    kind: code
    title: Algorithm — tail, dedupe, sample, checksum
    note: Four one-pass operations you'll actually be asked for.
    code: |-
      // tail -n: seek backwards in blocks until you've counted enough newlines
      func lastLines(_ count: Int, of url: URL) throws -> [String] {
        let handle = try FileHandle(forReadingFrom: url)
        defer { try? handle.close() }
        let size = try handle.seekToEnd()
        var offset = size, found = 0, blob = Data()

        while offset > 0, found <= count {
          let block = UInt64(min(1 << 16, Int(offset)))
          offset -= block
          try handle.seek(toOffset: offset)
          let chunk = try handle.read(upToCount: Int(block)) ?? Data()
          found += chunk.filter { $0 == UInt8(ascii: "\n") }.count
          blob = chunk + blob
        }
        return String(decoding: blob, as: UTF8.self)
          .split(separator: "\n", omittingEmptySubsequences: true).suffix(count).map(String.init)
      }

      // Dedupe a huge file without holding every line: store 8-byte hashes, not strings.
      var seen = Set<Int>()
      for try await line in url.lines where seen.insert(line.hashValue).inserted {
        try out.append(line)          // collisions are possible - use SHA256 if exactness matters
      }

      // Uniform sample of k lines from a file of unknown length (reservoir sampling)
      var sample: [String] = []; var n = 0
      for try await line in url.lines {
        n += 1
        if sample.count < k { sample.append(line) }
        else { let j = Int.random(in: 0..<n); if j < k { sample[j] = line } }
      }

      // Streaming SHA-256: never load the file to hash it
      import CryptoKit
      var hasher = SHA256()
      let handle = try FileHandle(forReadingFrom: url)
      while let chunk = try handle.read(upToCount: 1 << 20), !chunk.isEmpty { hasher.update(data: chunk) }
      let digest = hasher.finalize().map { String(format: "%02x", $0) }.joined()
  - id: enumerating-directories
    kind: code
    title: Enumerating directories
    note: The lazy enumerator with prefetched keys is the only scalable option.
    code: |-
      let keys: [URLResourceKey] = [.isDirectoryKey, .fileSizeKey, .contentModificationDateKey]

      guard let walker = FileManager.default.enumerator(
        at: root,
        includingPropertiesForKeys: keys,             // batch-fetched: one stat per file, not three
        options: [.skipsHiddenFiles, .skipsPackageDescendants],
        errorHandler: { url, error in
          Logger.files.error("Skipping \(url.lastPathComponent): \(error.localizedDescription)")
          return true                                 // keep walking
        }
      ) else { return }

      var totalBytes = 0
      for case let url as URL in walker {
        let values = try url.resourceValues(forKeys: Set(keys))
        if values.isDirectory == true {
          if url.lastPathComponent == "node_modules" { walker.skipDescendants() }
          continue
        }
        totalBytes += values.fileSize ?? 0
      }

      // contentsOfDirectory(at:) loads the whole listing into an array — fine for a
      // handful of files, quadratic pain for a deep tree.
  - id: attributes-backup-exclusion-protection
    kind: code
    title: Attributes, backup exclusion & protection
    note: ""
    code: |-
      // Read metadata
      let values = try url.resourceValues(forKeys: [.fileSizeKey, .contentModificationDateKey,
                                                    .totalFileAllocatedSizeKey])
      let bytes = values.fileSize ?? 0
      let modified = values.contentModificationDate

      // Keep a big regenerable cache out of iCloud/iTunes backups
      var writable = URLResourceValues()
      writable.isExcludedFromBackup = true
      try url.setResourceValues(&writable)          // note: mutating, takes inout

      // Data protection: the file is unreadable while the device is locked
      try FileManager.default.setAttributes(
        [.protectionKey: FileProtectionType.completeUnlessOpen],
        ofItemAtPath: url.path(percentEncoded: false)
      )
      // .complete                                -> locked device = unreadable
      // .completeUnlessOpen                      -> can keep writing a file opened while unlocked
      // .completeUntilFirstUserAuthentication    -> readable after the first unlock since boot
      // .none                                    -> always readable (background work, low sensitivity)

      // Free space before a big download
      let capacity = try URL.documentsDirectory
        .resourceValues(forKeys: [.volumeAvailableCapacityForImportantUsageKey])
        .volumeAvailableCapacityForImportantUsage
  - id: shared-containers-coordinated-access
    kind: code
    title: Shared containers & coordinated access
    note: The moment a widget or extension reads the same file, you need coordination.
    code: |-
      // App Group container — shared with widgets, share sheets, Siri intents
      guard let shared = FileManager.default
        .containerURL(forSecurityApplicationGroupIdentifier: "group.com.example.app")
      else { throw FileError.noContainer }

      // Two processes = two writers. NSFileCoordinator serialises them.
      let coordinator = NSFileCoordinator(filePresenter: nil)
      var coordinationError: NSError?
      coordinator.coordinate(writingItemAt: url, options: .forReplacing,
                             error: &coordinationError) { writableURL in
        try? data.write(to: writableURL, options: .atomic)
      }
      if let coordinationError { throw coordinationError }

      // Reading side
      coordinator.coordinate(readingItemAt: url, options: [], error: &coordinationError) { readableURL in
        text = try? String(contentsOf: readableURL, encoding: .utf8)
      }

      // User-picked files (document picker, drag & drop) are security-scoped:
      guard url.startAccessingSecurityScopedResource() else { throw FileError.denied }
      defer { url.stopAccessingSecurityScopedResource() }
      // To keep the permission across launches, persist a bookmark:
      let bookmark = try url.bookmarkData(options: .minimalBookmark)
      var stale = false
      let restored = try URL(resolvingBookmarkData: bookmark, bookmarkDataIsStale: &stale)
  - id: concurrency-files-are-blocking-work
    kind: code
    title: "Concurrency: files are blocking work"
    note: ""
    code: |-
      // Foundation's file APIs are synchronous and block the calling thread.
      // Never call them from @MainActor code, and never from an actor that other
      // work needs to enter quickly.

      // Good: nonisolated so it runs off the caller's actor
      struct FileStore: Sendable {
        let root: URL

        nonisolated func read(_ name: String) throws -> Data {
          try Data(contentsOf: root.appending(path: name))
        }
      }

      // Good: one actor owning one file, so writes can't interleave
      actor DocumentStore {
        private let url: URL
        private var cached: Document?

        func save(_ document: Document) throws {
          try JSONEncoder().encode(document).write(to: url, options: .atomic)
          cached = document
        }
      }

      // FileHandle, FileManager and NSFileCoordinator are NOT Sendable.
      // Create and use them inside one isolation domain; pass URLs (which are Sendable) around.

      // Parallel reads of independent files are a genuine win on SSDs:
      let contents = try await withThrowingTaskGroup(of: (URL, Data).self) { group in
        for url in urls { group.addTask { (url, try Data(contentsOf: url)) } }
        return try await group.reduce(into: [:]) { $0[$1.0] = $1.1 }
      }
  - id: error-handling
    kind: table
    title: Error handling
    note: Match on the specific error instead of checking first.
    headers:
      - Situation
      - Error you'll catch
    rows:
      - - File missing
        - "`CocoaError.fileNoSuchFile` / `POSIXError(.ENOENT)`"
      - - No permission
        - "`CocoaError.fileReadNoPermission`, `.fileWriteNoPermission`"
      - - Disk full
        - "`CocoaError.fileWriteOutOfSpace`"
      - - Read-only volume
        - "`CocoaError.fileWriteVolumeReadOnly`"
      - - Bad text encoding
        - "`CocoaError.fileReadInapplicableStringEncoding`"
      - - Destination exists (`.withoutOverwriting`)
        - "`CocoaError.fileWriteFileExists`"
      - - Device locked (data protection)
        - "`POSIXError(.EPERM)` on open"
      - - Any of the above, generically
        - "`catch let error as CocoaError { error.code }`"
  - id: rules-that-prevent-data-loss
    kind: rules
    title: Rules that prevent data loss
    note: ""
    items:
      - tone: good
        text: "**Every user-visible write is atomic.** `.atomic` or `replaceItemAt`, no exceptions."
      - tone: good
        text: "**Write to a sibling temp file**, never to another volume — `rename` is only atomic within one filesystem."
      - tone: good
        text: "**Append-only + periodic compaction** beats in-place mutation for anything log-shaped."
      - tone: good
        text: "**Size determines the API.** Whole-file load under a megabyte, mmap in the middle, stream above."
      - tone: good
        text: "**Batch your syscalls.** 64–256 KB per write; per-line writes are orders of magnitude slower."
      - tone: good
        text: "**Clean up your temp files** in a `defer`, including on the error path."
      - tone: good
        text: "**Test with a real-sized fixture.** A 4 KB test file proves nothing about a 4 GB import."
      - tone: bad
        text: Don't `fileExists` then act — the answer is stale before you use it.
      - tone: bad
        text: Don't truncate a file before you have the replacement bytes safely on disk.
      - tone: bad
        text: Don't put a growing database in Caches — the system will delete it, usually in the field.
      - tone: bad
        text: Don't assume the main thread. Blocking file I/O on `@MainActor` is a watchdog termination waiting to happen.
      - tone: neutral
        text: "If the data is structured, mutable and queried, stop writing files: use SQLite, SwiftData or Core Data. They already solved journaling, atomicity and partial updates."
  - id: testing-file-code
    kind: code
    title: Testing file code
    note: Isolated temp directory per test, torn down whatever happens.
    code: |-
      struct FileStoreTests {
        /// A unique directory per test instance — Swift Testing runs them in parallel.
        final class Sandbox {
          let root: URL
          init() throws {
            root = URL.temporaryDirectory.appending(path: "test-\(UUID().uuidString)")
            try FileManager.default.createDirectory(at: root, withIntermediateDirectories: true)
          }
          deinit { try? FileManager.default.removeItem(at: root) }
        }

        @Test func atomicWriteLeavesNoTempFiles() throws {
          let sandbox = try Sandbox()
          let target = sandbox.root.appending(path: "doc.json")

          try Data("{}".utf8).write(to: target, options: .atomic)

          let remaining = try FileManager.default
            .contentsOfDirectory(atPath: sandbox.root.path(percentEncoded: false))
          #expect(remaining == ["doc.json"])
        }

        @Test func readingAMissingFileThrowsNoSuchFile() {
          #expect(throws: CocoaError.self) {
            _ = try Data(contentsOf: URL.temporaryDirectory.appending(path: "nope"))
          }
        }
      }
