id: combine-core
concept: reactive.streams-core
scope: platform
title: Combine — Core
group: Combine
subtitle: Publisher -> Operator -> Subscriber. Output + Failure are part of the type.
applies:
  platforms:
    - ios
    - ipados
    - macos
    - tvos
    - watchos
    - visionos
  requires:
    - Combine
sources:
  - title: Combine — Apple Developer Documentation
    url: https://developer.apple.com/documentation/combine
cards:
  - id: mental-model
    kind: rules
    title: Mental model
    note: ""
    items:
      - tone: modern
        text: "`Publisher<Output, Failure>` emits 0…n values then **either** `.finished` **or** `.failure` — never both, never after."
      - tone: modern
        text: "`Subscriber` requests demand (backpressure). `sink`/`assign` request `.unlimited`."
      - tone: modern
        text: A pipeline is inert until subscribed, and dies when its `AnyCancellable` deallocates.
      - tone: neutral
        text: "`Failure == Never` means the compiler knows it can't fail — required by `assign(to:on:)`."
      - tone: neutral
        text: "`.eraseToAnyPublisher()` hides the huge generic type at API boundaries."
  - id: creating-publishers
    kind: code
    title: Creating publishers
    note: ""
    code: |-
      Just(42)                                   // one value, then finish. Failure == Never
      Empty<Int, Never>()                        // finish immediately
      Fail<Int, MyError>(error: .boom)           // fail immediately
      [1, 2, 3].publisher                        // Sequence
      Future<Int, Error> { promise in            // single async result, EAGER
        api.load { promise(.success($0)) }
      }
      Deferred { Future { ... } }                // make Future lazy (one call per subscriber)

      URLSession.shared.dataTaskPublisher(for: url)
      Timer.publish(every: 1, on: .main, in: .common).autoconnect()
      NotificationCenter.default.publisher(for: UIApplication.didBecomeActiveNotification)
      $searchText                                // @Published projected value
  - id: subjects-imperative-bridge-into-combine
    kind: code
    title: Subjects — imperative bridge into Combine
    note: ""
    code: |-
      let events = PassthroughSubject<Event, Never>()      // no memory of last value
      let state  = CurrentValueSubject<State, Never>(.idle) // replays current value on subscribe

      events.send(.tapped)
      state.send(.loading)
      state.value = .loaded          // CurrentValueSubject only
      events.send(completion: .finished)

      // @Published is a CurrentValueSubject in disguise
      final class VM: ObservableObject {
        @Published var query = ""
        @Published private(set) var results: [Item] = []
      }
  - id: operators-you-actually-need
    kind: table
    title: Operators you actually need
    note: ""
    headers:
      - Category
      - Operators
    rows:
      - - Transform
        - "`map` `tryMap` `compactMap` `flatMap` `scan` `reduce` `replaceNil` `setFailureType`"
      - - Filter
        - "`filter` `removeDuplicates` `first(where:)` `dropFirst` `prefix` `ignoreOutput`"
      - - Combine
        - "`combineLatest` `zip` `merge` `switchToLatest` `Publishers.MergeMany`"
      - - Timing
        - "`debounce` `throttle` `delay` `timeout` `measureInterval`"
      - - Errors
        - "`catch` `tryCatch` `retry` `replaceError` `mapError` `assertNoFailure`"
      - - Scheduling
        - "`receive(on:)` `subscribe(on:)`"
      - - Sharing
        - "`share()` `multicast` `makeConnectable()`"
      - - Side effects
        - "`handleEvents(receiveOutput:receiveCompletion:)` (debugging), `print()`"
      - - Sinks
        - "`sink` `assign(to:on:)` `assign(to: &$published)`"
  - id: flatmap-vs-switchtolatest-vs-combinelatest-vs-zip
    kind: compare
    title: flatMap vs switchToLatest vs combineLatest vs zip
    note: The most-asked Combine question.
    columns:
      - label: flatMap / switchToLatest
        tone: neutral
        code: |-
          // flatMap: keeps ALL inner publishers alive
          $query.flatMap { api.search($0) }        // stale results can arrive late

          // switchToLatest: cancels the previous inner publisher
          $query
            .map { api.search($0) }
            .switchToLatest()                      // correct for search-as-you-type

          // flatMap(maxPublishers: .max(1)) = serial
      - label: combineLatest / zip / merge
        tone: neutral
        code: |-
          // combineLatest: emits on ANY input change, using latest of each
          Publishers.CombineLatest($email, $password)
            .map { !$0.isEmpty && $1.count >= 8 }
            .assign(to: &$isValid)

          // zip: pairs by index, waits for both. 1+1 -> 1 emission
          Publishers.Zip(uploadA, uploadB)

          // merge: interleaves, same Output type
          Publishers.Merge($fromCache, $fromNetwork)
  - id: networking-pipeline
    kind: code
    title: Networking pipeline
    note: The canonical whiteboard answer.
    code: |-
      func search(_ query: String) -> AnyPublisher<[Repo], APIError> {
        var components = URLComponents(string: "https://api.github.com/search/repositories")!
        components.queryItems = [.init(name: "q", value: query)]

        return URLSession.shared.dataTaskPublisher(for: components.url!)
          .tryMap { data, response in
            guard let http = response as? HTTPURLResponse, 200..<300 ~= http.statusCode else {
              throw APIError.badStatus
            }
            return data
          }
          .decode(type: SearchResponse.self, decoder: JSONDecoder())
          .map(\.items)
          .mapError { $0 as? APIError ?? .underlying($0) }
          .receive(on: DispatchQueue.main)
          .eraseToAnyPublisher()
      }

      // Wiring it up
      $query
        .debounce(for: .milliseconds(300), scheduler: RunLoop.main)
        .removeDuplicates()
        .filter { $0.count > 2 }
        .map { [search] q in search(q).catch { _ in Just([]) } }
        .switchToLatest()
        .assign(to: &$repos)
  - id: subscribing-lifetime
    kind: code
    title: Subscribing & lifetime
    note: ""
    code: |-
      private var cancellables = Set<AnyCancellable>()

      publisher
        .sink(
          receiveCompletion: { completion in
            if case let .failure(error) = completion { self.show(error) }
          },
          receiveValue: { value in self.items = value }
        )
        .store(in: &cancellables)

      // Failure == Never shortcuts
      publisher.sink { self.items = $0 }.store(in: &cancellables)
      publisher.assign(to: \.text, on: label).store(in: &cancellables)
      publisher.assign(to: &$items)              // @Published target, no cancellable needed

      // assign(to:on:) retains `on` -> use [weak self] in sink instead of assign(to:on: self)
  - id: combine-async-await-bridging
    kind: compare
    title: Combine ↔ async/await bridging
    note: You will be asked how to migrate.
    columns:
      - label: Publisher → async
        tone: modern
        code: |-
          for await value in publisher.values { ... }

          // single value
          let user = try await publisher
            .first()
            .values
            .first(where: { _ in true })

          // or the common helper:
          extension Publisher {
            var firstValue: Output {
              get async throws {
                for try await v in values { return v }
                throw CancellationError()
              }
            }
          }
      - label: async → Publisher
        tone: modern
        code: |-
          func publisher<T>(_ op: @escaping () async throws -> T)
            -> AnyPublisher<T, Error> {
            Deferred {
              Future { promise in
                Task {
                  do { promise(.success(try await op())) }
                  catch { promise(.failure(error)) }
                }
              }
            }
            .eraseToAnyPublisher()
          }
  - id: combine-gotchas
    kind: rules
    title: Combine gotchas
    note: ""
    items:
      - tone: bad
        text: "`Future` is eager — it runs at creation, not at subscription. Wrap in `Deferred`."
      - tone: bad
        text: Forgetting `.store(in:)` → pipeline cancelled immediately, nothing happens.
      - tone: bad
        text: "`assign(to:\\.x, on: self)` creates a retain cycle. Use `sink { [weak self] }`."
      - tone: bad
        text: "`subscribe(on:)` affects the *subscription*, `receive(on:)` affects delivery downstream of it."
      - tone: bad
        text: An error terminates the stream forever. Use `catch`/`replaceError` **inside** a `flatMap` to keep the outer stream alive.
      - tone: legacy
        text: Combine has no built-in backpressure control in `sink` — it requests unlimited demand.
