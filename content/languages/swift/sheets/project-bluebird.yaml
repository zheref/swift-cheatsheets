        text: "Inject the session, check HTTP status, then decode. `index.html#project-bluebird--apod-client`"
      - tone: neutral
        text: "Use the date as the row ID and expect unfamiliar media. `index.html#project-bluebird--apod-model`"
      - tone: neutral
        text: "Drive the list and detail from explicit load state. `index.html#project-bluebird--apod-list`"
      - tone: neutral
        text: "Show images inline and route video by URL type. `index.html#project-bluebird--apod-detail`"
      - tone: neutral
        text: "Bound the image cache and keep HTTP cache policy on the session. `index.html#networking--image-data-cache`"
      - tone: neutral
        text: "Page by date and bound retry to transient reads. `index.html#project-bluebird--pagination`"
      - tone: neutral
        text: "Cancel on exit and isolate UI writes to the main actor. `index.html#project-bluebird--cancellation`"
      - tone: neutral
        text: "Stub the injected session and keep an offline fixture. `index.html#project-bluebird--testing`"
      - tone: neutral
        text: "Use Keychain for secrets and LocalAuthentication for a screen gate. `index.html#project-bluebird--face-id`"
      - tone: neutral
        text: "Validate incoming routes and treat silent pushes as best-effort refreshes. `index.html#project-bluebird--deep-links`"
