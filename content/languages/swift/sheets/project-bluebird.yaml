  - id: apod-model
    kind: code
    title: APOD model and offline fixture
    note: Keep the API's fixed-width `yyyy-MM-dd` calendar date as a string for identity and ordering. The synthesized Codable conformance preserves unfamiliar wire values while the UI has an explicit `other` branch.
    applies:
      platforms: [ios, macos]
      runtime: Swift toolchain
      requires: [Foundation]
    prerequisites:
      - Save as `APODEntry.swift`. The fixture has no media URLs, so both rows work offline.
    validation:
      status: compiled
      toolchain: Swift 6.4, Swift 6 language mode
      date: "2026-11-17"
    expected: The fixture yields an image entry and a video entry with distinct calendar dates.
    code: |-
      import Foundation

      struct APODEntry: Codable, Identifiable, Sendable {
          enum Media { case image, video, other }

          let date: String
          let title: String
          let explanation: String
          let url: URL?
          private let mediaType: String

          var id: String { date }
          var media: Media {
              switch mediaType {
              case "image": .image
              case "video": .video
              default: .other
              }
          }

          private enum CodingKeys: String, CodingKey {
              case date, title, explanation, url
              case mediaType = "media_type"
          }

          static func fixture() throws -> [Self] {
              let json = """
              [
                {"date":"2024-01-02","title":"A violet moon",
                 "explanation":"An imaginary moon rises above a crater.","media_type":"image"},
                {"date":"2024-01-01","title":"A comet in motion",
                 "explanation":"An imaginary comet passes a ringed planet.","media_type":"video"}
              ]
              """
              return try JSONDecoder().decode([Self].self, from: Data(json.utf8))
          }
      }
  - id: apod-client
    kind: code
    title: APOD range client
    note: "The legacy range response is an array. DEMO_KEY allows 30 requests per hour and 50 per day per IP. NASA lists December 1, 2026 as the legacy API archive date. Use the fixture for a repeatable exercise, or adapt this client to the replacement feed."
    applies:
      platforms: [ios, macos]
      runtime: Swift toolchain
      requires: [Foundation]
    sources:
      - title: NASA Open APIs and APOD
        url: https://api.nasa.gov/
      - title: NASA demo-key rate limits
        url: https://api.nasa.gov/assets/html/authentication.html
      - title: NASA APOD API migration notice
        url: https://api.nasa.gov/assets/html/header.html
    prerequisites:
      - Compile alongside the model from `index.html#project-bluebird--apod-model`. Pass an ephemeral, stubbed session in tests.
      - Supply an inclusive date range with `yyyy-MM-dd` calendar dates.
    validation:
      status: compiled
      toolchain: Swift 6.4, Swift 6 language mode
      date: "2026-11-17"
    expected: A successful response yields the newest entries first. Non-2xx responses throw before decoding.
    code: |-
      import Foundation

      struct APODClient: Sendable {
          enum RequestError: Error {
              case invalidURL, nonHTTPResponse, status(Int)
          }

          let session: URLSession

          func entries(from start: String, through end: String) async throws -> [APODEntry] {
              var endpoint = URLComponents()
              endpoint.scheme = "https"
              endpoint.host = "api.nasa.gov"
              endpoint.path = "/planetary/apod"
              endpoint.queryItems = [
                  URLQueryItem(name: "api_key", value: "DEMO_KEY"),
                  URLQueryItem(name: "start_date", value: start),
                  URLQueryItem(name: "end_date", value: end)
              ]
              guard let url = endpoint.url else { throw RequestError.invalidURL }

              let (data, response) = try await session.data(from: url)
              guard let http = response as? HTTPURLResponse else {
                  throw RequestError.nonHTTPResponse
              }
              guard (200..<300).contains(http.statusCode) else {
                  throw RequestError.status(http.statusCode)
              }

              return try JSONDecoder().decode([APODEntry].self, from: data)
                  .sorted { $0.date > $1.date }
          }
      }
  - id: apod-list
    kind: code
    title: SwiftUI list with five load states
    note: Inject a loader so the same list runs with a session, a stub or a fixture. SwiftUI cancels the list's task when it disappears and restarts it when the retry ID changes.
    applies:
      platforms: [ios]
      runtime: iOS 16+
      requires: [SwiftUI]
    prerequisites:
      - Add the APOD model, range client and detail in the same app target.
      - >-
        For a live attempt, present `APODList { try await APODClient(session: .shared)
        .entries(from: "2024-01-01", through: "2024-01-02") }`.
      - For a deterministic run, present `APODList { try APODEntry.fixture() }`.
    validation:
      status: excerpt
      host: an iOS app with SwiftUI
    expected: Loading ends in rows, empty or failure. A failed request offers retry or an explicit offline fixture.
    code: |-
      import SwiftUI

      @MainActor
      struct APODList: View {
          private enum State {
              case idle, loading, loaded([APODEntry]), empty, failed
          }

          @State private var state = State.idle
          @State private var attempt = 0
          let load: @Sendable () async throws -> [APODEntry]

          var body: some View {
              NavigationStack {
                  Group {
                      switch state {
                      case .idle, .loading:
                          ProgressView("Loading entries")
                      case .loaded(let entries):
                          List(entries) { entry in
                              NavigationLink {
                                  APODDetail(entry: entry)
                              } label: {
                                  VStack(alignment: .leading) {
                                      Text(entry.title)
                                      Text(entry.date).foregroundStyle(.secondary)
                                  }
                              }
                          }
                      case .empty:
                          Text("No entries in this date range.")
                      case .failed:
                          VStack(spacing: 12) {
                              Text("Couldn’t load entries.")
                              Button("Retry") { attempt += 1 }
                              Button("Use offline fixture") {
                                  if let entries = try? APODEntry.fixture() {
                                      state = .loaded(entries)
                                  }
                              }
                          }
                      }
                  }
                  .navigationTitle("Daily sky")
                  .task(id: attempt) { await refresh() }
              }
          }

          private func refresh() async {
              switch state {
              case .loaded, .empty: return
              case .idle, .loading, .failed: break
              }
              state = .loading
              do {
                  let entries = try await load()
                  try Task.checkCancellation()
                  state = entries.isEmpty ? .empty : .loaded(entries)
              } catch is CancellationError {
                  return
              } catch {
                  guard !Task.isCancelled else { return }
                  state = .failed
              }
          }
      }
  - id: apod-detail
    kind: code
    title: SwiftUI detail by media kind
    note: APOD video URLs may point to a hosted player. Open those as links and reuse `index.html#video-streaming--play-hls-in-swiftui` for direct HLS streams.
    applies:
      platforms: [ios]
      runtime: iOS 16+
      requires: [SwiftUI]
    prerequisites:
      - Add the model from `index.html#project-bluebird--apod-model` to the app target.
    validation:
      status: excerpt
      host: an iOS app with SwiftUI
    expected: The detail shows the explanation and routes media by kind. A missing image or video URL has an offline state.
    code: |-
      import SwiftUI

      struct APODDetail: View {
          let entry: APODEntry

          var body: some View {
              ScrollView {
                  VStack(alignment: .leading, spacing: 12) {
                      switch entry.media {
                      case .image:
                          if let url = entry.url {
                              AsyncImage(url: url) { phase in
                                  if let image = phase.image {
                                      image.resizable().scaledToFit()
                                  } else if phase.error != nil {
                                      Label("Image unavailable", systemImage: "photo")
                                  } else {
                                      ProgressView("Loading image")
                                  }
                              }
                          } else {
                              Label("Image unavailable offline", systemImage: "photo")
                          }
                      case .video:
                          if let url = entry.url {
                              Link("Open video", destination: url)
                          } else {
                              Label("Video unavailable offline", systemImage: "video")
                          }
                      case .other:
                          Text("Unsupported media")
                      }
                      Text(entry.explanation)
                  }
                  .padding()
              }
              .navigationTitle(entry.title)
          }
      }
  - id: push-basics
    kind: table
    title: Push registration and delivery
    note: Start with one refresh action that the list can call from a foreground event or background callback.
    applies:
      platforms: [ios]
      requires: [UIKit, UserNotifications]
    headers: [Step, What to do]
    rows:
      - ["Register", "Enable Push Notifications and call `UIApplication.shared.registerForRemoteNotifications()` at launch. Request alert, sound or badge authorization through `UNUserNotificationCenter` when the app needs visible notifications."]
      - ["Device token", "Forward the current token from `application(_:didRegisterForRemoteNotificationsWithDeviceToken:)` to your provider. Handle `application(_:didFailToRegisterForRemoteNotificationsWithError:)` and register again on later launches."]
      - ["Foreground alert", "Assign a `UNUserNotificationCenterDelegate` at launch. Return presentation options such as `[.banner, .sound]` from `userNotificationCenter(_:willPresent:)` when an alert should appear."]
      - ["Silent refresh", "Enable Background Modes → Remote notifications. Send `{\"aps\":{\"content-available\":1}}` with `apns-push-type: background` and `apns-priority: 5`. Refresh in `application(_:didReceiveRemoteNotification:fetchCompletionHandler:)` and report the result promptly. Delivery is best effort."]
  - id: link-routing
    kind: table
    title: Link routing and associated domains
    note: Parse both URL forms to the same entry date. Queue a route until the list can resolve the entry.
    applies:
      platforms: [ios]
      requires: [SwiftUI, UIKit]
    headers: [Route, Setup and delivery]
    rows:
      - ["Custom scheme", "Register `bluebird` under URL Types. Handle `bluebird://entry/2024-01-02` in SwiftUI's `onOpenURL` or UIKit's `scene(_:openURLContexts:)`."]
      - ["Universal link", "Add `applinks:example.com` to Associated Domains. Serve `/.well-known/apple-app-site-association` over HTTPS with the app ID and `/entry/*` in its route components. With the app absent, `https://example.com/entry/2024-01-02` opens the website."]
      - ["Universal link delivery", "SwiftUI receives the URL via `onOpenURL`. UIKit reads `NSUserActivity.webpageURL` for `NSUserActivityTypeBrowsingWeb` in `scene(_:continue:)`. For a cold start with a UIKit scene, check the URL contexts and user activities in the scene connection options."]
      - ["Validate and navigate", "Check the expected scheme, host, path and calendar date. Resolve the date to an entry and select it in the same navigation state used by a row tap."]
