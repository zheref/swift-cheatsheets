  - id: costs-per-type
    kind: table
    title: Costs, per type
    note: The table interviewers and profilers both care about.
    headers:
      - Type
      - Lookup
      - Insert
      - Remove
      - Ordered?
      - Notes
    rows:
      - - "`Array`"
        - O(1) by index, O(n) by value
        - O(1)* append, O(n) insert
        - O(1)* last, O(n) other
        - yes
        - "*amortised; contiguous storage"
      - - "`ContiguousArray`"
        - same
        - same
        - same
        - yes
        - skips ObjC bridging — for class elements
      - - "`ArraySlice`"
        - O(1)
        - —
        - —
        - yes
        - shares the parent's buffer **and keeps it alive**
      - - "`Set`"
        - O(1) avg
        - O(1) avg
        - O(1) avg
        - no
        - order varies between launches
      - - "`Dictionary`"
        - O(1) avg
        - O(1) avg
        - O(1) avg
        - no
        - "same; `Key: Hashable`"
      - - "`String`"
        - O(n) — no Int index
        - O(1) append
        - O(n)
        - yes
        - grapheme clusters; `count` is O(n)
      - - "`Deque`"
        - O(1) by index
        - O(1) **both ends**
        - O(1) both ends
        - yes
        - swift-collections
      - - "`OrderedSet`"
        - O(1) by element, O(1) by index
        - O(1) append
        - O(n) middle
        - yes
        - Set semantics + a RandomAccess view
      - - "`OrderedDictionary`"
        - O(1)
        - O(1) append
        - O(n) middle
        - yes
        - stable iteration order
      - - "`Heap`"
        - O(1) min/max only
        - O(log n)
        - O(log n)
        - partial
        - priority queue; no arbitrary lookup
      - - "`BitSet`"
        - O(1)
        - O(1)
        - O(1)
        - yes (numeric)
        - 1 bit per element; fast set algebra
