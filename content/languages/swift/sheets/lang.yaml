id: lang
concept: language.essentials
scope: language
title: Swift Language Essentials
group: Design & Language
subtitle: Generics, protocols, memory and error handling — the fill-in-the-blank parts of a live exercise.
sources:
  - title: The Swift Programming Language
    url: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/
