  - id: whiteboard-pipeline
    kind: table
    title: Design CI/CD for a multi-team retail iOS app
    note: Fill each blank aloud for Shop Demo. Draw the flow from a feature PR through a customer completing
      checkout.
    headers:
      - Prompt
      - Answer frame
    rows:
      - - Ownership and cut
        - Feature teams own ___. The release captain cuts ___ from ___ when ___. Late changes ___.
      - - Fast feedback
        - A PR runs ___ on ___. A change to a shared module also tests ___. Main and nightly add ___.
      - - Identity and approval
        - The protected job signs ___ using ___. We promote the exact build ___ after ___ approves ___.
      - - Exposure and evidence
        - The store controls ___. Our flag controls ___. We compare ___ with ___ and pause when ___.
      - - Recovery
        - On-call can disable ___ without a binary. A patch starts at ___ and recovery is confirmed by ___.
  - id: hotfix-drill
    kind: rules
    title: Hotfix drill · checkout crashes during the 5% phase
    note: Set a one-minute timer. Checkout crashes for some sessions after the 5% phased release. Speak as the
      on-call engineer and hand the release decision to the captain.
    items:
      - tone: neutral
        text: "**Contain.** “I’ll disable the new checkout path, page the captain and pause automatic updates.
          Customers who already updated still need a working checkout.”"
      - tone: neutral
        text: "**Diagnose.** “I’ll compare affected and healthy builds, flag cohorts and checkout completions. I’ll
          symbolicate a crash using the matching dSYM and reproduce it with a synthetic cart.”"
      - tone: neutral
        text: "**Repair.** “I’ll branch from the store tag, fix and forward-port to main. The patch gets a fresh build
          number, a regression test for the crash and a signed checkout smoke run.”"
      - tone: neutral
        text: "**Recover.** “With approval we’ll submit the tested build and request expedited review if warranted.
          We’ll watch successful checkouts and crashes by build before restoring exposure.”"
    sources:
      - title: Phased release · retrieved 2026-11-25
        url: https://developer.apple.com/help/app-store-connect/update-your-app/release-a-version-update-in-phases/
      - title: App Review timing and expedite requests · retrieved 2026-11-25
        url: https://developer.apple.com/distribute/app-review/
