id: networking
concept: networking.rest
scope: platform
title: "Networking — REST with URLSession"
group: iOS Platform
subtitle: "Typed requests, one small client, typed errors, retry, token refresh, pagination, caching, progress and background transfers — all on URLSession."
applies:
  platforms:
    - ios
    - ipados
    - macos
    - tvos
    - watchos
    - visionos
  runtime: Swift toolchain
  requires:
    - Foundation
  versions:
    swift: ">=6.0"
    ios: ">=16"
sources:
  - title: URL Loading System — Apple Developer Documentation
    url: https://developer.apple.com/documentation/foundation/url-loading-system
  - title: URLSession — Apple Developer Documentation
    url: https://developer.apple.com/documentation/foundation/urlsession
  - title: URLCache — Apple Developer Documentation
