id: ps-operations
concept: collections.operations
scope: shared
title: Filter, transform and count
group: Programming and automation
subtitle: Count matching records without depending on their display format.
applies:
  platforms:
    - windows
    - macos
  runtime: PowerShell 7 (pwsh)
  versions:
    powershell: ">=7.0"
sources:
  - title: PowerShell documentation
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pipelines
cards:
  - id: example
    kind: code
    title: Count records by value
    note: Group-Object produces objects with Name and Count. Sort explicitly before comparing a report across runs.
    prerequisites:
      - Save as demo.ps1 in an empty directory and run pwsh -NoProfile -File ./demo.ps1.
    code: |-
      'build', 'test', 'build' |
          Group-Object |
          Sort-Object Name |
          ForEach-Object { "$($_.Name)=$($_.Count)" }
    expected: |-
      build=2
      test=1
    validation:
      status: ran
      toolchain: PowerShell 7.7.0 on macOS arm64
      date: 2026-11-19
