id: ps-functional
concept: principles.functional
scope: shared
title: Pure transformations
group: Programming and automation
subtitle: Transform each record independently so the same input gives the same result.
applies:
  platforms:
    - windows
    - macos
  runtime: PowerShell 7 (pwsh)
  versions:
    powershell: ">=7.0"
sources:
  - title: PowerShell documentation
    url: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_script_blocks
cards:
  - id: example
    kind: code
    title: Map without changing the input
    note: A script block can transform one input at a time. Keep file writes and logging at the edge when a pipeline produces reusable values.
    prerequisites:
      - Save as demo.ps1 in an empty directory and run pwsh -NoProfile -File ./demo.ps1.
    code: 2, 4 | ForEach-Object { $_ * 5 }
    expected: |-
      10
      20
    validation:
      status: ran
      toolchain: PowerShell 7.7.0 on macOS arm64
      date: 2026-11-19
